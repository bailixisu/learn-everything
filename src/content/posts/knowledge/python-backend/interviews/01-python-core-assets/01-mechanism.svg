<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">Python 基础面经：对象、拷贝、装饰器与生成器怎么回答</title><desc id="desc">用八组问答和可运行例子理解 Python 容器、对象引用、默认参数、闭包、装饰器、生成器、内存与类型标注。</desc><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAF0FF"/><stop offset="1" stop-color="#F6F8FB"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" viewBox="0 0 10 10"><path d="M2 2 L8 5 L2 8" stroke="#93A7BC" stroke-width="1.8" fill="none"/></marker></defs><rect x="0" y="0" width="1600" height="1040" rx="0" fill="#F6F8FB" stroke="none"/><rect x="0" y="0" width="1600" height="210" rx="0" fill="url(#wash)" stroke="none"/><text x="68" y="66" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#386BEA">LEARN EVERYTHING</text><text x="1532" y="66" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="500" text-anchor="end" fill="#66788B">PYTHON BACKEND   /   01</text><text x="68" y="138" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="48" font-weight="700" text-anchor="start" fill="#172D46">变量指向对象，先把这件事讲清</text><text x="68" y="186" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#66788B">PYTHON CORE   ·   面经机制图</text><rect x="64" y="250" width="1472" height="674" rx="26" fill="#fff" stroke="#E1E7EE"/><path d="M68 963 L1532 963" fill="none" stroke="#D2DCE7" stroke-width="2" stroke-dasharray=""/><text x="68" y="1009" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#66788B">原创教学示意  ·  看清状态、时序与边界，再回答追问</text><text x="1532" y="1009" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="500" text-anchor="end" fill="#66788B">2026 / 09</text><text x="105" y="309" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="650" text-anchor="start" fill="#172D46">同一次 append，谁会跟着改变？</text><text x="116" y="375" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="650" text-anchor="start" fill="#386BEA">赋值 alias = original</text><rect x="116" y="416" width="340" height="112" rx="17" fill="#fff" stroke="#DEE6EF"/><rect x="116" y="416" width="7" height="112" rx="3" fill="#386BEA" stroke="none"/><text x="139" y="459" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="start" fill="#386BEA">外层 dict</text><text x="139" y="499" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#66788B">保存 tags 的引用</text><text x="618" y="375" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="650" text-anchor="start" fill="#078B83">浅拷贝 shallow</text><rect x="618" y="416" width="340" height="112" rx="17" fill="#fff" stroke="#DEE6EF"/><rect x="618" y="416" width="7" height="112" rx="3" fill="#078B83" stroke="none"/><text x="641" y="459" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="start" fill="#078B83">外层 dict</text><text x="641" y="499" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#66788B">保存 tags 的引用</text><text x="1120" y="375" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="650" text-anchor="start" fill="#8053CA">深拷贝 deep</text><rect x="1120" y="416" width="340" height="112" rx="17" fill="#fff" stroke="#DEE6EF"/><rect x="1120" y="416" width="7" height="112" rx="3" fill="#8053CA" stroke="none"/><text x="1143" y="459" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="start" fill="#8053CA">外层 dict</text><text x="1143" y="499" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#66788B">保存 tags 的引用</text><text x="116" y="568" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#66788B">original 与 alias 是同一个 dict</text><text x="618" y="568" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#66788B">新 dict，共享原来的 list</text><text x="1120" y="568" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#66788B">新 dict，内层 list 也复制</text><path d="M286 594 L286 622 L607 622 L607 675" fill="none" stroke="#386BEA" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M788 594 L788 622 L607 622 L607 675" fill="none" stroke="#078B83" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1290 594 L1290 675" fill="none" stroke="#8053CA" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="353" y="679" width="520" height="120" rx="20" fill="#EAF6F4" stroke="none"/><text x="613" y="727" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="650" text-anchor="middle" fill="#078B83">共享 list</text><text x="613" y="773" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="500" text-anchor="middle" fill="#172D46">[&#x27;python&#x27;, &#x27;api&#x27;]</text><rect x="1080" y="679" width="390" height="120" rx="20" fill="#F2EDFB" stroke="none"/><text x="1