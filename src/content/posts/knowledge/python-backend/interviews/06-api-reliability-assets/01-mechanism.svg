<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">后端工程面经：幂等、消息队列、接口排障与部署</title><desc id="desc">用重复下单和接口变慢等场景，解释幂等键、重试、消息可靠性、连接池、可观测性、部署与测试。</desc><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAF0FF"/><stop offset="1" stop-color="#F6F8FB"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" viewBox="0 0 10 10"><path d="M2 2 L8 5 L2 8" stroke="#93A7BC" stroke-width="1.8" fill="none"/></marker></defs><rect x="0" y="0" width="1600" height="1040" rx="0" fill="#F6F8FB" stroke="none"/><rect x="0" y="0" width="1600" height="210" rx="0" fill="url(#wash)" stroke="none"/><text x="68" y="66" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#386BEA">LEARN EVERYTHING</text><text x="1532" y="66" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="500" text-anchor="end" fill="#66788B">PYTHON BACKEND   /   06</text><text x="68" y="138" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="48" font-weight="700" text-anchor="start" fill="#172D46">请求会重试，业务不能重复执行</text><text x="68" y="186" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#66788B">BACKEND ENGINEERING   ·   面经机制图</text><rect x="64" y="250" width="1472" height="674" rx="26" fill="#fff" stroke="#E1E7EE"/><path d="M68 963 L1532 963" fill="none" stroke="#D2DCE7" stroke-width="2" stroke-dasharray=""/><text x="68" y="1009" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#66788B">原创教学示意  ·  看清状态、时序与边界，再回答追问</text><text x="1532" y="1009" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="500" text-anchor="end" fill="#66788B">2026 / 09</text><text x="105" y="310" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="start" fill="#172D46">同一个业务意图重试，复用结果；同键换内容，拒绝冲突</text><rect x="110" y="378" width="380" height="112" rx="17" fill="#fff" stroke="#DEE6EF"/><rect x="110" y="378" width="7" height="112" rx="3" fill="#386BEA" stroke="none"/><text x="133" y="421" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="start" fill="#386BEA">接收请求</text><text x="133" y="461" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#66788B">用户范围 + 幂等键</text><rect x="610" y="378" width="380" height="112" rx="17" fill="#fff" stroke="#DEE6EF"/><rect x="610" y="378" width="7" height="112" rx="3" fill="#078B83" stroke="none"/><text x="633" y="421" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="start" fill="#078B83">原子占位</text><text x="633" y="461" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#66788B">唯一约束 + 请求摘要</text><rect x="1110" y="378" width="380" height="112" rx="17" fill="#fff" stroke="#DEE6EF"/><rect x="1110" y="378" width="7" height="112" rx="3" fill="#8053CA" stroke="none"/><text x="1133" y="421" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="start" fill="#8053CA">首次占位成功</text><text x="1133" y="461" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#66788B">执行业务并保存结果</text><path d="M500 434 L595 434" fill="none" stroke="#386BEA" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1000 434 L1095 434" fill="none" stroke="#386BEA" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M800 503 L800 562 L1300 562 L1300 624" fill="none" stroke="#D57935" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="944" y="546" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="600" text-anchor="start" fill="#D57935">键已存在</text><rect x="1110" y="640" width="380" height="112" rx="17" fill="#fff" stroke="#DEE6EF"/><rect x="1110" y="640" width="7" height="112" rx="3" fill="#D57935" stroke="none"/><text x="1133" y="683" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="start" fill="#D57935">读取已有记录</text><text x="1133" y="723" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#66788B">核对内容与处理状态</text><rect x="610" y="640" width="380" height="112" rx="17" fill="#fff" stroke="#DEE6EF"/><rect x="610" y="640" width="7" height="112" rx="3" fill="#078B83" stroke="none"/><text x="633" y="683" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="start" fill="#078B83">返回已有结果</text><text x="633" y="723" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#66788B">内容一致，且已完成</text><rect x="110" y="640" width="380" height="112" rx="17" fill="#fff" stroke="#DEE6EF"/><rect x="110" y="640" width="7" height="112" rx="3" fill="#B95B64" stroke="none"/><text x="133" y="683" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="start" fill="#B95B64">拒绝冲突</text><text x="133" y="723" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#66788B">同键却提交不同内容</text><path d="M1100 696 L1000 696" fill="none" stroke="#078B83" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1300 764 L1300 812 L300 812 L300 763" fill="none" stroke="#B95B64" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="653" y="845" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="600" text-anchor="start" fill="#B95B64">请求内容不一致</text><text x="105" y="895" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#66788B">处理中需返回明确状态；占位、业务提交与结果保存还要考虑崩溃恢复。</text></svg>