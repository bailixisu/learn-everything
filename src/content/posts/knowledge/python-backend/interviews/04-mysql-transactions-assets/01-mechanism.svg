<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">MySQL 面经：索引、事务、锁与慢查询怎么讲清楚</title><desc id="desc">以 MySQL 8.4 InnoDB 为例，解释联合索引、执行计划、隔离级别、快照读、扣库存、死锁和游标分页。</desc><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAF0FF"/><stop offset="1" stop-color="#F6F8FB"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" viewBox="0 0 10 10"><path d="M2 2 L8 5 L2 8" stroke="#93A7BC" stroke-width="1.8" fill="none"/></marker></defs><rect x="0" y="0" width="1600" height="1040" rx="0" fill="#F6F8FB" stroke="none"/><rect x="0" y="0" width="1600" height="210" rx="0" fill="url(#wash)" stroke="none"/><text x="68" y="66" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#386BEA">LEARN EVERYTHING</text><text x="1532" y="66" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="500" text-anchor="end" fill="#66788B">PYTHON BACKEND   /   04</text><text x="68" y="138" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="48" font-weight="700" text-anchor="start" fill="#172D46">同一行数据，两种读取视角</text><text x="68" y="186" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#66788B">MYSQL / INNODB   ·   面经机制图</text><rect x="64" y="250" width="1472" height="674" rx="26" fill="#fff" stroke="#E1E7EE"/><path d="M68 963 L1532 963" fill="none" stroke="#D2DCE7" stroke-width="2" stroke-dasharray=""/><text x="68" y="1009" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#66788B">原创教学示意  ·  看清状态、时序与边界，再回答追问</text><text x="1532" y="1009" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="500" text-anchor="end" fill="#66788B">2026 / 09</text><text x="160" y="322" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="650" text-anchor="start" fill="#172D46">事务 A · RR</text><path d="M220 355 L220 796" fill="none" stroke="#D9E2EC" stroke-width="2" stroke-dasharray="6 8"/><text x="680" y="322" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="650" text-anchor="start" fill="#172D46">事务 B</text><path d="M740 355 L740 796" fill="none" stroke="#D9E2EC" stroke-width="2" stroke-dasharray="6 8"/><text x="1200" y="322" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="650" text-anchor="start" fill="#172D46">可见结果</text><path d="M1260 355 L1260 796" fill="none" stroke="#D9E2EC" stroke-width="2" stroke-dasharray="6 8"/><rect x="132" y="381" width="360" height="65" rx="12" fill="#fff" stroke="#DEE6ED"/><text x="152" y="424" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="650" text-anchor="start" fill="#386BEA">首次快照读：5</text><rect x="652" y="473" width="360" height="65" rx="12" fill="#fff" stroke="#DEE6ED"/><text x="672" y="516" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="650" text-anchor="start" fill="#D57935">更新为 4，并提交</text><rect x="132" y="568" width="360" height="65" rx="12" fill="#fff" stroke="#DEE6ED"/><text x="152" y="611" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="650" text-anchor="start" fill="#386BEA">再次快照读：5</text><rect x="132" y="686" width="360" height="65" rx="12" fill="#fff" stroke="#DEE6ED"/><text x="152" y="729" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="650" text-anchor="start" fill="#078B83">锁定读：当前值 4</text><path d="M1037 500 L1180 500" fill="none" stroke="#D57935" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1200" y="506" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="600" text-anchor="start" fill="#D57935">已提交版本：4</text><path d="M506 595 L1180 595" fill="none" stroke="#386BEA" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1200" y="602" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="600" text-anchor="start" fill="#386BEA">沿用快照</text><path d="M506 713 L1180 713" fill="none" stroke="#078B83" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1200" y="720" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="600" text-anchor="start" fill="#078B83">当前读取并加锁</text><text x="105" y="881" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#66788B">前提：A 没有自行修改该行；普通一致性读与锁定读不是同一视角。</text></svg>