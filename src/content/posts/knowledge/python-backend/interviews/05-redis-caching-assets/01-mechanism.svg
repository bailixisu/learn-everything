<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">Redis 面经：缓存一致性、分布式锁与持久化</title><desc id="desc">从缓存读写链路出发，拆解常见类型、穿透击穿雪崩、删除缓存的竞态、锁租约、淘汰持久化和事务。</desc><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAF0FF"/><stop offset="1" stop-color="#F6F8FB"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" viewBox="0 0 10 10"><path d="M2 2 L8 5 L2 8" stroke="#93A7BC" stroke-width="1.8" fill="none"/></marker></defs><rect x="0" y="0" width="1600" height="1040" rx="0" fill="#F6F8FB" stroke="none"/><rect x="0" y="0" width="1600" height="210" rx="0" fill="url(#wash)" stroke="none"/><text x="68" y="66" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#386BEA">LEARN EVERYTHING</text><text x="1532" y="66" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="500" text-anchor="end" fill="#66788B">PYTHON BACKEND   /   05</text><text x="68" y="138" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="48" font-weight="700" text-anchor="start" fill="#172D46">缓存回填，也会遇到并发竞争</text><text x="68" y="186" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#66788B">REDIS / CACHE   ·   面经机制图</text><rect x="64" y="250" width="1472" height="674" rx="26" fill="#fff" stroke="#E1E7EE"/><path d="M68 963 L1532 963" fill="none" stroke="#D2DCE7" stroke-width="2" stroke-dasharray=""/><text x="68" y="1009" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#66788B">原创教学示意  ·  看清状态、时序与边界，再回答追问</text><text x="1532" y="1009" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-