<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">Python 并发面经：GIL、线程、进程与 asyncio 怎么选</title><desc id="desc">讲清并发与并行、可选无 GIL 构建、协程调度、TaskGroup、阻塞调用、锁、超时取消和并发限制。</desc><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAF0FF"/><stop offset="1" stop-color="#F6F8FB"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" viewBox="0 0 10 10"><path d="M2 2 L8 5 L2 8" stroke="#93A7BC" stroke-width="1.8" fill="none"/></marker></defs><rect x="0" y="0" width="1600" height="1040" rx="0" fill="#F6F8FB" stroke="none"/><rect x="0" y="0" width="1600" height="210" rx="0" fill="url(#wash)" stroke="none"/><text x="68" y="66" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#386BEA">LEARN EVERYTHING</text><text x="1532" y="66" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="500" text-anchor="end" fill="#66788B">PYTHON BACKEND   /   02</text><text x="68" y="138" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="48" font-weight="700" text-anchor="start" fill="#172D46">等待可以重叠，计算仍需资源</text><text x="68" y="186" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#66788B">CONCURRENCY   ·   面经机制图</text><rect x="64" y="250" width="1472" height="674" rx="26" fill="#fff" stroke="#E1E7EE"/><path d="M68 963 L1532 963" fill="none" stroke="#D2DCE7" stroke-width="2" stroke-dasharray=""/><text x="68" y="1009" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#66788B">原创教学示意  ·  看清状态、时序与边界，再回答追问</text><text x="1532" y="1009" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="500" text-anchor="end" fill="#66788B">2026 / 09</text><text x="105" y="314" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="33" font-weight="650" text-anchor="start" fill="#172D46">两个独立 I/O，各等待 100 ms</text><text x="105" y="357" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#66788B">假设无其他开销；横轴为时间，不是 CPU 使用率</text><path d="M410.0 415 L410.0 790" fill="none" stroke="#DCE4EE" stroke-width="2" stroke-dasharray="5 8"/><text x="410.0" y="834" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#66788B">0 ms</text><path d="M870.0 415 L870.0 790" fill="none" stroke="#DCE4EE" stroke-width="2" stroke-dasharray="5 8"/><text x="870.0" y="834" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#66788B">100 ms</text><path d="M1330.0 415 L1330.0 790" fill="none" stroke="#DCE4EE" stroke-width="2" stroke-dasharray="5 8"/><text x="1330.0" y="834" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#66788B">200 ms</text><text x="105" y="489" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="start" fill="#172D46">顺序 await</text><rect x="410" y="448" width="460" height="72" rx="12" fill="#386BEA" stroke="none"/><text x="640" y="495" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#fff">等待 A</text><rect x="870" y="530" width="460" height="72" rx="12" fill="#078B83" stroke="none"/><text x="1100" y="577" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#fff">等待 B</text><text x="105" y="689" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="start" fill="#172D46">并发任务</text><rect x="410" y="647" width="460" height="60" rx="12" fill="#386BEA" stroke="none"/><rect x="410" y="722" width="460" height="60" rx="12" fill="#078B83" stroke="none"/><text x="640" y="688" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#fff">等待 A</text><text x="640" y="763" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#fff">等待 B</text><text x="955" y="715" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="600" text-anchor="start" fill="#078B83">等待重叠；仍需超时和并发上限</text><text x="105" y="889" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#66788B">async def 不会自动把阻塞函数移到线程池，也不会把 CPU 计算变成并行。</text></svg>