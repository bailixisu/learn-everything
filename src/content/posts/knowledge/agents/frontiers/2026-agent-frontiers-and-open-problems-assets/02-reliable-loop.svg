<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
<title id="title">可靠 Agent 的任务与记忆闭环</title><desc id="desc">目标、规划、受控执行、环境观察、外部验证、任务更新形成循环；经核验经验另行审查后进入持久记忆。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#718096" stroke-width="1.7"/></marker></defs>
<rect width="1600" height="1180" fill="#f4f7fa"/>
<text x="64" y="65" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" fill="#137e82" font-weight="600" text-anchor="start">RELIABLE EXECUTION / DESIGN SKETCH</text><text x="64" y="130" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="50" fill="#273449" font-weight="700" text-anchor="start">每次推进，都要连回真实状态</text><text x="64" y="180" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" fill="#5c6c80" font-weight="400" text-anchor="start">执行结果先核验，再更新任务；经验写入还需要单独审查。</text><rect x="64" y="236" width="432" height="190" rx="20" fill="#ffffff" stroke="#d9e2e8" stroke-width="2"/><text x="92" y="286" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="35" fill="#137e82" font-weight="650" text-anchor="start">01  目标与约束</text><text x="92" y="340" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" fill="#526276" font-weight="400" text-anchor="start">验收条件、任务边界</text><text x="92" y="383" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" fill="#526276" font-weight="400" text-anchor="start">缺失信息与已有授权</text><rect x="584" y="236" width="432" height="190" rx="20" fill="#ffffff" stroke="#d9e2e8" stroke-width="2"/><text x="612" y="286" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="35" fill="#137e82" font-weight="650" text-anchor="start">02  计划与下一步</text><text x="612" y="340" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" fill="#526276" font-weight="400" text-anchor="start">读取当前任务状态</text><text x="612" y="383" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" fill="#526276" font-weight="400" text-anchor="start">按依赖关系选择行动</text><rect x="1104" y="236" width="432" height="190" rx="20" fill="#ffffff" stroke="#d9e2e8" stroke-width="2"/><text x="1132" y="286" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="35" fill="#137e82" font-weight="650" text-anchor="start">03  受控执行</text><text x="1132" y="340" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" fill="#526276" font-weight="400" text-anchor="start">核对权限后调用工具</text><text x="1132" y="383" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" fill="#526276" font-weight="400" text-anchor="start">记录操作标识与回执</text><rect x="1104" y="568" width="432" height="190" rx="20" fill="#ffffff" stroke="#d9e2e8" stroke-width="2"/><text x="1132" y="618" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="35" fill="#137e82" font-weight="650" text-anchor="start">04  观察真实结果</text><text x="1132" y="672" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" fill="#526276" font-weight="400" text-anchor="start">检查外部状态与产物</text><text x="1132" y="715" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" fill="#526276" font-weight="400" text-anchor="start">回执缺失时查询状态</text><rect x="584" y="568" width="432" height="190" rx="20" fill="#ffffff" stroke="#d9e2e8" stroke-width="2"/><text x="612" y="618" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="35" fill="#137e82" font-weight="650" text-anchor="start">05  外部验证</text><text x="612" y="672" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" fill="#526276" font-weight="400" text-anchor="start">核验数字、文件与页面</text><text x="612" y="715" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" fill="#526276" font-weight="400" text-anchor="start">不能只依赖完成声明</text><rect x="64" y="568" width="432" height="190" rx="20" fill="#ffffff" stroke="#d9e2e8" stroke-width="2"/><text x="92" y="618" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="35" fill="#137e82" font-weight="650" text-anchor="start">06  更新任务状态</text><text x="92" y="672" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" fill="#526276" font-weight="400" text-anchor="start">通过 → 结算已完成项</text><text x="92" y="715" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" fill="#526276" font-weight="400" text-anchor="start">失败 → 补查或恢复</text><path d="M 496 331 L 567 331" fill="none" stroke="#718096" stroke-width="4" marker-end="url(#arrow)"/><path d="M 1016 331 L 1087 331" fill="none" stroke="#718096" stroke-width="4" marker-end="url(#arrow)"/><path d="M 1320 426 L 1320 550" fill="none" stroke="#718096" stroke-width="4" marker-end="url(#arrow)"/><path d="M 1104 663 L 1033 663" fill="none" stroke="#718096" stroke-width="4" marker-end="url(#arrow)"/><path d="M 584 663 L 513 663" fill="none" stroke="#718096" stroke-width="4" marker-end="url(#arrow)"/><path d="M 280 568 L 280 498 L 800 498 L 800 443" fill="none" stroke="#718096" stroke-width="4" marker-end="url(#arrow)"/><text x="475" y="486" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" fill="#526276" font-weight="400" text-anchor="start">继续 / 重规划</text><rect x="64" y="840" width="1472" height="232" rx="20" fill="#e8f3f1" stroke="#bdd8d2" stroke-width="2"/><text x="92" y="888" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="31" fill="#137e82" font-weight="650" text-anchor="start">跨任务经验：单独的写入与读取路径</text><path d="M 800 758 L 800 822" fill="none" stroke="#718096" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 8"/><text x="822" y="801" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" fill="#526276" font-weight="400" text-anchor="start">验证过的经验候选</text><rect x="92" y="927" width="277" height="72" rx="12" fill="#ffffff" stroke="#bdd8d2" stroke-width="2"/><text x="230.5" y="974" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" fill="#273449" font-weight="500" text-anchor="middle">事实与经验候选</text><rect x="459" y="927" width="277" height="72" rx="12" fill="#ffffff" stroke="#bdd8d2" stroke-width="2"/><text x="597.5" y="974" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" fill="#273449" font-weight="500" text-anchor="middle">写入审查</text><rect x="826" y="927" width="277" height="72" rx="12" fill="#ffffff" stroke="#bdd8d2" stroke-width="2"/><text x="964.5" y="974" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" fill="#273449" font-weight="500" text-anchor="middle">持久记忆</text><rect x="1193" y="927" width="277" height="72" rx="12" fill="#ffffff" stroke="#bdd8d2" stroke-width="2"/><text x="1331.5" y="974" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" fill="#273449" font-weight="500" text-anchor="middle">按需检索</text><path d="M 379 964 L 440 964" fill="none" stroke="#718096" stroke-width="4" marker-end="url(#arrow)"/><path d="M 746 964 L 807 964" fill="none" stroke="#718096" stroke-width="4" marker-end="url(#arrow)"/><path d="M 1113 964 L 1174 964" fill="none" stroke="#718096" stroke-width="4" marker-end="url(#arrow)"/><text x="92" y="1047" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" fill="#526276" font-weight="400" text-anchor="start">审查来源、适用条件和验证状态；检索结果供下一轮计划参考，不自动授予权限。</text><text x="64" y="1138" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#5c6c80" font-weight="400" text-anchor="start">教学架构示意  ·  状态一致性、验证成本与错误恢复都需要独立评测。</text>
</svg>