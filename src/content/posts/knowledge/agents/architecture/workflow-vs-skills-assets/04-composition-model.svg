<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">Workflow 与 Skills 的组合关系</title><desc id="desc">Workflow 的每个节点可以调用不同 Skill，同一个 Skill 也可以被多个 Workflow 复用。</desc><defs><style>.t{font-family:Inter,"Noto Sans SC","PingFang SC",sans-serif;fill:#1f2925}.h{font-weight:700}.m{fill:#657169}</style><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto"><path d="M0 0L11 4 0 8Z" fill="#4a6fa5"/></marker></defs><rect width="1200" height="730" rx="28" fill="#f8faf7"/><text class="t h" x="65" y="72" font-size="39">组合关系：Workflow 调度 Skills，Skills 不拥有全局流程</text><text class="t m" x="65" y="112" font-size="21">节点决定何时调用，Skill 决定节点内部如何高质量完成</text><text class="t h" x="70" y="180" font-size="22">运行时 Workflow</text><g fill="#e8eef6" stroke="#4a6fa5" stroke-width="3"><rect x="70" y="215" width="200" height="82" rx="17"/><rect x="340" y="215" width="200" height="82" rx="17"/><rect x="610" y="215" width="200" height="82" rx="17"/><rect x="880" y="215" width="200" height="82" rx="17"/></g><g class="t h" font-size="20" text-anchor="middle"><text x="170" y="265">收集证据</text><text x="440" y="265">生成内容</text><text x="710" y="265">质量评审</text><text x="980" y="265">人工确认</text></g><path d="M270 256h70M540 256h70M810 256h70" stroke="#4a6fa5" stroke-width="4" marker-end="url(#a)"/><text class="t h" x="70" y="385" font-size="22">可复用 Skills</text><g><rect x="90" y="430" width="260" height="95" rx="45" fill="#e4f0eb" stroke="#357266" stroke-width="3"/><text class="t h" x="220" y="468" font-size="19" text-anchor="middle">research-skill</text><text class="t m" x="220" y="497" font-size="16" text-anchor="middle">检索、来源和证据规则</text><rect x="470" y="430" width="260" height="95" rx="45" fill="#e4f0eb" stroke="#357266" stroke-width="3"/><text class="t h" x="600" y="468" font-size="19" text-anchor="middle">writing-skill</text><text class="t m" x="600" y="497" font-size="16" text-anchor="middle">结构、风格和图像规范</text><rect x="850" y="430" width="260" height="95" rx="45" fill="#e4f0eb" stroke="#357266" stroke-width="3"/><text class="t h" x="980" y="468" font-size="19" text-anchor="middle">security-review</text><text class="t m" x="980" y="497" font-size="16" text-anchor="middle">隐私、密钥和发布风险</text></g><path d="M170 297v115h50v18M440 297v75h160v58M710 297v75h-110v58M710 297v115h270v18" fill="none" stroke="#357266" stroke-width="3" stroke-dasharray="8 6"/><rect x="195" y="600" width="810" height="80" rx="20" fill="#fff2e9"/><text class="t h" x="600" y="634" font-size="21" text-anchor="middle">同一 Skill 可以被不同 Workflow 复用</text><text class="t m" x="600" y="662" font-size="17" text-anchor="middle">例如 security-review 同时服务博客发布、代码发布和邮件发送</text></svg>