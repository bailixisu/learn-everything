<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Workflow 状态机示例</title><desc id="desc">内容从输入、生成、评审、预览、人工确认到发布，失败会回到修改，发布必须经过人工闸门。</desc><defs><style>.t{font-family:Inter,"Noto Sans SC","PingFang SC",sans-serif;fill:#1f2925}.h{font-weight:700}.m{fill:#657169}.b{fill:#fff;stroke:#4a6fa5;stroke-width:3}</style><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto"><path d="M0 0L11 4 0 8Z" fill="#4a6fa5"/></marker><marker id="r" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto"><path d="M0 0L11 4 0 8Z" fill="#d97757"/></marker></defs><rect width="1200" height="720" rx="28" fill="#f8faf7"/><text class="t h" x="65" y="72" font-size="39">Workflow：把一次任务变成可恢复、可审计的状态机</text><text class="t m" x="65" y="112" font-size="21">它约束流程，而不是要求模型每次都“记得”安全规则</text><g><rect class="b" x="55" y="250" width="145" height="80" rx="17"/><rect class="b" x="245" y="250" width="145" height="80" rx="17"/><rect class="b" x="435" y="250" width="145" height="80" rx="17"/><rect class="b" x="625" y="250" width="145" height="80" rx="17"/><rect x="815" y="240" width="160" height="100" rx="20" fill="#fff2e9" stroke="#d97757" stroke-width="3"/><rect x="1020" y="250" width="145" height="80" rx="17" fill="#e4f0eb" stroke="#357266" stroke-width="3"/><g class="t h" font-size="21" text-anchor="middle"><text x="127" y="299">输入材料</text><text x="317" y="299">生成草稿</text><text x="507" y="299">质量评审</text><text x="697" y="299">本地预览</text><text x="895" y="282">人工确认</text><text x="895" y="312" font-size="17">Human gate</text><text x="1092" y="299">正式发布</text></g><path d="M200 290h45M390 290h45M580 290h45M770 290h45M975 290h45" stroke="#4a6fa5" stroke-width="4" marker-end="url(#a)"/></g><path d="M895 340v145H317V330" fill="none" stroke="#d97757" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#r)"/><rect x="555" y="448" width="220" height="72" rx="15" fill="#fff2e9"/><text class="t h" x="665" y="478" font-size="19" text-anchor="middle">拒绝 / 检查失败</text><text class="t m" x="665" y="505" font-size="16" text-anchor="middle">携带反馈回到草稿</text><g><rect x="95" y="580" width="300" height="82" rx="17" fill="#edf1f7"/><text class="t h" x="120" y="614" font-size="19">状态持久化</text><text class="t m" x="120" y="642" font-size="16">中断后从检查点继续</text><rect x="450" y="580" width="300" height="82" rx="17" fill="#edf1f7"/><text class="t h" x="475" y="614" font-size="19">失败策略</text><text class="t m" x="475" y="642" font-size="16">重试、降级、回滚、终止</text><rect x="805" y="580" width="300" height="82" rx="17" fill="#edf1f7"/><text class="t h" x="830" y="614" font-size="19">执行证据</text><text class="t m" x="830" y="642" font-size="16">输入、输出、耗时、决策日志</text></g></svg>