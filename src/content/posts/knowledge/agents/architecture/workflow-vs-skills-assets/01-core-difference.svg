<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Workflow 与 Skill 的核心区别</title><desc id="desc">Workflow 负责安排步骤、状态和控制流，Skill 负责封装知识、方法和资源，两者组合完成可靠任务。</desc><defs><style>.t{font-family:Inter,"Noto Sans SC","PingFang SC",sans-serif;fill:#1f2925}.h{font-weight:700}.m{fill:#657169}</style><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto"><path d="M0 0L11 4 0 8Z" fill="#357266"/></marker></defs><rect width="1200" height="700" rx="28" fill="#f8faf7"/><text class="t h" x="65" y="72" font-size="40">Workflow 管过程，Skill 管能力</text><text class="t m" x="65" y="112" font-size="21">一个回答“什么时候做什么”，另一个回答“这件事应该怎么做好”</text><rect x="70" y="165" width="480" height="350" rx="25" fill="#edf1f7" stroke="#4a6fa5" stroke-width="3"/><text class="t h" x="110" y="220" font-size="31" fill="#4a6fa5">Workflow</text><text class="t h" x="110" y="265" font-size="22">控制面 / Runtime orchestration</text><g class="t" font-size="20"><text x="125" y="318">• 步骤与顺序</text><text x="125" y="360">• 分支、循环、重试</text><text x="125" y="402">• 状态、检查点、人工审批</text><text x="125" y="444">• 超时、回滚、可观测性</text></g><rect x="650" y="165" width="480" height="350" rx="25" fill="#e9f3ef" stroke="#357266" stroke-width="3"/><text class="t h" x="690" y="220" font-size="31" fill="#357266">Skill</text><text class="t h" x="690" y="265" font-size="22">能力面 / Capability package</text><g class="t" font-size="20"><text x="705" y="318">• 专业知识与操作规则</text><text x="705" y="360">• 提示、参考资料和模板</text><text x="705" y="402">• 可执行脚本与资源</text><text x="705" y="444">• 按需发现与渐进加载</text></g><rect x="220" y="565" width="760" height="82" rx="20" fill="#26352f"/><text x="600" y="600" text-anchor="middle" font-family="Inter,'Noto Sans SC',sans-serif" font-size="23" font-weight="700" fill="#fff">可靠 Agent 系统 = Workflow 的确定性边界 + Skill 的可复用能力</text><text x="600" y="630" text-anchor="middle" font-family="Inter,'Noto Sans SC',sans-serif" font-size="17" fill="#dbe6e1">两者正交、可组合，不是互相替代</text></svg>