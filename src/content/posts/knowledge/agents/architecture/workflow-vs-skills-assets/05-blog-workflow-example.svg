<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">博客发布中的 Workflow 与 Skill</title><desc id="desc">博客流程依次生成草稿、评审、本地预览和发布，blog-workflow Skill 在各阶段提供分类、写作、图片和安全规则。</desc><defs><style>.t{font-family:Inter,"Noto Sans SC","PingFang SC",sans-serif;fill:#1f2925}.h{font-weight:700}.m{fill:#657169}</style><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto"><path d="M0 0L11 4 0 8Z" fill="#4a6fa5"/></marker></defs><rect width="1200" height="760" rx="28" fill="#f8faf7"/><text class="t h" x="65" y="72" font-size="39">博客案例：安全性来自 Workflow，写作能力来自 Skill</text><text class="t m" x="65" y="112" font-size="21">同一套 blog-workflow Skill 被不同阶段按需使用</text><g><rect x="65" y="185" width="230" height="100" rx="20" fill="#e8eef6" stroke="#4a6fa5" stroke-width="3"/><rect x="345" y="185" width="230" height="100" rx="20" fill="#e8eef6" stroke="#4a6fa5" stroke-width="3"/><rect x="625" y="185" width="230" height="100" rx="20" fill="#e8eef6" stroke="#4a6fa5" stroke-width="3"/><rect x="905" y="185" width="230" height="100" rx="20" fill="#e4f0eb" stroke="#357266" stroke-width="3"/><g class="t h" font-size="21" text-anchor="middle"><text x="180" y="225">/blog-draft</text><text x="180" y="256" font-size="17">生成 draft: true</text><text x="460" y="225">/blog-review</text><text x="460" y="256" font-size="17">事实与隐私检查</text><text x="740" y="225">/blog-preview</text><text x="740" y="256" font-size="17">本地渲染验证</text><text x="1020" y="225">/blog-publish</text><text x="1020" y="256" font-size="17">确认后提交推送</text></g><path d="M295 235h50M575 235h50M855 235h50" stroke="#4a6fa5" stroke-width="4" marker-end="url(#a)"/></g><rect x="230" y="380" width="740" height="190" rx="28" fill="#e9f3ef" stroke="#357266" stroke-width="3"/><text class="t h" x="600" y="430" font-size="28" text-anchor="middle">blog-workflow Skill</text><g class="t" font-size="19"><text x="300" y="478">• 内容分类与目录规范</text><text x="300" y="518">• Markdown 与图片规范</text><text x="650" y="478">• 质量评审清单</text><text x="650" y="518">• 发布安全规则</text></g><path d="M180 285v60h420v35M460 285v60h140v35M740 285v60H600v35M1020 285v60H600v35" fill="none" stroke="#357266" stroke-width="3" stroke-dasharray="8 6"/><rect x="180" y="625" width="840" height="78" rx="19" fill="#26352f"/><text x="600" y="659" text-anchor="middle" font-family="Inter,'Noto Sans SC',sans-serif" font-size="21" font-weight="700" fill="#fff">关键边界：Skill 写着“必须确认”，Workflow 才真正阻止未确认的发布动作</text><text x="600" y="687" text-anchor="middle" font-family="Inter,'Noto Sans SC',sans-serif" font-size="16" fill="#dbe6e1">高风险控制应落在代码、权限或状态机中，不能只依赖模型遵循文字</text></svg>