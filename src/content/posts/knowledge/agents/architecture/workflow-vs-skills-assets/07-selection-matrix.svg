<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">Workflow 和 Skill 选择矩阵</title><desc id="desc">横轴表示流程控制需求，纵轴表示专业知识复用需求，四个象限分别建议普通工具、Skill、Workflow 或二者组合。</desc><defs><style>.t{font-family:Inter,"Noto Sans SC","PingFang SC",sans-serif;fill:#1f2925}.h{font-weight:700}.m{fill:#657169}</style><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto"><path d="M0 0L11 4 0 8Z" fill="#26352f"/></marker></defs><rect width="1200" height="730" rx="28" fill="#f8faf7"/><text class="t h" x="65" y="72" font-size="39">什么时候用哪一个？看两种复杂度是否真实存在</text><text class="t m" x="65" y="112" font-size="21">横轴看控制流，纵轴看专业能力复用</text><line x1="190" y1="610" x2="1090" y2="610" stroke="#26352f" stroke-width="4" marker-end="url(#a)"/><line x1="190" y1="610" x2="190" y2="155" stroke="#26352f" stroke-width="4" marker-end="url(#a)"/><text class="t h" x="640" y="690" font-size="20" text-anchor="middle">流程控制需求：低 ←────────────────────────→ 高</text><text class="t h" x="50" y="390" font-size="20" text-anchor="middle" transform="rotate(-90 50 390)">专业知识复用需求：低 → 高</text><rect x="235" y="390" width="355" height="170" rx="22" fill="#f3f4f2"/><text class="t h" x="270" y="435" font-size="23">普通 Prompt / Tool</text><text class="t" x="270" y="475" font-size="18">一次性、低风险、步骤很短</text><text class="t m" x="270" y="512" font-size="16">例：格式转换、简单查询</text><rect x="650" y="390" width="355" height="170" rx="22" fill="#e8eef6"/><text class="t h" x="685" y="435" font-size="23">只用 Workflow</text><text class="t" x="685" y="475" font-size="18">流程固定，专业判断很少</text><text class="t m" x="685" y="512" font-size="16">例：审批后复制文件并通知</text><rect x="235" y="180" width="355" height="170" rx="22" fill="#e4f0eb"/><text class="t h" x="270" y="225" font-size="23">只用 Skill</text><text class="t" x="270" y="265" font-size="18">方法专业，但执行链很短</text><text class="t m" x="270" y="302" font-size="16">例：评审一篇论文的方法</text><rect x="650" y="180" width="355" height="170" rx="22" fill="#e7f0ec" stroke="#357266" stroke-width="3"/><text class="t h" x="685" y="225" font-size="23">Workflow + Skills</text><text class="t" x="685" y="265" font-size="18">多阶段、可恢复、需专业能力</text><text class="t m" x="685" y="302" font-size="16">例：研究 → 写作 → 评审 → 发布</text></svg>