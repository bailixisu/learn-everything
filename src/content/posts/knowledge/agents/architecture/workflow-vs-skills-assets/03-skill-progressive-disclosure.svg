<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Skill 的渐进式加载</title><desc id="desc">启动时只加载名称与描述，任务匹配后读取 SKILL.md，执行时才按需读取脚本、参考资料和资源。</desc><defs><style>.t{font-family:Inter,"Noto Sans SC","PingFang SC",sans-serif;fill:#1f2925}.h{font-weight:700}.m{fill:#657169}</style><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto"><path d="M0 0L11 4 0 8Z" fill="#357266"/></marker></defs><rect width="1200" height="720" rx="28" fill="#f8faf7"/><text class="t h" x="65" y="72" font-size="39">Skill：把能力打包，并通过渐进式披露控制上下文</text><text class="t m" x="65" y="112" font-size="21">不是启动时把所有文件塞给模型，而是按任务逐层展开</text><g><rect x="75" y="180" width="300" height="300" rx="24" fill="#edf5f1" stroke="#357266" stroke-width="3"/><text class="t h" x="110" y="230" font-size="26">① Discovery</text><text class="t h" x="110" y="278" font-size="21">只加载元数据</text><text class="t m" x="110" y="318" font-size="18">name</text><text class="t m" x="110" y="352" font-size="18">description</text><text class="t m" x="110" y="408" font-size="17">回答：是否与当前任务匹配？</text><rect x="450" y="180" width="300" height="300" rx="24" fill="#e8eef6" stroke="#4a6fa5" stroke-width="3"/><text class="t h" x="485" y="230" font-size="26">② Activation</text><text class="t h" x="485" y="278" font-size="21">读取 SKILL.md</text><text class="t m" x="485" y="318" font-size="18">流程说明</text><text class="t m" x="485" y="352" font-size="18">约束与判断规则</text><text class="t m" x="485" y="408" font-size="17">回答：这项能力该如何执行？</text><rect x="825" y="180" width="300" height="300" rx="24" fill="#f1edfa" stroke="#7868a6" stroke-width="3"/><text class="t h" x="860" y="230" font-size="26">③ Execution</text><text class="t h" x="860" y="278" font-size="21">按需加载资源</text><text class="t m" x="860" y="318" font-size="18">scripts/</text><text class="t m" x="860" y="352" font-size="18">references/</text><text class="t m" x="860" y="386" font-size="18">assets/</text><text class="t m" x="860" y="435" font-size="17">回答：需要哪些确定性工具？</text><path d="M375 330h75M750 330h75" stroke="#357266" stroke-width="5" marker-end="url(#a)"/></g><rect x="180" y="555" width="840" height="95" rx="20" fill="#26352f"/><text x="600" y="592" text-anchor="middle" font-family="Inter,'Noto Sans SC',sans-serif" font-size="22" font-weight="700" fill="#fff">Skill 的价值：复用专业方法，而不让所有知识永久占满上下文</text><text x="600" y="625" text-anchor="middle" font-family="Inter,'Noto Sans SC',sans-serif" font-size="17" fill="#dbe6e1">它提供能力说明，但通常不负责运行时状态、排队、重试和事务</text></svg>