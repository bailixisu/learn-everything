<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">Workflow 与 Skill 的实现分层</title><desc id="desc">从用户入口、编排控制、能力包、工具适配到底层执行环境的五层架构。</desc><defs><style>.t{font-family:Inter,"Noto Sans SC","PingFang SC",sans-serif;fill:#1f2925}.h{font-weight:700}.m{fill:#657169}</style></defs><rect width="1200" height="740" rx="28" fill="#f8faf7"/><text class="t h" x="65" y="72" font-size="39">实现时分五层：不要把所有责任写进一个 Prompt</text><text class="t m" x="65" y="112" font-size="21">越靠上表达意图，越靠下提供确定性和安全边界</text><g><rect x="130" y="155" width="940" height="82" rx="18" fill="#f1edfa"/><text class="t h" x="175" y="191" font-size="21">① 入口层</text><text class="t m" x="360" y="191" font-size="18">用户请求、Slash Command、API、定时触发</text><text class="t m" x="360" y="218" font-size="16">表达“我要做什么”</text><rect x="130" y="250" width="940" height="82" rx="18" fill="#e8eef6"/><text class="t h" x="175" y="286" font-size="21">② Workflow 编排层</text><text class="t m" x="430" y="286" font-size="18">状态机、DAG、分支、重试、检查点、人工审批</text><text class="t m" x="430" y="313" font-size="16">决定“何时做、失败怎么办”</text><rect x="130" y="345" width="940" height="82" rx="18" fill="#e4f0eb"/><text class="t h" x="175" y="381" font-size="21">③ Skill 能力层</text><text class="t m" x="395" y="381" font-size="18">SKILL.md、规则、参考资料、模板、脚本</text><text class="t m" x="395" y="408" font-size="16">说明“这件事怎样做好”</text><rect x="130" y="440" width="940" height="82" rx="18" fill="#fff2e9"/><text class="t h" x="175" y="476" font-size="21">④ Tool 适配层</text><text class="t m" x="395" y="476" font-size="18">文件、搜索、Git、数据库、浏览器、消息 API</text><text class="t m" x="395" y="503" font-size="16">把模型意图转换成受控动作</text><rect x="130" y="535" width="940" height="82" rx="18" fill="#26352f"/><text x="175" y="571" font-family="Inter,'Noto Sans SC',sans-serif" font-size="21" font-weight="700" fill="#fff">⑤ 执行与治理层</text><text x="420" y="571" font-family="Inter,'Noto Sans SC',sans-serif" font-size="18" fill="#dbe6e1">权限、沙箱、日志、密钥、预算、监控、审计</text><text x="420" y="598" font-family="Inter,'Noto Sans SC',sans-serif" font-size="16" fill="#b8c9c1">提供系统最终安全底线</text></g><text class="t h" x="600" y="680" font-size="20" text-anchor="middle">Prompt 可以建议，Workflow 可以约束，执行环境才能强制。</text></svg>