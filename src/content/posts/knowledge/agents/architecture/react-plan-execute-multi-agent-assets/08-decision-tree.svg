<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="t d"><title id="t">从失败模式出发的架构选择决策树</title><desc id="d">从最简单方案开始，依次判断是否需要 ReAct、Plan-and-Execute 与 Multi-Agent，否则保留最小架构。</desc><defs><marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#2f7f6f"/></marker><marker id="dot-teal" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#2f7f6f"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#3f6fb5"/></marker><marker id="dot-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#3f6fb5"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#7a5fb3"/></marker><marker id="dot-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#7a5fb3"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#c98a1c"/></marker><marker id="dot-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#c98a1c"/></marker><marker id="arr-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#d1654a"/></marker><marker id="dot-coral" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#d1654a"/></marker><marker id="arr-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1f2925"/></marker><marker id="dot-dark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#1f2925"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#9aa39e"/></marker><marker id="dot-gray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#9aa39e"/></marker><marker id="arr-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6b746f"/></marker><style>text{font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Inter",system-ui,sans-serif}.mono{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}</style></defs><rect width="1200" height="740" fill="#ffffff"/><rect x="260" y="30" width="340" height="56" rx="28" fill="#1f2925" stroke="#1f2925" stroke-width="1.5"/><text x="430" y="63.12" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">从最小方案开始：一次模型调用 + 确定性工具</text><path d="M430 88 V130" fill="none" stroke="#6b746f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-line)"/><path d="M430 134 L600 190 L430 246 L260 190 Z" fill="#ffffff" stroke="#1f2925" stroke-width="1.6" stroke-linejoin="round"/><text x="430" y="186" font-size="16" font-weight="600" fill="#1f2925" text-anchor="middle"><tspan x="430" dy="0">下一步是否依赖</tspan><tspan x="430" dy="24">最新的环境反馈？</tspan></text><text x="242" y="182" font-size="12" font-weight="500" fill="#6b746f" text-anchor="end"><tspan x="242" dy="0">工具结果、页面状态、</tspan><tspan x="242" dy="18">错误日志会改变方向</tspan></text><path d="M604 190 H716" fill="none" stroke="#2f7f6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/><text x="660" y="180" font-size="14" font-weight="700" fill="#1f6353" text-anchor="middle">是</text><rect x="720" y="142" width="420" height="96" rx="12" fill="#e3f2ec" stroke="#2f7f6f" stroke-width="1.5"/><text x="930" y="183.68" font-size="19" font-weight="600" fill="#1f6353" text-anchor="middle">加入 ReAct</text><text x="930" y="211.98000000000002" font-size="12" font-weight="400" fill="#6b746f" text-anchor="middle">缩短「观察 → 修正」周期；轨迹不要太长，控制工具调用次数</text><path d="M430 248 V310" fill="none" stroke="#6b746f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-line)"/><text x="442" y="274" font-size="14" font-weight="700" fill="#6b746f" text-anchor="start">否</text><path d="M930 240 V282 H436" fill="none" stroke="#2f7f6f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#arr-teal)"/><text x="940" y="274" font-size="11" font-weight="500" fill="#1f6353" text-anchor="start">在此基础上继续评估</text><path d="M430 314 L600 370 L430 426 L260 370 Z" fill="#ffffff" stroke="#1f2925" stroke-width="1.6" stroke-linejoin="round"/><text x="430" y="366" font-size="16" font-weight="600" fill="#1f2925" text-anchor="middle"><tspan x="430" dy="0">长任务是否经常</tspan><tspan x="430" dy="24">遗漏阶段？</tspan></text><text x="242" y="362" font-size="12" font-weight="500" fill="#6b746f" text-anchor="end"><tspan x="242" dy="0">存在清晰阶段与依赖，</tspan><tspan x="242" dy="18">每个阶段有可验证产物</tspan></text><path d="M604 370 H716" fill="none" stroke="#3f6fb5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><text x="660" y="360" font-size="14" font-weight="700" fill="#2b5493" text-anchor="middle">是</text><rect x="720" y="322" width="420" height="96" rx="12" fill="#e6eef9" stroke="#3f6fb5" stroke-width="1.5"/><text x="930" y="363.68" font-size="19" font-weight="600" fill="#2b5493" text-anchor="middle">加入 Plan-and-Execute</text><text x="930" y="391.98" font-size="12" font-weight="400" fill="#6b746f" text-anchor="middle">显式计划 + 阶段验证 + 必要时重规划</text><path d="M430 428 V490" fill="none" stroke="#6b746f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-line)"/><text x="442" y="454" font-size="14" font-weight="700" fill="#6b746f" text-anchor="start">否</text><path d="M930 420 V462 H436" fill="none" stroke="#3f6fb5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#arr-blue)"/><text x="940" y="454" font-size="11" font-weight="500" fill="#2b5493" text-anchor="start">在此基础上继续评估</text><path d="M430 494 L600 550 L430 606 L260 550 Z" fill="#ffffff" stroke="#1f2925" stroke-width="1.6" stroke-linejoin="round"/><text x="430" y="546" font-size="16" font-weight="600" fill="#1f2925" text-anchor="middle"><tspan x="430" dy="0">是否存在真实的</tspan><tspan x="430" dy="24">隔离或并行需求？</tspan></text><text x="242" y="542" font-size="12" font-weight="500" fill="#6b746f" text-anchor="end"><tspan x="242" dy="0">单个上下文装不下、</tspan><tspan x="242" dy="18">工具或权限必须隔离、</tspan><tspan x="242" dy="18">并行收益高于协调成本</tspan></text><path d="M604 550 H716" fill="none" stroke="#7a5fb3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-purple)"/><text x="660" y="540" font-size="14" font-weight="700" fill="#5a428d" text-anchor="middle">是</text><rect x="720" y="502" width="420" height="96" rx="12" fill="#ede8f8" stroke="#7a5fb3" stroke-width="1.5"/><text x="930" y="543.6800000000001" font-size="19" font-weight="600" fill="#5a428d" text-anchor="middle">加入 Multi-Agent</text><text x="930" y="571.98" font-size="12" font-weight="400" fill="#6b746f" text-anchor="middle">定义角色、上下文边界、协议与权限；用实验证明收益大于协调成本</text><path d="M430 608 V686" fill="none" stroke="#6b746f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-line)"/><text x="442" y="634" font-size="14" font-weight="700" fill="#6b746f" text-anchor="start">否</text><path d="M930 600 V642 H436" fill="none" stroke="#7a5fb3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#arr-purple)"/><text x="940" y="634" font-size="11" font-weight="500" fill="#5a428d" text-anchor="start">在此基础上停止叠加</text><rect x="260" y="690" width="340" height="46" rx="23" fill="#e3f2ec" stroke="#2f7f6f" stroke-width="1.5"/><text x="430" y="717.8" font-size="15" font-weight="600" fill="#1f6353" text-anchor="middle">停止增加复杂度，保留当前最小架构</text></svg>