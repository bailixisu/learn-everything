<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">同一故障案例的三种处理方式</title><desc id="d">ReAct 沿证据链顺序推进，Plan-and-Execute 先列出完整调查面再执行，Multi-Agent 让多个 Agent 并行调查后汇总。</desc><defs><marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#2f7f6f"/></marker><marker id="dot-teal" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#2f7f6f"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#3f6fb5"/></marker><marker id="dot-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#3f6fb5"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#7a5fb3"/></marker><marker id="dot-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#7a5fb3"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#c98a1c"/></marker><marker id="dot-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#c98a1c"/></marker><marker id="arr-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#d1654a"/></marker><marker id="dot-coral" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#d1654a"/></marker><marker id="arr-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1f2925"/></marker><marker id="dot-dark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#1f2925"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#9aa39e"/></marker><marker id="dot-gray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#9aa39e"/></marker><marker id="arr-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6b746f"/></marker><style>text{font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Inter",system-ui,sans-serif}.mono{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}</style></defs><rect width="1200" height="720" fill="#ffffff"/><path d="M250 44 H1160" fill="none" stroke="#6b746f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-line)"/><text x="250" y="32" font-size="13" font-weight="600" fill="#6b746f" text-anchor="start">时间 →</text><text x="1160" y="32" font-size="13" font-weight="500" fill="#6b746f" text-anchor="end">目标：解释订单 API 的 P95 从 300 ms 升到 2 s</text><clipPath id="lane0"><rect x="40" y="64" width="1120" height="176" rx="16"/></clipPath><rect x="40" y="64" width="1120" height="176" rx="16" fill="#f0f8f4" stroke="transparent" stroke-width="1.5"/><rect x="40" y="64" width="6" height="176" fill="#2f7f6f" clip-path="url(#lane0)"/><text x="64" y="104" font-size="18" font-weight="700" fill="#1f6353" text-anchor="start">ReAct</text><text x="64" y="128" font-size="13" font-weight="500" fill="#6b746f" text-anchor="start">沿证据推进</text><clipPath id="lane1"><rect x="40" y="256" width="1120" height="168" rx="16"/></clipPath><rect x="40" y="256" width="1120" height="168" rx="16" fill="#f1f5fb" stroke="transparent" stroke-width="1.5"/><rect x="40" y="256" width="6" height="168" fill="#3f6fb5" clip-path="url(#lane1)"/><text x="64" y="296" font-size="18" font-weight="700" fill="#2b5493" text-anchor="start">Plan-and-Execute</text><text x="64" y="320" font-size="13" font-weight="500" fill="#6b746f" text-anchor="start">先定义调查覆盖面</text><clipPath id="lane2"><rect x="40" y="440" width="1120" height="262" rx="16"/></clipPath><rect x="40" y="440" width="1120" height="262" rx="16" fill="#f4f1fb" stroke="transparent" stroke-width="1.5"/><rect x="40" y="440" width="6" height="262" fill="#7a5fb3" clip-path="url(#lane2)"/><text x="64" y="480" font-size="18" font-weight="700" fill="#5a428d" text-anchor="start">Multi-Agent</text><text x="64" y="504" font-size="13" font-weight="500" fill="#6b746f" text-anchor="start">并行、隔离上下文</text><rect x="260" y="100" width="156" height="44" rx="10" fill="#1f2925" stroke="#1f2925" stroke-width="1.5"/><text x="338" y="126.8" font-size="15" font-weight="500" fill="#ffffff" text-anchor="middle">查 P95 时间线</text><text x="338" y="166" font-size="13" font-weight="600" fill="#8a5c0a" text-anchor="middle">14:05 开始上升</text><text x="338" y="90" font-size="11" font-weight="600" fill="#8b948f" text-anchor="middle">Action 1 → Observation</text><path d="M420 122 H446" fill="none" stroke="#2f7f6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/><rect x="450" y="100" width="156" height="44" rx="10" fill="#1f2925" stroke="#1f2925" stroke-width="1.5"/><text x="528" y="126.8" font-size="15" font-weight="500" fill="#ffffff" text-anchor="middle">查发布记录</text><text x="528" y="166" font-size="13" font-weight="600" fill="#8a5c0a" text-anchor="middle">14:02 缓存重构</text><text x="528" y="90" font-size="11" font-weight="600" fill="#8b948f" text-anchor="middle">Action 2 → Observation</text><path d="M610 122 H636" fill="none" stroke="#2f7f6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/><rect x="640" y="100" width="156" height="44" rx="10" fill="#1f2925" stroke="#1f2925" stroke-width="1.5"/><text x="718" y="126.8" font-size="15" font-weight="500" fill="#ffffff" text-anchor="middle">查缓存命中率</text><text x="718" y="166" font-size="13" font-weight="600" fill="#8a5c0a" text-anchor="middle">92% → 18%</text><text x="718" y="90" font-size="11" font-weight="600" fill="#8b948f" text-anchor="middle">Action 3 → Observation</text><path d="M800 122 H826" fill="none" stroke="#2f7f6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/><rect x="830" y="100" width="156" height="44" rx="10" fill="#1f2925" stroke="#1f2925" stroke-width="1.5"/><text x="908" y="126.8" font-size="15" font-weight="500" fill="#ffffff" text-anchor="middle">diff 部署前后代码</text><text x="908" y="166" font-size="13" font-weight="600" fill="#8a5c0a" text-anchor="middle">读取路径漏 tenant_id</text><text x="908" y="90" font-size="11" font-weight="600" fill="#8b948f" text-anchor="middle">Action 4 → Observation</text><path d="M990 122 H1016" fill="none" stroke="#2f7f6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/><rect x="1020" y="92" width="128" height="60" rx="12" fill="#e3f2ec" stroke="#2f7f6f" stroke-width="1.5"/><text x="1084" y="114.08" font-size="14" font-weight="600" fill="#1f6353" text-anchor="middle">根因假设</text><text x="1084" y="139.88" font-size="12" font-weight="400" fill="#6b746f" text-anchor="middle">key 漏掉 tenant_id</text><text x="260" y="218" font-size="13" font-weight="500" fill="#1f2925" text-anchor="start">每一步由上一条证据引导；</text><text x="422" y="218" font-size="13" font-weight="500" fill="#a2452e" text-anchor="start">⚠ 风险：抓住第一个强信号后过早收敛，遗漏数据库与下游依赖</text><rect x="260" y="288" width="110" height="64" rx="12" fill="#e6eef9" stroke="#3f6fb5" stroke-width="1.5"/><text x="315" y="312.72" font-size="16" font-weight="600" fill="#2b5493" text-anchor="middle">Planner</text><text x="315" y="339.52000000000004" font-size="12" font-weight="400" fill="#6b746f" text-anchor="middle">先列覆盖面</text><rect x="400" y="282" width="590" height="76" rx="12" fill="#ffffff" stroke="#3f6fb5" stroke-width="1.4"/><text x="414" y="302" font-size="12" font-weight="600" fill="#2b5493" text-anchor="start">调查计划（8 个阶段，按依赖顺序执行）</text><rect x="414" y="312" width="65" height="34" rx="8" fill="#e3f2ec" stroke="#2f7f6f" stroke-width="1.3"/><text x="446.5" y="334" font-size="12" font-weight="600" fill="#1f6353" text-anchor="middle">✓范围</text><rect x="485" y="312" width="65" height="34" rx="8" fill="#e3f2ec" stroke="#2f7f6f" stroke-width="1.3"/><text x="517.5" y="334" font-size="12" font-weight="600" fill="#1f6353" text-anchor="middle">✓时间线</text><rect x="556" y="312" width="65" height="34" rx="8" fill="#e3f2ec" stroke="#2f7f6f" stroke-width="1.3"/><text x="588.5" y="334" font-size="12" font-weight="600" fill="#1f6353" text-anchor="middle">✓应用指标</text><rect x="627" y="312" width="65" height="34" rx="8" fill="#e6eef9" stroke="#3f6fb5" stroke-width="1.3"/><text x="659.5" y="334" font-size="12" font-weight="600" fill="#2b5493" text-anchor="middle">▶缓存</text><rect x="698" y="312" width="65" height="34" rx="8" fill="#ffffff" stroke="#c6cec9" stroke-width="1.3"/><text x="730.5" y="334" font-size="12" font-weight="400" fill="#6b746f" text-anchor="middle">数据库</text><rect x="769" y="312" width="65" height="34" rx="8" fill="#ffffff" stroke="#c6cec9" stroke-width="1.3"/><text x="801.5" y="334" font-size="12" font-weight="400" fill="#6b746f" text-anchor="middle">下游</text><rect x="840" y="312" width="65" height="34" rx="8" fill="#ffffff" stroke="#c6cec9" stroke-width="1.3"/><text x="872.5" y="334" font-size="12" font-weight="400" fill="#6b746f" text-anchor="middle">代码变更</text><rect x="911" y="312" width="65" height="34" rx="8" fill="#ffffff" stroke="#c6cec9" stroke-width="1.3"/><text x="943.5" y="334" font-size="12" font-weight="400" fill="#6b746f" text-anchor="middle">验证</text><path d="M374 320 H396" fill="none" stroke="#3f6fb5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><path d="M994 320 H1024" fill="none" stroke="#3f6fb5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><rect x="1028" y="288" width="120" height="64" rx="12" fill="#e6eef9" stroke="#3f6fb5" stroke-width="1.5"/><text x="1088" y="313.1" font-size="15" font-weight="600" fill="#2b5493" text-anchor="middle">Verifier</text><text x="1088" y="338.5" font-size="11" font-weight="400" fill="#6b746f" text-anchor="middle">能否排除其他原因？</text><text x="260" y="402" font-size="13" font-weight="500" fill="#1f2925" text-anchor="start">显式计划保留完整调查面；</text><text x="422" y="402" font-size="13" font-weight="500" fill="#a2452e" text-anchor="start">⚠ 风险：时间窗口或系统假设错误时，整份计划一起过时</text><rect x="260" y="480" width="130" height="150" rx="12" fill="#ede8f8" stroke="#7a5fb3" stroke-width="1.5"/><text x="325" y="539.32" font-size="16" font-weight="600" fill="#5a428d" text-anchor="middle">Coordinator</text><text x="325" y="566.12" font-size="12" font-weight="400" fill="#6b746f" text-anchor="middle"><tspan x="325" dy="0">统一时间窗口</tspan><tspan x="325" dy="16.799999999999997">定义证据标准</tspan></text><rect x="440" y="480" width="540" height="40" rx="9" fill="#ffffff" stroke="#7a5fb3" stroke-width="1.4"/><rect x="440" y="480" width="540" height="40" rx="9" fill="#7a5fb3" opacity="0.08"/><text x="454" y="505" font-size="14" font-weight="700" fill="#5a428d" text-anchor="start">Metrics Agent</text><text x="576" y="505" font-size="13" font-weight="500" fill="#6b746f" text-anchor="start">指标与时间线：P95、QPS、错误率</text><path d="M394 555 H416 V500 H436" fill="none" stroke="#7a5fb3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-purple)"/><path d="M984 500 H1006 V555 H1028" fill="none" stroke="#7a5fb3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-purple)"/><rect x="440" y="535" width="540" height="40" rx="9" fill="#ffffff" stroke="#7a5fb3" stroke-width="1.4"/><rect x="440" y="535" width="540" height="40" rx="9" fill="#7a5fb3" opacity="0.08"/><text x="454" y="560" font-size="14" font-weight="700" fill="#5a428d" text-anchor="start">Logs Agent</text><text x="576" y="560" font-size="13" font-weight="500" fill="#6b746f" text-anchor="start">错误与调用链：慢查询、超时堆栈</text><path d="M394 555 H416 V555 H436" fill="none" stroke="#7a5fb3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-purple)"/><path d="M984 555 H1006 V555 H1028" fill="none" stroke="#7a5fb3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-purple)"/><rect x="440" y="590" width="540" height="40" rx="9" fill="#ffffff" stroke="#7a5fb3" stroke-width="1.4"/><rect x="440" y="590" width="540" height="40" rx="9" fill="#7a5fb3" opacity="0.08"/><text x="454" y="615" font-size="14" font-weight="700" fill="#5a428d" text-anchor="start">Code Agent</text><text x="576" y="615" font-size="13" font-weight="500" fill="#6b746f" text-anchor="start">代码与配置变化：缓存 key 构造 diff</text><path d="M394 555 H416 V610 H436" fill="none" stroke="#7a5fb3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-purple)"/><path d="M984 610 H1006 V555 H1028" fill="none" stroke="#7a5fb3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-purple)"/><text x="710" y="470" font-size="11" font-weight="600" fill="#8b948f" text-anchor="middle">三个 Agent 同时工作（并行）</text><rect x="1032" y="510" width="116" height="90" rx="12" fill="#ede8f8" stroke="#7a5fb3" stroke-width="1.5"/><text x="1090" y="539" font-size="15" font-weight="600" fill="#5a428d" text-anchor="middle">汇总</text><text x="1090" y="565.3" font-size="12" font-weight="400" fill="#6b746f" text-anchor="middle"><tspan x="1090" dy="0">统一时间线</tspan><tspan x="1090" dy="16.799999999999997">证据 → 根因</tspan></text><text x="260" y="680" font-size="13" font-weight="500" fill="#1f2925" text-anchor="start">并行且各自聚焦；</text><text x="370" y="680" font-size="13" font-weight="500" fill="#a2452e" text-anchor="start">⚠ 风险：三个 Agent 使用不同时间窗口，或把相关性误当成因果关系</text></svg>