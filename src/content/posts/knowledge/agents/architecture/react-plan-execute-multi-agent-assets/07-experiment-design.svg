<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">对照实验设计矩阵</title><desc id="d">三组任务结构与三种控制架构的 3×3 矩阵，对角线为各自假设的预期优势，底部为统一控制变量与指标。</desc><defs><marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#2f7f6f"/></marker><marker id="dot-teal" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#2f7f6f"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#3f6fb5"/></marker><marker id="dot-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#3f6fb5"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#7a5fb3"/></marker><marker id="dot-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#7a5fb3"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#c98a1c"/></marker><marker id="dot-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#c98a1c"/></marker><marker id="arr-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#d1654a"/></marker><marker id="dot-coral" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#d1654a"/></marker><marker id="arr-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1f2925"/></marker><marker id="dot-dark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#1f2925"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#9aa39e"/></marker><marker id="dot-gray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#9aa39e"/></marker><marker id="arr-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6b746f"/></marker><style>text{font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Inter",system-ui,sans-serif}.mono{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}</style></defs><rect width="1200" height="700" fill="#ffffff"/><rect x="360" y="40" width="250" height="64" rx="12" fill="#e3f2ec" stroke="#2f7f6f" stroke-width="1.4"/><text x="485" y="68" font-size="17" font-weight="700" fill="#1f6353" text-anchor="middle">R · ReAct</text><text x="485" y="89" font-size="12" font-weight="500" fill="#6b746f" text-anchor="middle">单 Agent · 逐步观察</text><rect x="630" y="40" width="250" height="64" rx="12" fill="#e6eef9" stroke="#3f6fb5" stroke-width="1.4"/><text x="755" y="68" font-size="17" font-weight="700" fill="#2b5493" text-anchor="middle">P · Plan-and-Execute</text><text x="755" y="89" font-size="12" font-weight="500" fill="#6b746f" text-anchor="middle">Planner + Executor + Replanner</text><rect x="900" y="40" width="250" height="64" rx="12" fill="#ede8f8" stroke="#7a5fb3" stroke-width="1.4"/><text x="1025" y="68" font-size="17" font-weight="700" fill="#5a428d" text-anchor="middle">M · Multi-Agent</text><text x="1025" y="89" font-size="12" font-weight="500" fill="#6b746f" text-anchor="middle">Coordinator + 专业 Workers</text><text x="40" y="70" font-size="15" font-weight="700" fill="#6b746f" text-anchor="start">任务结构  ×  控制架构</text><text x="40" y="92" font-size="12" font-weight="500" fill="#8b948f" text-anchor="start">每格 ≥ 20 次重复，随机化案例顺序与故障注入</text><rect x="40" y="120" width="300" height="118" rx="12" fill="#f6f8f6" stroke="transparent" stroke-width="1.5"/><text x="58" y="150" font-size="17" font-weight="700" fill="#1f2925" text-anchor="start">A · 动态环境任务</text><text x="58" y="176" font-size="12" font-weight="500" fill="#6b746f" text-anchor="start"><tspan x="58" dy="0">故障诊断沙盒，随机注入：</tspan><tspan x="58" dy="18">工具超时 · 误导指标 · 状态变化 · 假设回退</tspan></text><text x="58" y="224" font-size="12" font-weight="600" fill="#1f2925" text-anchor="start">测：恢复率 · 无效调用 · 完成时间</text><rect x="360" y="120" width="250" height="118" rx="12" fill="#f0f8f4" stroke="#2f7f6f" stroke-width="1.8"/><text x="485" y="168" font-size="16" font-weight="600" fill="#1f6353" text-anchor="middle">A × R</text><rect x="409.88" y="186" width="150.24" height="22.799999999999997" rx="11.399999999999999" fill="#e3f2ec" stroke="#2f7f6f" stroke-width="1.2"/><text x="485" y="201.72" font-size="12" font-weight="600" fill="#1f6353" text-anchor="middle">H1 预期：恢复效率更高</text><!--chipw:150.24--><rect x="630" y="120" width="250" height="118" rx="12" fill="#ffffff" stroke="#e2e7e3" stroke-width="1.2"/><text x="755" y="185" font-size="16" font-weight="600" fill="#6b746f" text-anchor="middle">A × P</text><rect x="900" y="120" width="250" height="118" rx="12" fill="#ffffff" stroke="#e2e7e3" stroke-width="1.2"/><text x="1025" y="185" font-size="16" font-weight="600" fill="#6b746f" text-anchor="middle">A × M</text><rect x="40" y="250" width="300" height="118" rx="12" fill="#f6f8f6" stroke="transparent" stroke-width="1.5"/><text x="58" y="280" font-size="17" font-weight="700" fill="#1f2925" text-anchor="start">B · 长链路固定任务</text><text x="58" y="306" font-size="12" font-weight="500" fill="#6b746f" text-anchor="start"><tspan x="58" dy="0">读取需求 → 改三个模块 → 补测试 →</tspan><tspan x="58" dy="18">更新文档 → 生成迁移说明（评分器检查交付物与顺序）</tspan></text><text x="58" y="354" font-size="12" font-weight="600" fill="#1f2925" text-anchor="start">测：步骤覆盖率 · 返工次数 · 最终正确性</text><rect x="360" y="250" width="250" height="118" rx="12" fill="#ffffff" stroke="#e2e7e3" stroke-width="1.2"/><text x="485" y="315" font-size="16" font-weight="600" fill="#6b746f" text-anchor="middle">B × R</text><rect x="630" y="250" width="250" height="118" rx="12" fill="#f1f5fb" stroke="#3f6fb5" stroke-width="1.8"/><text x="755" y="298" font-size="16" font-weight="600" fill="#2b5493" text-anchor="middle">B × P</text><rect x="673.88" y="316" width="162.24" height="22.799999999999997" rx="11.399999999999999" fill="#e6eef9" stroke="#3f6fb5" stroke-width="1.2"/><text x="755" y="331.71999999999997" font-size="12" font-weight="600" fill="#2b5493" text-anchor="middle">H2 预期：步骤覆盖率更高</text><!--chipw:162.24--><rect x="900" y="250" width="250" height="118" rx="12" fill="#ffffff" stroke="#e2e7e3" stroke-width="1.2"/><text x="1025" y="315" font-size="16" font-weight="600" fill="#6b746f" text-anchor="middle">B × M</text><rect x="40" y="380" width="300" height="118" rx="12" fill="#f6f8f6" stroke="transparent" stroke-width="1.5"/><text x="58" y="410" font-size="17" font-weight="700" fill="#1f2925" text-anchor="start">C · 可并行跨领域任务</text><text x="58" y="436" font-size="12" font-weight="500" fill="#6b746f" text-anchor="start"><tspan x="58" dy="0">技术调研 ∥ 代码实验 ∥ 安全检查 → 最终报告</tspan><tspan x="58" dy="18">四类材料相对独立，结论需要汇总</tspan></text><text x="58" y="484" font-size="12" font-weight="600" fill="#1f2925" text-anchor="start">测：墙钟时间 · 总 Token · 重复劳动 · 协调成本</text><rect x="360" y="380" width="250" height="118" rx="12" fill="#ffffff" stroke="#e2e7e3" stroke-width="1.2"/><text x="485" y="445" font-size="16" font-weight="600" fill="#6b746f" text-anchor="middle">C × R</text><rect x="630" y="380" width="250" height="118" rx="12" fill="#ffffff" stroke="#e2e7e3" stroke-width="1.2"/><text x="755" y="445" font-size="16" font-weight="600" fill="#6b746f" text-anchor="middle">C × P</text><rect x="900" y="380" width="250" height="118" rx="12" fill="#f4f1fb" stroke="#7a5fb3" stroke-width="1.8"/><text x="1025" y="428" font-size="16" font-weight="600" fill="#5a428d" text-anchor="middle">C × M</text><rect x="919.88" y="446" width="210.24" height="22.799999999999997" rx="11.399999999999999" fill="#ede8f8" stroke="#7a5fb3" stroke-width="1.2"/><text x="1025" y="461.71999999999997" font-size="12" font-weight="600" fill="#5a428d" text-anchor="middle">H3 预期：并行与专业聚焦更有价值</text><!--chipw:210.24--><rect x="40" y="522" width="540" height="140" rx="14" fill="#ffffff" stroke="#e2e7e3" stroke-width="1.3"/><text x="60" y="552" font-size="15" font-weight="700" fill="#1f2925" text-anchor="start">统一控制（只改变控制架构）</text><circle cx="65" cy="575" r="3.5" fill="#1f2925"/><text x="78" y="580" font-size="13" font-weight="500" fill="#1f2925" text-anchor="start">相同基础模型与温度</text><circle cx="325" cy="575" r="3.5" fill="#1f2925"/><text x="338" y="580" font-size="13" font-weight="500" fill="#1f2925" text-anchor="start">相同工具与底层数据</text><circle cx="65" cy="601" r="3.5" fill="#1f2925"/><text x="78" y="606" font-size="13" font-weight="500" fill="#1f2925" text-anchor="start">相同 Token / 成本预算</text><circle cx="325" cy="601" r="3.5" fill="#1f2925"/><text x="338" y="606" font-size="13" font-weight="500" fill="#1f2925" text-anchor="start">相同任务超时</text><circle cx="65" cy="627" r="3.5" fill="#1f2925"/><text x="78" y="632" font-size="13" font-weight="500" fill="#1f2925" text-anchor="start">保存完整执行轨迹</text><circle cx="325" cy="627" r="3.5" fill="#1f2925"/><text x="338" y="632" font-size="13" font-weight="500" fill="#1f2925" text-anchor="start">并发时同时报告总成本与墙钟时间</text><rect x="600" y="522" width="560" height="140" rx="14" fill="#ffffff" stroke="#e2e7e3" stroke-width="1.3"/><text x="620" y="552" font-size="15" font-weight="700" fill="#1f2925" text-anchor="start">统一指标</text><rect x="620" y="568" width="99.92" height="22.799999999999997" rx="11.399999999999999" fill="#e8ebe8" stroke="transparent" stroke-width="1.2"/><text x="669.96" y="583.72" font-size="12" font-weight="600" fill="#1f2925" text-anchor="middle">Task Success</text><!--chipw:99.92--><rect x="727.92" y="568" width="106.64" height="22.799999999999997" rx="11.399999999999999" fill="#e8ebe8" stroke="transparent" stroke-width="1.2"/><text x="781.24" y="583.72" font-size="12" font-weight="600" fill="#1f2925" text-anchor="middle">Step Coverage</text><!--chipw:106.64--><rect x="842.56" y="568" width="106.63999999999999" height="22.799999999999997" rx="11.399999999999999" fill="#e8ebe8" stroke="transparent" stroke-width="1.2"/><text x="895.8799999999999" y="583.72" font-size="12" font-weight="600" fill="#1f2925" text-anchor="middle">Recovery Rate</text><!--chipw:106.63999999999999--><rect x="957.1999999999999" y="568" width="86.48" height="22.799999999999997" rx="11.399999999999999" fill="#e8ebe8" stroke="transparent" stroke-width="1.2"/><text x="1000.4399999999999" y="583.72" font-size="12" font-weight="600" fill="#1f2925" text-anchor="middle">Tool Calls</text><!--chipw:86.48--><rect x="620" y="602" width="96.08" height="22.799999999999997" rx="11.399999999999999" fill="#e8ebe8" stroke="transparent" stroke-width="1.2"/><text x="668.04" y="617.72" font-size="12" font-weight="600" fill="#1f2925" text-anchor="middle">Token / Cost</text><!--chipw:96.08--><rect x="724.08" y="602" width="79.75999999999999" height="22.799999999999997" rx="11.399999999999999" fill="#e8ebe8" stroke="transparent" stroke-width="1.2"/><text x="763.96" y="617.72" font-size="12" font-weight="600" fill="#1f2925" text-anchor="middle">Wall Time</text><!--chipw:79.75999999999999--><rect x="811.84" y="602" width="160.39999999999998" height="22.799999999999997" rx="11.399999999999999" fill="#e8ebe8" stroke="transparent" stroke-width="1.2"/><text x="892.04" y="617.72" font-size="12" font-weight="600" fill="#1f2925" text-anchor="middle">Coordination Overhead</text><!--chipw:160.39999999999998--><rect x="980.24" y="602" width="101.83999999999999" height="22.799999999999997" rx="11.399999999999999" fill="#e8ebe8" stroke="transparent" stroke-width="1.2"/><text x="1031.16" y="617.72" font-size="12" font-weight="600" fill="#1f2925" text-anchor="middle">Traceability</text><!--chipw:101.83999999999999--><text x="620" y="648" font-size="12" font-weight="500" fill="#6b746f" text-anchor="start">Utility = 成功质量 − λ₁·Token − λ₂·墙钟时间 − λ₃·无效调用 − λ₄·协调开销</text></svg>