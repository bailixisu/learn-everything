/></marker><marker id="dot-dark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#1f2925"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#9aa39e"/></marker><marker id="dot-gray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#9aa39e"/></marker><marker id="arr-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6b746f"/></marker><style>text{font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Inter",system-ui,sans-serif}.mono{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}</style></defs><rect width="1200" height="640" fill="#ffffff"/><path d="M140 560 H1140" fill="none" stroke="#1f2925" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-dark)"/><path d="M140 560 V60" fill="none" stroke="#1f2925" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-dark)"/><text x="640" y="604" font-size="17" font-weight="700" fill="#1f2925" text-anchor="middle">执行策略：任务按什么节奏推进</text><text x="180" y="582" font-size="14" font-weight="600" fill="#1f6353" text-anchor="start">◀ 即时反馈（ReAct）</text><text x="1120" y="582" font-size="14" font-weight="600" fill="#2b5493" text-anchor="end">显式全局规划（Plan-and-Execute）▶</text><g transform="translate(80 310) rotate(-90)"><text x="0" y="0" font-size="17" font-weight="700" fill="#1f2925" text-anchor="middle">组织方式：由几个主体完成</text></g><text x="124" y="74" font-size="14" font-weight="600" fill="#5a428d" text-anchor="end">多主体 ▲</text><text x="124" y="550" font-size="14" font-weight="600" fill="#6b746f" text-anchor="end">单主体</text><rect x="180" y="90" width="440" height="200" rx="16" fill="#ffffff" stroke="#e2e7e3" stroke-width="1.4"/><rect x=