nt-weight="500" fill="#1f2925" text-anchor="start">Coordinator 规划阶段，Workers 分工执行</text><text x="820" y="224" font-size="14" font-weight="500" fill="#6b746f" text-anchor="start">复杂系统最常见的混合形态</text><rect x="1008" y="108" width="92" height="22.799999999999997" rx="11.399999999999999" fill="#ede8f8" stroke="#7a5fb3" stroke-width="1.2"/><text x="1054" y="123.72" font-size="12" font-weight="600" fill="#5a428d" text-anchor="middle">常见混合形态</text><!--chipw:92--><rect x="180" y="330" width="440" height="200" rx="16" fill="#ffffff" stroke="#e2e7e3" stroke-width="1.4"/><rect x="202" y="370" width="96" height="120" rx="12" fill="#f6f8f6" stroke="transparent" stroke-width="1.5"/><circle cx="250" cy="406" r="14" fill="#f1f3f1" stroke="#9aa39e" stroke-width="1.8"/><path d="M250.0 446.0 A14 14 0 1 1 237.5 466.4" fill="none" stroke="#2f7f6f" stroke-width="2.6" stroke-linecap="round"/><path d="M235.3 462.1 L243.4 466.9 L234.5 471.5 Z" fill="#2f7f6f"/><text x="320" y="392" font-size="20" font-weight="700" fill="#1f6353" text-anchor="start">单 Agent + ReAct</text><text x="320" y="434" font-size="15" font-weight="500" fill="#1f2925" text-anchor="start">调试、网页操作、开放式搜索</text><text x="320" y="464" font-size="14" font-weight="500" fill="#6b746f" text-anchor="start">一条状态轨迹，边观察边行动</text><rect x="680" y="330" width="440" height="200" rx="16" fill="#ffffff" stroke="#e2e7e3" stroke-width="1.4"/><rect x="702" y="370" width="96" height="120" rx="12" fill="#f6f8f6" stroke="transparent" stroke-width="1.5"/><circle cx="750" cy="406" r="14" fill="#f1f3f1" stroke="#9aa39e" stroke-width="1.8"/><rect x="734" y="442" width="32" height="36" rx="5" fill="#ffffff" stroke="#3f6fb5" stroke-width="1.6"/><circle cx="742" cy="451" r="2" fill="#3f6fb5"/><rect x="747" y="449" width="14" height="4" rx="2" fill="#3f6fb5" opacity="1"/><circle cx="742" cy="460" r="2" fill="#3f6fb5"/><rect x="747" y="458" width="11" height="4" rx="2" fill="#3f6fb5" opacity="0.5"/><circle cx="742" cy="469" r="2" fill="#3f6fb5"/><rect x="747" y="467" width="8" height="4" rx="2" fill="#3f6fb5" opacity="0.5"/><text x="820" y="392" font-size="20" font-weight="700" fill="#2b5493" text-anchor="start">单 Agent + Plan-and-Execute</text><text x="820" y="434" font-size="15" font-weight="500" fill="#1f2925" text-anchor="start">迁移、长报告、跨文件重构</text><text x="820" y="464" font-size="14" font-weight="500" fill="#6b746f" text-anchor="start">显式里程碑约束执行顺序</text></svg>