"10" fill="#ffffff" stroke="#2f7f6f" stroke-width="1.5"/><text x="275" y="477.12" font-size="16" font-weight="500" fill="#1f6353" text-anchor="middle">先确定异常从何时开始</text><rect x="150" y="530" width="250" height="44" rx="10" fill="#1f2925" stroke="#1f2925" stroke-width="1.5"/><text x="275" y="557.12" font-size="16" font-weight="500" fill="#ffffff" text-anchor="middle">查询最近 24h 的 P95</text><rect x="150" y="610" width="250" height="44" rx="10" fill="#ffffff" stroke="#c98a1c" stroke-width="1.5"/><text x="275" y="637.12" font-size="16" font-weight="500" fill="#8a5c0a" text-anchor="middle">14:05 开始上升</text><path d="M275 496 V527" fill="none" stroke="#2f7f6f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/><path d="M275 576 V607" fill="none" stroke="#c98a1c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-amber)"/><path d="M403 632 H425 V472 H447" fill="none" stroke="#2f7f6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/><rect x="450" y="450" width="250" height="44" rx="10" fill="#ffffff" stroke="#2f7f6f" stroke-width="1.5"/><text x="575" y="477.12" font-size="16" font-weight="500" fill="#1f6353" text-anchor="middle">检查该时间附近的部署</text><rect x="450" y="530" width="250" height="44" rx="10" fill="#1f2925" stroke="#1f2925" stroke-width="1.5"/><text x="575" y="557.12" font-size="16" font-weight="500" fill="#ffffff" text-anchor="middle">查询发布记录</text><rect x="450" y="610" width="250" height="44" rx="10" fill="#ffffff" stroke="#c98a1c" stroke-width="1.5"/><text x="575" y="637.12" font-size="16" font-weight="500" fill="#8a5c0a" text-anchor="middle">14:02 发布了缓存重构</text><path d="M575 496 V527" fill="none" stroke="#2f7f6f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/><path d="M575 576 V607" fill="none" stroke="#c98a1c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-amber)"/><path d="M703 632 H725 V472 H747" fill="none" stroke="#2f7f6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/><rect x="750" y="450" width="250" height="44" rx="10" fill="#ffffff" stroke="#2f7f6f" stroke-width="1.5"/><text x="875" y="477.12" font-size="16" font-weight="500" fill="#1f6353" text-anchor="middle">查缓存指标，而非泛查数据库</text><rect x="750" y="530" width="250" height="44" rx="10" fill="#1f2925" stroke="#1f2925" stroke-width="1.5"/><text x="875" y="557.12" font-size="16" font-weight="500" fill="#ffffff" text-anchor="middle">查询 cache hit rate</text><rect x="750" y="610" width="250" height="44" rx="10" fill="#ffffff" stroke="#c98a1c" stroke-width="1.5"/><text x="875" y="637.12" font-size="16" font-weight="500" fill="#8a5c0a" text-anchor="middle">命中率 92% → 18%</text><path d="M875 496 V527" fill="none" stroke="#2f7f6f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/><path d="M875 576 V607" fill="none" stroke="#c98a1c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-amber)"/><path d="M1003 632 H1025 V472 H1037" fill="none" stroke="#2f7f6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#arr-teal)"/><rect x="1040" y="450" width="120" height="124" rx="12" fill="#ffffff" stroke="#2f7f6f" stroke-width="1.5" stroke-dasharray="6 5"/><text x="1100" y="494.92" font-size="16" font-weight="600" fill="#1f6353" text-anchor="middle">最终答案</text><text x="1100" y="522.62" font-size="13" font-weight="400" fill="#6b746f" text-anchor="middle"><tspan x="1100" dy="0">缓存 key 漏掉</tspan><tspan x="1100" dy="18.2">tenant_id</tspan></text><text x="40" y="732" font-size="13" font-weight="500" fill="#8b948f" text-anchor="start">上排结构参考 Yao et al. 2022《ReAct》Figure 1 重绘；下排为本文故障案例的轨迹展开。</text></svg>