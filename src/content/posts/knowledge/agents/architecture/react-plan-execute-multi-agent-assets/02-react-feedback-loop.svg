2925"/></marker><marker id="dot-dark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#1f2925"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#9aa39e"/></marker><marker id="dot-gray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#9aa39e"/></marker><marker id="arr-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6b746f"/></marker><style>text{font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Inter",system-ui,sans-serif}.mono{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}</style></defs><rect width="1200" height="760" fill="#ffffff"/><rect x="40" y="40" width="360" height="300" rx="18" fill="#ffffff" stroke="#e2e7e3" stroke-width="1.4"/><text x="68" y="84" font-size="24" font-weight="700" fill="#1f2925" text-anchor="start">(a) 仅推理</text><text x="68" y="108" font-size="14" font-weight="500" fill="#6b746f" text-anchor="start">Reason Only · 如 Chain-of-Thought</text><rect x="60" y="182" width="124" height="62" rx="12" fill="#f1f3f1" stroke="#9aa39e" stroke-width="1.5"/><text x="122" y="219.4" font-size="20" font-weight="600" fill="#4d5651" text-anchor="middle">LM</text><rect x="256" y="182" width="124" height="62" rx="12" fill="#ffffff" stroke="#c6cec9" stroke-width="1.5" stroke-dasharray="6 5"/><text x="318" y="218.76" font-size="18" font-weight="600" fill="#8b948f" text-anchor="middle">环境 / 工具</text><path d="M152 182 C182 132 62 132 92 183" fill="none" stroke="#9aa39e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-gray)"/><text x="122" y="140" font-size="14" font-weight="600" fill="#4d5651" text-anchor="middle">Thought / 推理轨迹</text><text x="68" y="292" font-size="15" font-weight="500" fill="#6b746f" text-anchor="start"><tspan x="68" dy="0">推理与外部世界隔绝</tspan><tspan x="68" dy="22.5">容易幻觉、错误持续传播</tspan></text><rect x="420" y="40" width="360" height="300" rx="18" fill="#ffffff" stroke="#e2e7e3" stroke-width="1.4"/><text x="448" y="84" font-size="24" font-weight="700" fill="#1f2925" text-anchor="start">(b) 仅行动</text><text x="448" y="108" font-size="14" font-weight="500" fill="#6b746f" text-anchor="start">Act Only</text><rect x="440" y="182" width="124" height="62" rx="12" fill="#f1f3f1" stroke="#9aa39e" stroke-width="1.5"/><text x="502" y="219.4" font-size="20" font-weight="600" fill="#4d5651" text-anchor="middle">LM</text><rect x="636" y="182" width="124" height="62" rx="12" fill="#fdf3dc" stroke="#c98a1c" stroke-width="1.5"/><text x="698" y="218.76" font-size="18" font-weight="600" fill="#8a5c0a" text-anchor="middle">环境 / 工具</text><path d="M568 202 H632" fill="none" stroke="#9aa39e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-gray)"/><path d="M632 224 H568" fill="none" stroke="#c98a1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-amber)"/><text x="600" y="194" font-size="14" font-weight="600" fill="#4d5651" text-anchor="middle">Action</text><text x="600" y="264" font-size="14" font-weight="600" fill="#8a5c0a" text-anchor="middle">Observation</text><text x="448" y="292" font-size="15" font-weight="500" fill="#6b746f" text-anchor="start"><tspan x="448" dy="0">没有推理轨迹</tspan><tspan x="448" dy="22.5">难以规划、跟踪与纠错</tspan></text><rect x="800" y="40" width="360" height="300" rx="18" fill="#f0f8f4" stroke="#2f7f6f" stroke-width="1.6"/><text x="828" y="84" font-size="24" font-weight="700" fill="#1f6353" text-anchor="start">(c) ReAct</text><text x="828" y="108" font-size="14" font-weight="500" fill="#6b746f" text-anchor="start">Reasoning + Acting</text><rect x="820" y="182" width="124" height="62" rx="12" fill="#e3f2ec" stroke="#2f7f6f" stroke-width="1.5"/><text x="882" 