<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">ReAct、Plan-and-Execute 与 Multi-Agent 总览</title><desc id="d">ReAct 和 Plan-and-Execute 是执行策略，Multi-Agent 是组织结构，两个维度正交可组合。</desc><defs><marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#2f7f6f"/></marker><marker id="dot-teal" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#2f7f6f"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#3f6fb5"/></marker><marker id="dot-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#3f6fb5"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#7a5fb3"/></marker><marker id="dot-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#7a5fb3"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#c98a1c"/></marker><marker id="dot-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#c98a1c"/></marker><marker id="arr-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#d1654a"/></marker><marker id="dot-coral" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#d1654a"/></marker><marker id="arr-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1f2925"/></marker><marker id="dot-dark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#1f2925"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#9aa39e"/></marker><marker id="dot-gray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#9aa39e"/></marker><marker id="arr-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6b746f"/></marker><style>text{font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Inter",system-ui,sans-serif}.mono{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}</style></defs><rect width="1200" height="620" fill="#ffffff"/><path d="M40 62 V52 H780 V62" fill="none" stroke="#1f2925" stroke-width="1.6"/><rect x="275.25" y="38" width="269.5" height="28.5" rx="14.25" fill="#1f2925" stroke="#1f2925" stroke-width="1.2"/><text x="410" y="57.65" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">执行策略 · 决定任务按什么节奏推进</text><!--chipw:269.5--><path d="M800 62 V52 H1160 V62" fill="none" stroke="#1f2925" stroke-width="1.6"/><rect x="860.25" y="38" width="239.5" height="28.5" rx="14.25" fill="#1f2925" stroke="#1f2925" stroke-width="1.2"/><text x="980" y="57.65" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">组织结构 · 决定由几个主体完成</text><!--chipw:239.5--><rect x="40" y="70" width="360" height="340" rx="18" fill="#f0f8f4" stroke="#2f7f6f" stroke-width="1.2"/><text x="68" y="118" font-size="28" font-weight="700" fill="#1f6353" text-anchor="start">ReAct</text><text x="68" y="146" font-size="16" font-weight="500" fill="#6b746f" text-anchor="start">短反馈循环：边观察边决定</text><rect x="60" y="236" width="124" height="62" rx="12" fill="#e3f2ec" stroke="#2f7f6f" stroke-width="1.5"/><text x="122" y="273.4" font-size="20" font-weight="600" fill="#1f6353" text-anchor="middle">LLM</text><rect x="256" y="236" width="124" height="62" rx="12" fill="#fdf3dc" stroke="#c98a1c" stroke-width="1.5"/><text x="318" y="272.76" font-size="18" font-weight="600" fill="#8a5c0a" text-anchor="middle">环境 / 工具</text><path d="M188 256 H252" fill="none" stroke="#2f7f6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/><path d="M252 278 H188" fill="none" stroke="#c98a1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-amber)"/><text x="220" y="248" font-size="14" font-weight="600" fill="#1f6353" text-anchor="middle">Action</text><text x="220" y="318" font-size="14" font-weight="600" fill="#8a5c0a" text-anchor="middle">Observation</text><path d="M152 236 C182 186 62 186 92 237" fill="none" stroke="#2f7f6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/><text x="122" y="194" font-size="14" font-weight="600" fill="#1f6353" text-anchor="middle">Thought / 推理轨迹</text><text x="68" y="380" font-size="16" font-weight="500" fill="#1f2925" text-anchor="start">解决：下一步依赖刚获得的观察</text><rect x="420" y="70" width="360" height="340" rx="18" fill="#f1f5fb" stroke="#3f6fb5" stroke-width="1.2"/><text x="448" y="118" font-size="28" font-weight="700" fill="#2b5493" text-anchor="start">Plan-and-Execute</text><text x="448" y="146" font-size="16" font-weight="500" fill="#6b746f" text-anchor="start">显式计划：先分阶段，再逐步执行</text><rect x="448" y="198" width="96" height="56" rx="12" fill="#e6eef9" stroke="#3f6fb5" stroke-width="1.5"/><text x="496" y="231.44" font-size="17" font-weight="600" fill="#2b5493" text-anchor="middle">Planner</text><rect x="564" y="188" width="92" height="76" rx="10" fill="#ffffff" stroke="#3f6fb5" stroke-width="1.5"/><text x="576" y="206" font-size="12" font-weight="700" fill="#2f7f6f" text-anchor="start">✓</text><rect x="594" y="199" width="50" height="6" rx="3" fill="#c6cec9"/><text x="576" y="223" font-size="12" font-weight="700" fill="#2f7f6f" text-anchor="start">✓</text><rect x="594" y="216" width="44" height="6" rx="3" fill="#c6cec9"/><text x="576" y="240" font-size="12" font-weight="700" fill="#3f6fb5" text-anchor="start">▶</text><rect x="594" y="233" width="38" height="6" rx="3" fill="#3f6fb5"/><text x="576" y="257" font-size="12" font-weight="700" fill="#9aa39e" text-anchor="start">○</text><rect x="594" y="250" width="32" height="6" rx="3" fill="#c6cec9"/><rect x="676" y="198" width="96" height="56" rx="12" fill="#e6eef9" stroke="#3f6fb5" stroke-width="1.5"/><text x="724" y="231.44" font-size="17" font-weight="600" fill="#2b5493" text-anchor="middle">Executor</text><path d="M548 226 H560" fill="none" stroke="#3f6fb5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><path d="M660 226 H672" fill="none" stroke="#3f6fb5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><rect x="676" y="288" width="96" height="50" rx="12" fill="#e6eef9" stroke="#3f6fb5" stroke-width="1.5"/><text x="724" y="318.44" font-size="17" font-weight="600" fill="#2b5493" text-anchor="middle">Verifier</text><path d="M724 258 V284" fill="none" stroke="#3f6fb5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><path d="M672 313 H496 V258" fill="none" stroke="#d1654a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr-coral)"/><text x="584" y="330" font-size="13" font-weight="600" fill="#a2452e" text-anchor="middle">Replan</text><text x="448" y="380" font-size="16" font-weight="500" fill="#1f2925" text-anchor="start">解决：长任务容易遗漏阶段</text><rect x="800" y="70" width="360" height="340" rx="18" fill="#f4f1fb" stroke="#7a5fb3" stroke-width="1.2"/><text x="828" y="118" font-size="28" font-weight="700" fill="#5a428d" text-anchor="start">Multi-Agent</text><text x="828" y="146" font-size="16" font-weight="500" fill="#6b746f" text-anchor="start">责任分解：多个上下文与职责主体</text><rect x="910" y="170" width="140" height="42" rx="12" fill="#ede8f8" stroke="#7a5fb3" stroke-width="1.5"/><text x="980" y="196.44" font-size="17" font-weight="600" fill="#5a428d" text-anchor="middle">Orchestrator</text><rect x="822" y="242" width="96" height="42" rx="12" fill="#ffffff" stroke="#7a5fb3" stroke-width="1.5"/><text x="870" y="267.8" font-size="15" font-weight="600" fill="#5a428d" text-anchor="middle">Worker A</text><path d="M980 216 V228 H870 V238" fill="none" stroke="#7a5fb3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-purple)"/><path d="M870 288 V300 H980 V310" fill="none" stroke="#7a5fb3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-purple)"/><rect x="932" y="242" width="96" height="42" rx="12" fill="#ffffff" stroke="#7a5fb3" stroke-width="1.5"/><text x="980" y="267.8" font-size="15" font-weight="600" fill="#5a428d" text-anchor="middle">Worker B</text><path d="M980 216 V228 H980 V238" fill="none" stroke="#7a5fb3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-purple)"/><path d="M980 288 V300 H980 V310" fill="none" stroke="#7a5fb3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-purple)"/><rect x="1042" y="242" width="96" height="42" rx="12" fill="#ffffff" stroke="#7a5fb3" stroke-width="1.5"/><text x="1090" y="267.8" font-size="15" font-weight="600" fill="#5a428d" text-anchor="middle">Worker C</text><path d="M980 216 V228 H1090 V238" fill="none" stroke="#7a5fb3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-purple)"/><path d="M1090 288 V300 H980 V310" fill="none" stroke="#7a5fb3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-purple)"/><rect x="910" y="314" width="140" height="42" rx="12" fill="#ede8f8" stroke="#7a5fb3" stroke-width="1.5"/><text x="980" y="340.44" font-size="17" font-weight="600" fill="#5a428d" text-anchor="middle">Synthesizer</text><text x="828" y="380" font-size="16" font-weight="500" fill="#1f2925" text-anchor="start">解决：一个上下文装不下所有职责</text><rect x="40" y="450" width="1120" height="120" rx="18" fill="#f6f8f6" stroke="transparent" stroke-width="1.5"/><text x="600" y="486" font-size="18" font-weight="700" fill="#1f2925" text-anchor="middle">两个维度正交，可以组合</text><rect x="121.94999999999999" y="510" width="296.78" height="32.3" rx="16.15" fill="#e6eef9" stroke="#3f6fb5" stroke-width="1.2"/><text x="270.34" y="532.27" font-size="17" font-weight="600" fill="#2b5493" text-anchor="middle">Plan-and-Execute 定义全局阶段</text><!--chipw:296.78--><path d="M430.72999999999996 526 H462.72999999999996" fill="none" stroke="#6b746f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-line)"/><rect x="474.72999999999996" y="510" width="267.2" height="32.3" rx="16.15" fill="#ede8f8" stroke="#7a5fb3" stroke-width="1.2"/><text x="608.3299999999999" y="532.27" font-size="17" font-weight="600" fill="#5a428d" text-anchor="middle">Multi-Agent 按职责并行分工</text><!--chipw:267.2--><path d="M753.93 526 H785.93" fill="none" stroke="#6b746f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-line)"/><rect x="797.93" y="510" width="280.12" height="32.3" rx="16.15" fill="#e3f2ec" stroke="#2f7f6f" stroke-width="1.2"/><text x="937.99" y="532.27" font-size="17" font-weight="600" fill="#1f6353" text-anchor="middle">Worker 内部用 ReAct 适应环境</text><!--chipw:280.12--></svg>