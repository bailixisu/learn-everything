<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Plan-and-Execute 控制循环</title><desc id="d">Planner 生成计划，Executor 逐步执行，Verifier 验证，Replanner 在偏差过大时修订计划。</desc><defs><marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#2f7f6f"/></marker><marker id="dot-teal" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#2f7f6f"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#3f6fb5"/></marker><marker id="dot-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#3f6fb5"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#7a5fb3"/></marker><marker id="dot-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#7a5fb3"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#c98a1c"/></marker><marker id="dot-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#c98a1c"/></marker><marker id="arr-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#d1654a"/></marker><marker id="dot-coral" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#d1654a"/></marker><marker id="arr-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1f2925"/></marker><marker id="dot-dark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#1f2925"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#9aa39e"/></marker><marker id="dot-gray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#9aa39e"/></marker><marker id="arr-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6b746f"/></marker><style>text{font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Inter",system-ui,sans-serif}.mono{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}</style></defs><rect width="1200" height="640" fill="#ffffff"/><rect x="40" y="96" width="140" height="84" rx="12" fill="#ffffff" stroke="#9aa39e" stroke-width="1.5"/><text x="110" y="129.2" font-size="20" font-weight="600" fill="#4d5651" text-anchor="middle">目标</text><text x="110" y="161.6" font-size="16" font-weight="400" fill="#6b746f" text-anchor="middle">成功标准与约束</text><rect x="236" y="96" width="170" height="84" rx="12" fill="#e6eef9" stroke="#3f6fb5" stroke-width="1.5"/><text x="321" y="129.51999999999998" font-size="21" font-weight="600" fill="#2b5493" text-anchor="middle">Planner</text><text x="321" y="162.42" font-size="16" font-weight="400" fill="#6b746f" text-anchor="middle">拆分阶段与依赖</text><path d="M184 138 H232" fill="none" stroke="#6b746f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-line)"/><rect x="470" y="60" width="250" height="296" rx="14" fill="#ffffff" stroke="#3f6fb5" stroke-width="1.6"/><rect x="470" y="60" width="250" height="44" rx="14" fill="#e6eef9" stroke="transparent" stroke-width="1.5"/><rect x="470" y="90" width="250" height="14" fill="#e6eef9"/><text x="488" y="89" font-size="17" font-weight="700" fill="#2b5493" text-anchor="start">计划：一级状态对象</text><text x="492" y="134" font-size="15" font-weight="700" fill="#2f7f6f" text-anchor="start">✓</text><text x="518" y="134" font-size="15" font-weight="400" fill="#1f2925" text-anchor="start">1. 识别新旧 Schema 差异</text><text x="492" y="168" font-size="15" font-weight="700" fill="#2f7f6f" text-anchor="start">✓</text><text x="518" y="168" font-size="15" font-weight="400" fill="#1f2925" text-anchor="start">2. 检查前后向兼容性</text><rect x="478" y="180" width="234" height="32" rx="8" fill="#f1f5fb" stroke="transparent" stroke-width="1.5"/><text x="492" y="202" font-size="15" font-weight="700" fill="#3f6fb5" text-anchor="start">▶</text><text x="518" y="202" font-size="15" font-weight="600" fill="#1f2925" text-anchor="start">3. 生成迁移与回滚脚本</text><text x="492" y="236" font-size="15" font-weight="700" fill="#c6cec9" text-anchor="start">○</text><text x="518" y="236" font-size="15" font-weight="400" fill="#6b746f" text-anchor="start">4. 在测试数据上演练</text><text x="492" y="270" font-size="15" font-weight="700" fill="#c6cec9" text-anchor="start">○</text><text x="518" y="270" font-size="15" font-weight="400" fill="#6b746f" text-anchor="start">5. 验证性能与数据一致性</text><text x="492" y="304" font-size="15" font-weight="700" fill="#c6cec9" text-anchor="start">○</text><text x="518" y="304" font-size="15" font-weight="400" fill="#6b746f" text-anchor="start">6. 灰度发布并观察指标</text><text x="492" y="338" font-size="15" font-weight="700" fill="#c6cec9" text-anchor="start">○</text><text x="518" y="338" font-size="15" font-weight="400" fill="#6b746f" text-anchor="start">7. 更新文档与事故预案</text><path d="M410 138 H466" fill="none" stroke="#3f6fb5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><text x="438" y="126" font-size="13" font-weight="600" fill="#2b5493" text-anchor="middle">生成</text><rect x="780" y="96" width="150" height="84" rx="12" fill="#e6eef9" stroke="#3f6fb5" stroke-width="1.5"/><text x="855" y="129.51999999999998" font-size="21" font-weight="600" fill="#2b5493" text-anchor="middle">Executor</text><text x="855" y="162.42" font-size="16" font-weight="400" fill="#6b746f" text-anchor="middle">只处理当前步骤</text><path d="M724 138 H776" fill="none" stroke="#3f6fb5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><text x="750" y="126" font-size="13" font-weight="600" fill="#2b5493" text-anchor="middle">取下一步</text><rect x="760" y="202" width="190" height="44" rx="10" fill="#fdf3dc" stroke="#c98a1c" stroke-width="1.5"/><g transform="translate(778 224) rotate(45)"><rect x="-1.7999999999999998" y="-10" width="3.5999999999999996" height="16" rx="1.2" fill="#c98a1c"/><rect x="-5" y="-12.5" width="10" height="5.5" rx="1.5" fill="#c98a1c"/></g><text x="796" y="229" font-size="13" font-weight="600" fill="#8a5c0a" text-anchor="start">工具：读代码 · 跑测试 · 查指标</text><path d="M835 182 V200" fill="none" stroke="#c98a1c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-amber)"/><path d="M875 200 V182" fill="none" stroke="#c98a1c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-amber)"/><rect x="1000" y="96" width="160" height="84" rx="12" fill="#e6eef9" stroke="#3f6fb5" stroke-width="1.5"/><text x="1080" y="129.51999999999998" font-size="21" font-weight="600" fill="#2b5493" text-anchor="middle">Verifier</text><text x="1080" y="162.42" font-size="16" font-weight="400" fill="#6b746f" text-anchor="middle">检查验收标准</text><path d="M934 138 H996" fill="none" stroke="#3f6fb5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><text x="965" y="126" font-size="13" font-weight="600" fill="#2b5493" text-anchor="middle">阶段产物</text><path d="M1080 182 V282" fill="none" stroke="#3f6fb5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><path d="M1080 290 L1165 340 L1080 390 L995 340 Z" fill="#ffffff" stroke="#3f6fb5" stroke-width="1.5" stroke-linejoin="round"/><text x="1080" y="336" font-size="16" font-weight="600" fill="#2b5493" text-anchor="middle">满足完成</text><text x="1080" y="358" font-size="16" font-weight="600" fill="#2b5493" text-anchor="middle">条件？</text><path d="M1080 392 V436" fill="none" stroke="#2f7f6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/><text x="1092" y="420" font-size="14" font-weight="700" fill="#1f6353" text-anchor="start">是</text><rect x="1000" y="440" width="160" height="64" rx="12" fill="#e3f2ec" stroke="#2f7f6f" stroke-width="1.5"/><text x="1080" y="478.08" font-size="19" font-weight="600" fill="#1f6353" text-anchor="middle">最终响应</text><path d="M993 340 H904" fill="none" stroke="#d1654a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-coral)"/><text x="947.5" y="330" font-size="14" font-weight="700" fill="#a2452e" text-anchor="middle">否</text><rect x="740" y="304" width="160" height="72" rx="12" fill="#fdeae4" stroke="#d1654a" stroke-width="1.5"/><text x="820" y="332.28" font-size="19" font-weight="600" fill="#a2452e" text-anchor="middle">Replanner</text><text x="820" y="362.38" font-size="14" font-weight="400" fill="#6b746f" text-anchor="middle">偏差过大 / 计划过时</text><path d="M820 380 V400 H595 V360" fill="none" stroke="#d1654a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arr-coral)"/><text x="707.5" y="390" font-size="13" font-weight="600" fill="#a2452e" text-anchor="middle">Replan：修订剩余步骤</text><rect x="40" y="520" width="1120" height="80" rx="16" fill="#f6f8f6" stroke="transparent" stroke-width="1.5"/><text x="33.700000000000045" y="566" font-size="15" font-weight="500" fill="#1f2925" text-anchor="start">可靠的 Plan-and-Execute 是闭环，而不是生成十步清单后无条件跑到底：</text><rect x="558.3000000000001" y="545" width="112" height="30.4" rx="15.2" fill="#e6eef9" stroke="#3f6fb5" stroke-width="1.2"/><text x="614.3000000000001" y="565.96" font-size="16" font-weight="600" fill="#2b5493" text-anchor="middle">粗粒度规划</text><!--chipw:112--><path d="M680.3000000000001 560 H708.3000000000001" fill="none" stroke="#6b746f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-line)"/><rect x="718.3000000000001" y="545" width="128" height="30.4" rx="15.2" fill="#e6eef9" stroke="#3f6fb5" stroke-width="1.2"/><text x="782.3000000000001" y="565.96" font-size="16" font-weight="600" fill="#2b5493" text-anchor="middle">执行一个阶段</text><!--chipw:128--><path d="M856.3000000000001 560 H884.3000000000001" fill="none" stroke="#6b746f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-line)"/><rect x="894.3000000000001" y="545" width="96" height="30.4" rx="15.2" fill="#e6eef9" stroke="#3f6fb5" stroke-width="1.2"/><text x="942.3000000000001" y="565.96" font-size="16" font-weight="600" fill="#2b5493" text-anchor="middle">验证产物</text><!--chipw:96--><path d="M1000.3000000000001 560 H1028.3000000000002" fill="none" stroke="#6b746f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-line)"/><rect x="1038.3000000000002" y="545" width="128" height="30.4" rx="15.2" fill="#fdeae4" stroke="#d1654a" stroke-width="1.2"/><text x="1102.3000000000002" y="565.96" font-size="16" font-weight="600" fill="#a2452e" text-anchor="middle">必要时重规划</text><!--chipw:128--></svg>