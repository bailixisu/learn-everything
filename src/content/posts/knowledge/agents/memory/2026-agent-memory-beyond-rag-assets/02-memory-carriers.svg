<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">外部文本、潜变量和参数记忆的读取路径</title><desc id="desc">对照文本检索回上下文、压缩后连续 token 注入输入表示，以及提炼监督更新 LoRA 参数的三条路径。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#8092a4" stroke-width="1.5"/></marker></defs><rect width="1600" height="1050" fill="#f4f7fa"/><text x="64" y="65" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="650" fill="#087f86">WHERE MEMORY LIVES</text><text x="64" y="132" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="47" font-weight="700" fill="#243449">同样叫记忆，影响模型的路径不同</text><text x="64" y="184" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="400" fill="#5b6e82">检索索引中的向量，与模型直接读取的连续记忆，不是同一种用途。</text><text x="64" y="235" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#087f86">文字 / 结构记忆</text><rect x="64" y="265" width="332" height="112" rx="20" fill="#ffffff" stroke="#dbe4ec" stroke-width="2"/><text x="86" y="310" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="600" fill="#087f86">历史与观察</text><text x="86" y="351" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#5b6e82">形成显式证据</text><path d="M 406 321 L 430 321" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="444" y="265" width="332" height="112" rx="20" fill="#ffffff" stroke="#dbe4ec" stroke-width="2"/><text x="466" y="310" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="600" fill="#087f86">原文、记录、关系</text><text x="466" y="351" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#5b6e82">索引负责定位</text><path d="M 786 321 L 810 321" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="824" y="265" width="332" height="112" rx="20" fill="#ffffff" stroke="#dbe4ec" stroke-width="2"/><text x="846" y="310" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="600" fill="#087f86">检索为文字上下文</text><text x="846" y="351" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#5b6e82">文字进入提示词</text><path d="M 1166 321 L 1190 321" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="1204" y="265" width="332" height="112" rx="20" fill="#ffffff" stroke="#dbe4ec" stroke-width="2"/><text x="1226" y="310" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="600" fill="#087f86">模型生成</text><text x="1226" y="351" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#5b6e82">基座可保持固定</text><text x="64" y="426" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#526779">MemRL / MemoryLACE 等：主要改变外部记忆内容、关系和使用策略</text><text x="64" y="488" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#785ca7">连续潜变量记忆</text><rect x="64" y="518" width="332" height="112" rx="20" fill="#ffffff" stroke="#dbe4ec" stroke-width="2"/><text x="86" y="563" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="600" fill="#785ca7">操作经历</text><text x="86" y="604" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#5b6e82">例如 GUI 轨迹</text><path d="M 406 574 L 430 574" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="444" y="518" width="332" height="112" rx="20" fill="#ffffff" stroke="#dbe4ec" stroke-width="2"/><text x="466" y="563" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="600" fill="#785ca7">训练过的压缩器</text><text x="466" y="604" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#5b6e82">保留可恢复的信息</text><path d="M 786 574 L 810 574" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="824" y="518" width="332" height="112" rx="20" fill="#ffffff" stroke="#dbe4ec" stroke-width="2"/><text x="846" y="563" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="600" fill="#785ca7">连续 token 与读出</text><text x="846" y="604" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#5b6e82">按当前状态选择</text><path d="M 1166 574 L 1190 574" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="1204" y="518" width="332" height="112" rx="20" fill="#ffffff" stroke="#dbe4ec" stroke-width="2"/><text x="1226" y="563" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="600" fill="#785ca7">模型生成</text><text x="1226" y="604" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#5b6e82">输入表示影响动作</text><text x="64" y="679" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#526779">FocusMem：训练记忆通路，冻结 GUI 主策略；无需先还原为文字摘要</text><text x="64" y="741" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#a16b2b">参数记忆</text><rect x="64" y="771" width="332" height="112" rx="20" fill="#ffffff" stroke="#dbe4ec" stroke-width="2"/><text x="86" y="816" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="600" fill="#a16b2b">当前任务历史</text><text x="86" y="857" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#5b6e82">达到记忆触发条件</text><path d="M 406 827 L 430 827" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="444" y="771" width="332" height="112" rx="20" fill="#ffffff" stroke="#dbe4ec" stroke-width="2"/><text x="466" y="816" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="600" fill="#a16b2b">提炼问答监督</text><text x="466" y="857" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#5b6e82">生成有依据的样本</text><path d="M 786 827 L 810 827" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="824" y="771" width="332" height="112" rx="20" fill="#ffffff" stroke="#dbe4ec" stroke-width="2"/><text x="846" y="816" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="600" fill="#a16b2b">在线更新 LoRA Δ</text><text x="846" y="857" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#5b6e82">执行参数更新</text><path d="M 1166 827 L 1190 827" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="1204" y="771" width="332" height="112" rx="20" fill="#ffffff" stroke="#dbe4ec" stroke-width="2"/><text x="1226" y="816" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="600" fill="#a16b2b">适配后模型生成</text><text x="1226" y="857" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#5b6e82">使用 θ₀ + Δ</text><text x="64" y="932" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#526779">TMEM：单次任务内更新快权重；跨会话保存、隔离和撤销需额外设计</text><text x="64" y="1007" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#5b6e82">原创概念对照  ·  三种路径可组合；并非所有持续学习都要求改动基础模型权重。</text></svg>