amily="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#687a8c">09 / 08</text><text x="848" y="743" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="500" fill="#243449">按事件分区，用树指导合并</text><text x="848" y="792" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="400" fill="#5b6e82">压缩冗余，同时保留事件联系</text><rect x="64" y="853" width="712" height="185" rx="20" fill="#ffffff" stroke="#dbe4ec" stroke-width="2"/><text x="88" y="895" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#785ca7">07</text><text x="141" y="896" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" fill="#785ca7">FocusMem</text><text x="664" y="895" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#687a8c">08 / 05</text><text x="88" y="952" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="500" fill="#243449">连续记忆：内容、读出与门控</text><text x="88" y="1001" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="400" fill="#5b6e82">GUI 主策略冻结；实现尚待发布</text><rect x="824" y="853" width="712" height="185" rx="20" fill="#ffffff" stroke="#dbe4ec" stroke-width="2"/><text x="848" y="895" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#785ca7">08</text><text x="901" y="896" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" fill="#785ca7">TMEM</text><text x="1424" y="895" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#687a8c">06 / 03</text><text x="848" y="952" font-family="'PingFang S