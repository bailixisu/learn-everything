<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1144" viewBox="0 0 1600 1144" role="img" aria-labelledby="title desc"><title id="title">2026 Agent 记忆的八条新路线</title><desc id="desc">效用学习、记忆技能、生命周期、规则、环境核验、事件压缩、连续记忆和 LoRA 参数记忆。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#8092a4" stroke-width="1.5"/></marker></defs><rect width="1600" height="1144" fill="#f4f7fa"/><text x="64" y="65" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="650" fill="#087f86">AGENT MEMORY / 2026</text><text x="64" y="132" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="49" font-weight="700" fill="#243449">从“存下来”到“决定如何使用”</text><text x="64" y="184" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="400" fill="#5b6e82">八项新研究，分别改变记忆的读写控制、有效性或载体。</text><rect x="64" y="226" width="712" height="185" rx="20" fill="#ffffff" stroke="#dbe4ec" stroke-width="2"/><text x="88" y="268" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#087f86">01</text><text x="141" y="269" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" fill="#087f86">MemRL</text><text x="664" y="268" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#687a8c">01 / 06</text><text x="88" y="325" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="500" fill="#243449">任务反馈 → 学习经验效用</text><text x="88" y="374" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="400" fill="#5b6e82">相关性筛候选，效用参与选择</text><rect x="824" y="226" width="712" height="185" rx="20" fill="#ffffff" stroke="#dbe4ec" stroke-width="2"/><text x="848" y="268" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#087f86">02</text><text x="901" y="269" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" fill="#087f86">MemSkill</text><text x="1424" y="268" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#687a8c">02 / 02</text><text x="848" y="325" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="500" fill="#243449">学习“如何构造记忆”的技能</text><text x="848" y="374" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="400" fill="#5b6e82">控制器选技能，设计器改进技能</text><rect x="64" y="435" width="712" height="185" rx="20" fill="#ffffff" stroke="#dbe4ec" stroke-width="2"/><text x="88" y="477" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#3f6ba8">03</text><text x="141" y="478" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" fill="#3f6ba8">MemoryLACE</text><text x="664" y="477" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#687a8c">09 / 02</text><text x="88" y="534" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="500" fill="#243449">显式记录替代、合并与冲突</text><text x="88" y="583" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="400" fill="#5b6e82">把有关联的证据一起交给模型</text><rect x="824" y="435" width="712" height="185" rx="20" fill="#ffffff" stroke="#dbe4ec" stroke-width="2"/><text x="848" y="477" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#3f6ba8">04</text><text x="901" y="478"