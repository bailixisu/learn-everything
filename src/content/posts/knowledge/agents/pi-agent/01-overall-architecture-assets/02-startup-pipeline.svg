<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Pi Coding Agent 启动装配流程</title>
  <desc id="desc">从 CLI 参数解析开始，依次经过会话定位、项目信任、运行服务创建、AgentSession 装配，最终进入不同运行模式。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#132238"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#67e8f9"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020617" flood-opacity=".4"/>
    </filter>
  </defs>

  <rect width="1200" height="820" rx="28" fill="url(#bg)"/>
  <text x="62" y="66" fill="#f1f5f9" font-family="Inter, PingFang SC, sans-serif" font-size="32" font-weight="700">启动不是一次模型调用，而是一次运行时装配</text>
  <text x="62" y="101" fill="#94a3b8" font-family="Inter, PingFang SC, sans-serif" font-size="17">main() 确定环境，createAgentSession() 连接各个模块</text>

  <g font-family="Inter, PingFang SC, sans-serif" filter="url(#shadow)">
    <g>
      <rect x="65" y="165" width="300" height="135" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
      <text x="90" y="202" fill="#93c5fd" font-size="14" font-weight="700">STEP 01</text>
      <text x="90" y="238" fill="#dbeafe" font-size="23" font-weight="700">解析 CLI 与运行模式</text>
      <text x="90" y="269" fill="#bfdbfe" font-size="15">参数 · stdin · @file · login · package</text>
    </g>
    <g>
      <rect x="450" y="165" width="300" height="135" rx="18" fill="#162d42" stroke="#38bdf8" stroke-width="2"/>
      <text x="475" y="202" fill="#7dd3fc" font-size="14" font-weight="700">STEP 02</text>
      <text x="475" y="238" fill="#e0f2fe" font-size="23" font-weight="700">定位或创建 Session</text>
      <text x="475" y="269" fill="#bae6fd" font-size="15">new · continue · resume · fork</text>
    </g>
    <g>
      <rect x="835" y="165" width="300" height="135" rx="18" fill="#26324a" stroke="#a78bfa" stroke-width="2"/>
      <text x="860" y="202" fill="#c4b5fd" font-size="14" font-weight="700">STEP 03</text>
      <text x="860" y="238" fill="#ede9fe" font-size="23" font-weight="700">解析 Project Trust</text>
      <text x="860" y="269" fill="#ddd6fe" font-size="15">决定是否加载项目级可执行资源</text>
    </g>

    <g>
      <rect x="835" y="460" width="300" height="155" rx="18" fill="#153b35" stroke="#5eead4" stroke-width="2"/>
      <text x="860" y="497" fill="#5eead4" font-size="14" font-weight="700">STEP 04</text>
      <text x="860" y="533" fill="#ccfbf1" font-size="23" font-weight="700">创建运行服务</text>
      <text x="860" y="566" fill="#99f6e4" font-size="15">SettingsManager · ModelRuntime</text>
      <text x="860" y="591" fill="#99f6e4" font-size="15">ResourceLoader</text>
    </g>
    <g>
      <rect x="450" y="460" width="300" height="155" rx="18" fill="#39214f" stroke="#c084fc" stroke-width="2"/>
      <text x="475" y="497" fill="#d8b4fe" font-size="14" font-weight="700">STEP 05</text>
      <text x="475" y="533" fill="#f3e8ff" font-size="23" font-weight="700">组装 AgentSession</text>
      <text x="475" y="566" fill="#e9d5ff" font-size="15">Agent + Tools + Prompt + Extensions</text>
      <text x="475" y="591" fill="#e9d5ff" font-size="15">恢复 Messages / Model / Thinking</text>
    </g>
    <g>
      <rect x="65" y="460" width="300" height="155" rx="18" fill="#432a14" stroke="#fbbf24" stroke-width="2"/>
      <text x="90" y="497" fill="#fcd34d" font-size="14" font-weight="700">STEP 06</text>
      <text x="90" y="533" fill="#fef3c7" font-size="23" font-weight="700">启动外层 Mode</text>
      <text x="90" y="566" fill="#fde68a" font-size="15">Interactive · Print · JSON · RPC</text>
      <text x="90" y="591" fill="#fde68a" font-size="15">共享同一个 Session Runtime</text>
    </g>
  </g>

  <g fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)">
    <path d="M365 232 H438"/>
    <path d="M750 232 H823"/>
    <path d="M985 300 V448"/>
    <path d="M835 537 H762"/>
    <path d="M450 537 H377"/>
  </g>

  <g font-family="Inter, PingFang SC, sans-serif">
    <rect x="150" y="682" width="900" height="82" rx="16" fill="#101d2c" stroke="#334155"/>
    <text x="600" y="716" text-anchor="middle" fill="#cbd5e1" font-size="17">关键分界：前四步决定“加载什么”，第五步决定“怎样连接”</text>
    <text x="600" y="744" text-anchor="middle" fill="#7dd3fc" font-size="16">直到 Mode 收到用户输入，Agent Loop 才真正开始运行</text>
  </g>
</svg>
