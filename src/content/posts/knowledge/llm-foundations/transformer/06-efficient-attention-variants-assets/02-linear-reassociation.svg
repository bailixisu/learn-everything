<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">核线性注意力的矩阵重排</title><desc id="desc">路径 A 构造 N×N 核权重；路径 B 先生成 r×dv 状态，再计算 Phi(Q)S，最后都需要归一化。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#728198" stroke-width="1.6"/></marker></defs>
<rect width="100%" height="100%" fill="#F5F7FA"/>
<text x="64" y="62" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#137F87" font-weight="600" text-anchor="start">LINEAR ATTENTION · REASSOCIATION</text><text x="64" y="124" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="45" fill="#28344A" font-weight="700" text-anchor="start">从逐对比较，到先汇总再读取</text><text x="64" y="171" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" fill="#596A80" font-weight="400" text-anchor="start">限定同一个可分解核 κ(q,k) = φ(q)ᵀφ(k)，先观察输出的分子。</text><rect x="64" y="215" width="1472" height="305" rx="18" fill="#FFFFFF" stroke="#DCE3EB" stroke-width="2"/><text x="94" y="264" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#AB5F44" font-weight="600" text-anchor="start">路径 A：显式构造权重</text><rect x="110" y="310" width="180" height="104" rx="12" fill="#F4F7FA" stroke="#DCE3EB" stroke-width="2"/><text x="200.0" y="351" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" fill="#28344A" font-weight="600" text-anchor="middle">Φ(Q)</text><text x="200.0" y="390" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#596A80" font-weight="400" text-anchor="middle">N × r</text><rect x="361" y="310" width="180" height="104" rx="12" fill="#F4F7FA" stroke="#DCE3EB" stroke-width="2"/><text x="451.0" y="351" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" fill="#28344A" font-weight="600" text-anchor="middle">Φ(K)ᵀ</text><text x="451.0" y="390" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#596A80" font-weight="400" text-anchor="middle">r × N</text><rect x="673" y="310" width="235" height="104" rx="12" fill="#FFF3ED" stroke="#DCE3EB" stroke-width="2"/><text x="790.5" y="351" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" fill="#28344A" font-weight="600" text-anchor="middle">核相似度</text><text x="790.5" y="390" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#596A80" font-weight="400" text-anchor="middle">N × N</text><rect x="1068" y="310" width="180" height="104" rx="12" fill="#F4F7FA" stroke="#DCE3EB" stroke-width="2"/><text x="1158.0" y="351" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" fill="#28344A" font-weight="600" text-anchor="middle">V</text><text x="1158.0" y="390" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#596A80" font-weight="400" text-anchor="middle">N × dᵥ</text><rect x="1340" y="310" width="160" height="104" rx="12" fill="#F4F7FA" stroke="#DCE3EB" stroke-width="2"/><text x="1420.0" y="351" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" fill="#28344A" font-weight="600" text-anchor="middle">分子</text><text x="1420.0" y="390" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#596A80" font-weight="400" text-anchor="middle">N × dᵥ</text><text x="320" y="371" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="32" fill="#28344A" font-weight="400" text-anchor="start">×</text><path d="M558 364 L648 364" stroke="#728198" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="990" y="371" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="32" fill="#28344A" font-weight="400" text-anchor="start">×</text><path d="M1262 364 L1320 364" stroke="#728198" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="110" y="475" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#AB5F44" font-weight="600" text-anchor="start">中间矩阵随 N² 增长</text><text x="670" y="475" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#596A80" font-weight="400" text-anchor="start">相同的核权重，另一种执行顺序</text><rect x="64" y="546" width="1472" height="305" rx="18" fill="#FFFFFF" stroke="#DCE3EB" stroke-width="2"/><text x="94" y="595" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#137F87" font-weight="600" text-anchor="start">路径 B：先汇总 Key–Value 关联</text><rect x="110" y="641" width="180" height="104" rx="12" fill="#F4F7FA" stroke="#DCE3EB" stroke-width="2"/><text x="200.0" y="682" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" fill="#28344A" font-weight="600" text-anchor="middle">Φ(K)ᵀ</text><text x="200.0" y="721" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#596A80" font-weight="400" text-anchor="middle">r × N</text><rect x="361" y="641" width="180" height="104" rx="12" fill="#F4F7FA" stroke="#DCE3EB" stroke-width="2"/><text x="451.0" y="682" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" fill="#28344A" font-weight="600" text-anchor="middle">V</text><text x="451.0" y="721" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#596A80" font-weight="400" text-anchor="middle">N × dᵥ</text><rect x="673" y="641" width="235" height="104" rx="12" fill="#E2F3F0" stroke="#DCE3EB" stroke-width="2"/><text x="790.5" y="682" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" fill="#28344A" font-weight="600" text-anchor="middle">状态 S</text><text x="790.5" y="721" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#596A80" font-weight="400" text-anchor="middle">r × dᵥ</text><rect x="1068" y="641" width="180" height="104" rx="12" fill="#F4F7FA" stroke="#DCE3EB" stroke-width="2"/><text x="1158.0" y="682" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" fill="#28344A" font-weight="600" text-anchor="middle">Φ(Q)</text><text x="1158.0" y="721" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#596A80" font-weight="400" text-anchor="middle">N × r</text><rect x="1340" y="641" width="160" height="104" rx="12" fill="#F4F7FA" stroke="#DCE3EB" stroke-width="2"/><text x="1420.0" y="682" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" fill="#28344A" font-weight="600" text-anchor="middle">分子</text><text x="1420.0" y="721" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#596A80" font-weight="400" text-anchor="middle">N × dᵥ</text><text x="320" y="702" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="32" fill="#28344A" font-weight="400" text-anchor="start">×</text><path d="M558 695 L648 695" stroke="#728198" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="975" y="685" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#596A80" font-weight="400" text-anchor="start">读取</text><path d="M1047 695 L935 695" stroke="#728198" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1262 695 L1320 695" stroke="#728198" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="110" y="806" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#137F87" font-weight="600" text-anchor="start">输出分子 = Φ(Q) S</text><text x="670" y="806" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#596A80" font-weight="400" text-anchor="start">r 固定：聚合成本 O(N r dᵥ)</text><text x="64" y="910" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" fill="#28344A" font-weight="400" text-anchor="start">归一化：z = Σ φ(k)，每个 Query 的分子还需除以 φ(q)ᵀz。</text><text x="64" y="955" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" fill="#596A80" font-weight="400" text-anchor="start">因果情形只累计可见前缀；这里的结合律不能直接用于原始 softmax(QKᵀ)V。</text>
</svg>