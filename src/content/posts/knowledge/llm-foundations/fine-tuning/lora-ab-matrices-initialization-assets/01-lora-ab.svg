<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1032" viewBox="0 0 1600 1032" role="img" aria-labelledby="title desc"><title id="title">LoRA A B 矩阵形状与初始化梯度</title><desc id="desc">输入同时经过冻结基座与可训练低秩分支。A 随机 B 为零，首次反传 B 得到梯度，随后 A 得到梯度。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#8092a4" stroke-width="1.5"/></marker></defs><rect width="1600" height="1032" fill="#f4f7fa"/><text x="64" y="65" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="650" fill="#087f86">LOW-RANK ADAPTATION</text><text x="64" y="135" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="49" font-weight="700" fill="#243449">冻结大矩阵，用 A / B 学习增量</text><text x="64" y="188" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="400" fill="#5b6e82">列向量约定：y = W₀x + s B(Ax)，标准缩放 s = α / r。</text><rect x="70" y="387" width="204" height="110" rx="20" fill="#fff" stroke="#dbe4ec" stroke-width="2"/><text x="126" y="434" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="600" fill="#243449">输入 x</text><text x="126" y="473" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#526779">d_in × 1</text><rect x="561" y="244" width="478" height="116" rx="20" fill="#edf2fa" stroke="#bdcee4" stroke-width="2"/><text x="606" y="295" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="33" font-weight="650" fill="#3f6ba8">W₀  /  冻结基座</text><text x="691" y="337" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="400" fill="#526779">d_out × d_in</text><path d="M274 420 L330 420 L330 303 L549 303" fill="none" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><path d="M1040 303 L1320 303 L1320 427 L1380 427" fill="none" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="421" y="461" width="292" height="120" rx="20" fill="#e8f6f2" stroke="#b7dcd5" stroke-width="2"/><text x="496" y="508" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" fill="#087f86">A / 可训练</text><text x="504" y="552" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="400" fill="#526779">r × d_in</text><rect x="836" y="461" width="292" height="120" rx="20" fill="#e8f6f2" stroke="#b7dcd5" stroke-width="2"/><text x="913" y="508" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" fill="#087f86">B / 可训练</text><text x="919" y="552" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="400" fill="#526779">d_out × r</text><path d="M274 463 L330 463 L330 521 L409 521" fill="none" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><path d="M721 521 L824 521" fill="none" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><text x="748" y="499" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" fill="#526779">r 维</text><path d="M1136 521 L1320 521 L1320 461 L1380 461" fill="none" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><text x="1190" y="503" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="650" fill="#087f86">× s</text><rect x="1392" y="394" width="144" height="104" rx="20" fill="#fff" stroke="#dbe4ec" stroke-width="2"/><text x="1414" y="458" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" fill="#243449">Σ → y</text><text x="64" y="654" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="650" fill="#243449">初始化与前两次反向传播</text><rect x="64" y="692" width="456" height="185" rx="20" fill="#fff" stroke="#dbe4ec" stroke-width="2"/><text x="88" y="738" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="650" fill="#087f86">① A 随机，B 为零</text><text x="88" y="798" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="400" fill="#243449">BA = 0</text><text x="88" y="842" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#526779">起始输出等于基座</text><path d="M530 786 L558 786" fill="none" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="572" y="692" width="456" height="185" rx="20" fill="#fff" stroke="#dbe4ec" stroke-width="2"/><text x="596" y="738" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="650" fill="#087f86">② 第一次反传</text><text x="596" y="798" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="400" fill="#243449">A 梯度 = 0；B 通常 ≠ 0</text><text x="596" y="842" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#526779">优化器先让 B 离开零</text><path d="M1038 786 L1066 786" fill="none" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="1080" y="692" width="456" height="185" rx="20" fill="#fff" stroke="#dbe4ec" stroke-width="2"/><text x="1104" y="738" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="650" fill="#087f86">③ 下一次反传</text><text x="1104" y="798" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="400" fill="#243449">B 已非零，A 获得梯度</text><text x="1104" y="842" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#526779">A / B 随任务损失共同学习</text><text x="64" y="935" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="400" fill="#936128">A / B 同时为零 → 两者数据梯度都为零，普通梯度下降无法启动该分支。</text><text x="64" y="986" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#687a8c">原创示意  ·  梯度讨论不包含权重衰减；实际训练仍需非退化输入与上游梯度。</text></svg>