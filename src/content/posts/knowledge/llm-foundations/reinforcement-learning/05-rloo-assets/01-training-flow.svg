e="37" font-weight="650" text-anchor="start">奖励：[1, 0, 0, 0]</text><path d="M788 595 L788 925" fill="none" stroke="#E6EBF1" stroke-width="2" stroke-dasharray=""/><text fill="#66768A" x="105" y="691" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="400" text-anchor="start">回答 1 的参照：[0, 0, 0]</text><text fill="#078B83" x="105" y="749" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="650" text-anchor="start">1 − mean(0, 0, 0) = +1</text><text fill="#66768A" x="105" y="825" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="400" text-anchor="start">回答 2 的参照：[1, 0, 0]</text><text fill="#B95B64" x="105" y="883" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="650" text-anchor="start">0 − mean(1, 0, 0) = −1/3</text></svg>