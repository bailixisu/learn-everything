'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" text-anchor="middle">3</text><text fill="#172D46" x="800" y="355" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="middle">减去基线</text><text fill="#66768A" x="800" y="396" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="middle">得到有正负的权重</text><path d="M865 281 L1054 281" fill="none" stroke="#BCC9D8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" marker-end="url(#arrow)"/><circle cx="1128" cy="281" r="37" fill="#fff" stroke="none" stroke-width="1"/><circle cx="1128" cy="281" r="28" fill="#8053CA" stroke="none" stroke-width="1"/><text fill="#fff" x="1128" y="290" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" text-anchor="middle">4</text><text fill="#172D46" x="1128" y="355" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="middle">重算 log-prob</text><text fill="#66768A" x="1128" y="396" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="middle">乘权重，构造损失</text><path d="M1193 281 L1382 281" fill="none" stroke="#BCC9D8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" marker-end="url(#arrow)"/><circle cx="1456" cy="281" r="37" fill="#fff" stroke="none" stroke-width="1"/><circle cx="1456" cy="281" r="28" fill="#172D46" stroke="none" stroke-width="1"/><text fill="#fff" x="1456" y="290" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" text-anchor="middle">5</text><text fill="#172D46" x="1456" y="355" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="middle">更新策略</text><text fill="#66768A" x="1456" y="396" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="middle">反向传播，再采样</text><path d="M1456 424 L1456 441 Q1456 458 1438 458 L1005 458" fill="none" stroke="#B7C5D5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M595 458 L164 458 Q144 458 144 438 L144 424" fill="none" stroke="#B7C5D5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="469" y="438" width="650" height="41" rx="0" fill="#F7F8FA" stroke="none" /><text fill="#66768A" x="800" y="466" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="500" text-anchor="middle">下一批问题 · 用更新后的策略生成</text><rect x="64" y="509" width="1472" height="462" rx="26" fill="#fff" stroke="#E1E6EC" filter="url(#shadow)"/><text fill="#078B83" x="100" y="556" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="650" text-anchor="start">把关键一步展开</text><path d="M68 1010 L1532 1010" fill="none" stroke="#DCE3EB" stroke-width="2" stroke-dasharray=""/><text fill="#66768A" x="68" y="1057" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" text-anchor="start">更新 policy；奖励与基线在本次策略反传中视为常量。</text><text fill="#8491A1" x="68" y="1092" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" text-anchor="start">原创教学图  ·  数值为机制示例，非模型性能测试</text><text fill="#8491A1" x="1532" y="1092" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="500" text-anchor="end">2026 / 09</text><text fill="#172D46" x="104" y="622" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="650" text-anchor="start">二选一：采到好答案</text><text fill="#66768A" x="104" y="678" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" text-anchor="start">初始概率</text><text fill="#386BEA" x="104" y="752" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="70" font-weight="700" text-anchor="start">0.50</text><text fill="#66768A" x="310" y="748" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="55" font-weight="400" text-anchor="start">→</text><text fill="#078B83" x="403" y="752" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="70" font-weight="700" text-anchor="start">0.55</text><text fill="#66768A" x="104" y="805" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" text-anchor="start">一次 SGD 后，好答案更容易被选中</text><path d="M722 588 L722 923" fill="none" stroke="#E6EBF1" stroke-width="2" stroke-dasharray=""/><rect x="783" y="594" width="170" height="39" rx="19" fill="#EDF7F5" stroke="none" /><text fill="#078B83" x="800" y="621" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" text-anchor="start">奖励差 +1</text><text fill="#172D46" x="783" y="692" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="550" text-anchor="start">梯度：−1 × (1 − 0.5) = −0.5</text><text fill="#172D46" x="783" y="768" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="550" text-anchor="start">参数：0 − 0.4 × (−0.5) = 0.2</text><text fill="#078B83" x="783" y="842" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="650" text-anchor="start">新概率：sigmoid(0.2) ≈ 0.5498</text><text fill="#66768A" x="104" y="928" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" text-anchor="start">梯度作用在模型参数上；概率通过新的参数重新计算。</text></svg>