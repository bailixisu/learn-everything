<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">REINFORCE 入门：奖励怎样变成模型的梯度</title><desc id="desc">用一个只有两个候选答案的模型，手算 REINFORCE 的概率、损失、梯度和 SGD 更新，理解基线、方差与完整在线训练流程。</desc><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAF0FF"/><stop offset="1" stop-color="#F7F8FA"/></linearGradient><radialGradient id="orb"><stop stop-color="#DCE8FA" stop-opacity=".7"/><stop offset="1" stop-color="#DCE8FA" stop-opacity="0"/></radialGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#304A6C" flood-opacity=".045"/></filter><marker id="arrow" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto"><path d="M2 2 L8 5 L2 8" stroke="#A5B6CA" stroke-width="1.8" fill="none"/></marker></defs><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#F7F8FA" stroke="none" /><rect x="0" y="0" width="1600" height="210" rx="0" fill="url(#wash)" stroke="none" /><circle cx="1490" cy="30" r="185" fill="url(#orb)" stroke="none" stroke-width="1"/><text fill="#386BEA" x="68" y="67" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="start">LEARN EVERYTHING</text><text fill="#66768A" x="1532" y="67" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="500" text-anchor="end">FIELD GUIDE   /   01</text><text fill="#172D46" x="68" y="138" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="48" font-weight="700" text-anchor="start">从一个分数，走到一次参数更新</text><text fill="#66768A" x="68" y="187" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="500" text-anchor="start">REINFORCE   ·   大模型后训练链路</text><path d="M145 281 L1455 281" fill="none" stroke="#DBE2EB" stroke-width="7" s