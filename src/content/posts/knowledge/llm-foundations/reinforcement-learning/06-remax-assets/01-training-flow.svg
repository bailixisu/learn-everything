<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">ReMax 入门：用贪心答案当作自己的参照</title><desc id="desc">解释随机生成与贪心生成的双路流程，手算奖励差和策略更新，区分贪心基线、最优答案、RLOO 和 critic。</desc><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAF0FF"/><stop offset="1" stop-color="#F7F8FA"/></linearGradient><radialGradient id="orb"><stop stop-color="#DCE8FA" stop-opacity=".7"/><stop offset="1" stop-color="#DCE8FA" stop-opacity="0"/></radialGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#304A6C" flood-opacity=".045"/></filter><marker id="arrow" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto"><path d="M2 2 L8 5 L2 8" stroke="#A5B6CA" stroke-width="1.8" fill="none"/></marker></defs><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#F7F8FA" stroke="none" /><rect x="0" y="0" width="1600" height="210" rx="0" fill="url(#wash)" stroke="none" /><circle cx="1490" cy="30" r="185" fill="url(#orb)" stroke="none" stroke-width="1"/><text fill="#386BEA" x="68" y="67" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="start">LEARN EVERYTHING</text><text fill="#66768A" x="1532" y="67" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="500" text-anchor="end">FIELD GUIDE   /   06</text><text fill="#172D46" x="68" y="138" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="48" font-weight="700" text-anchor="start">随机尝试，与当前的贪心回答比较</text><text fill="#66768A" x="68" y="187" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="500" text-anchor="start">ReMax   ·   大模型后训练链路</text><path d="M145 281 L1455 281" fill="none" stroke="#DBE2EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><circle cx="144" cy="281" r="37" fill="#fff" stroke="none" stroke-width="1"/><circle cx="144" cy="281" r="28" fill="#386BEA" stroke="none" stroke-width="1"/><text fill="#fff" x="144" y="290" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" text-anchor="middle">1</text><text fill="#172D46" x="144" y="355" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="middle">输入同一问题</text><text fill="#66768A" x="144" y="396" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="middle">一份 prompt，两条路</text><path d="M209 281 L398 281" fill="none" stroke="#BCC9D8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" marker-end="url(#arrow)"/><circle cx="472" cy="281" r="37" fill="#fff" stroke="none" stroke-width="1"/><circle cx="472" cy="281" r="28" fill="#D57935" stroke="none" stroke-width="1"/><text fill="#fff" x="472" y="290" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" text-anchor="middle">2</text><text fill="#172D46" x="472" y="355" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="middle">随机与贪心生成</text><text fill="#66768A" x="472" y="396" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="middle">均来自当前策略</text><path d="M537 281 L726 281" fill="none" stroke="#BCC9D8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" marker-end="url(#arrow)"/><circle cx="800" cy="281" r="37" fill="#fff" stroke="none" stroke-width="1"/><circle cx="800" cy="281" r="28" fill="#078B83" stroke="none" stroke-width="1"/><text fill="#fff" x="800" y="290" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" text-anchor="middle">3</text><text fill="#172D46" x="800" y="355" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="middle">分别评分取差</text><text fill="#66768A" x="800" y="396" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="middle">随机奖励 − 贪心奖励</text><path d="M865 281 L1054 281" fill="none" stroke="#BCC9D8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" marker-end="url(#arrow)"/><circle cx="1128" cy="281" r="37" fill="#fff" stroke="none" stroke-width="1"/><circle cx="1128" cy="281" r="28" fill="#8053CA" stroke="none" stroke-width="1"/><text fill="#fff" x="1128" y="290" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" text-anchor="middle">4</text><text fill="#172D46" x="1128" y="355" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="middle">随机分支重算</text><text fill="#66768A" x="1128" y="396" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="middle">贪心结果只提供基线</text><path d="M1193 281 L1382 281" fill="none" stroke="#BCC9D8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" marker-end="url(#arrow)"/><circle cx="1456" cy="281" r="37" fill="#fff" stroke="none" stroke-width="1"/><circle cx="1456" cy="281" r="28" fill="#172D46" stroke="none" stroke-width="1"/><text fill="#fff" x="1456" y="290" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" text-anchor="middle">5</text><text fill="#172D46" x="1456" y="355" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="middle">更新策略</text><text fill="#66768A" x="1456" y="396" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="middle">不训练额外 critic</text><path d="M1456 424 L1456 441 Q1456 458 1438 458 L1005 458" fill="none" stroke="#B7C5D5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M595 458 L164 458 Q144 458 144 438 L144 424" fill="none" stroke="#B7C5D5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="469" y="438" width="650" height="41" rx="0" fill="#F7F8FA" stroke="none" /><text fill="#66768A" x="800" y="466" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="500" text-anchor="middle">下一批问题 · 用更新后的策略生成</text><rect x="64" y="509" width="1472" height="462" rx="26" fill="#fff" stroke="#E1E6EC" filter="url(#shadow)"/><text fill="#078B83" x="100" y="556" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="650" text-anchor="start">把关键一步展开</text><path d="M68 1010 L1532 1010" fill="none" stroke="#DCE3EB" stroke-width="2" stroke-dasharray=""/><text fill="#66768A" x="68" y="1057" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" text-anchor="start">贪心回答是当前策略的参照，不是标准答案，也不保证全局最优。</text><text fill="#8491A1" x="68" y="1092" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" text-anchor="start">原创教学图  ·  数值为机制示例，非模型性能测试</text><text fill="#8491A1" x="1532" y="1092" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="500" text-anchor="end">2026 / 09</text><rect x="104" y="594" width="150" height="39" rx="19" fill="#EEF2FD" stroke="none" /><text fill="#386BEA" x="121" y="621" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" text-anchor="start">同一问题</text><text fill="#386BEA" x="105" y="705" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="650" text-anchor="start">随机回答</text><text fill="#D57935" x="105" y="806" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="650" text-anchor="start">贪心回答</text><path d="M298 695 L440 695" fill="none" stroke="#386BEA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M298 797 L440 797" fill="none" stroke="#D57935" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" marker-end="url(#arrow)"/><text fill="#386BEA" x="480" y="706" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="650" text-anchor="start">奖励 0.9</text><text fill="#D57935" x="480" y="808" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="650" text-anchor="start">奖励 0.6</text><path d="M672 695 C748 695 738 748 795 748" fill="none" stroke="#386BEA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M672 797 C748 797 738 758 795 758" fill="none" stroke="#D57935" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" marker-end="url(#arrow)"/><circle cx="960" cy="753" r="95" fill="#EDF7F5" stroke="none" stroke-width="1"/><text fill="#078B83" x="960" y="759" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="58" font-weight="700" text-anchor="middle">+0.3</text><text fill="#078B83" x="960" y="799" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="600" text-anchor="middle">奖励差</text><text fill="#66768A" x="1113" y="716" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="400" text-anchor="start">用于加权</text><text fill="#172D46" x="1113" y="769" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="33" font-weight="650" text-anchor="start">随机回答的</text><text fill="#172D46" x="1113" y="817" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="33" font-weight="650" text-anchor="start">log-prob 梯度</text><text fill="#66768A" x="105" y="929" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" text-anchor="start">贪心回答只提供基线；本例不是把它作为监督目标去模仿。</text></svg>