<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">GRPO 入门：不用 critic，怎样用一组答案计算优势</title><desc id="desc">从同一道题采样四个答案开始，手算组内奖励标准化与 token 裁剪，解释 GRPO 的完整流程、零优势组和 KL 正则。</desc><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAF0FF"/><stop offset="1" stop-color="#F7F8FA"/></linearGradient><radialGradient id="orb"><stop stop-color="#DCE8FA" stop-opacity=".7"/><stop offset="1" stop-color="#DCE8FA" stop-opacity="0"/></radialGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#304A6C" flood-opacity=".045"/></filter><marker id="arrow" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto"><path d="M2 2 L8 5 L2 8" stroke="#A5B6CA" stroke-width="1.8" fill="none"/></marker></defs><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#F7F8FA" stroke="none" /><rect x="0" y="0" width="1600" height="210" rx="0" fill="url(#wash)" stroke="none" /><circle cx="1490" cy="30" r="185" fill="url(#orb)" stroke="none" stroke-width="1"/><text fill="#386BEA" x="68" y="67" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="start">LEARN EVERYTHING</text><text fill="#66768A" x="1532" y="67" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="500" text-anchor="end">FIELD GUIDE   /   04</text><text fill="#172D46" x="68" y="138" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="48" font-weight="700" text-anchor="start">同一道题，先比较，再更新</text><text fill="#66768A" x="68" y="187" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="500" text-anchor="start">GRPO   ·   大模型后训练链路</text><path d="M145 281 L1455 281" fill="none" stroke="#DBE2EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><circle cx="144" cy="281" r="37" fill="#fff" stroke="none" stroke-width="1"/><circle cx="144" cy="281" r="28" fill="#386BEA" stroke="none" stroke-width="1"/><text fill="#fff" x="144" y="290" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" text-anchor="middle">1</text><text fill="#172D46" x="144" y="355" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="middle">同题多次采样</text><text fill="#66768A" x="144" y="396" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="middle">保存每条回答与旧概率</text><path d="M209 281 L398 281" fill="none" stroke="#BCC9D8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" marker-end="url(#arrow)"/><circle cx="472" cy="281" r="37" fill="#fff" stroke="none" stroke-width="1"/><circle cx="472" cy="281" r="28" fill="#D57935" stroke="none" stroke-width="1"/><text fill="#fff" x="472" y="290" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" text-anchor="middle">2</text><text fill="#172D46" x="472" y="355" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="middle">逐条打分</text><text fill="#66768A" x="472" y="396" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="middle">一组奖励一起保留</text><path d="M537 281 L726 281" fill="none" stroke="#BCC9D8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" marker-end="url(#arrow)"/><circle cx="800" cy="281" r="37" fill="#fff" stroke="none" stroke-width="1"/><circle cx="800" cy="281" r="28" fill="#078B83" stroke="none" stroke-width="1"/><text fill="#fff" x="800" y="290" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" text-anchor="middle">3</text><text fill="#172D46" x="800" y="355" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="middle">组内标准化</text><text fill="#66768A" x="800" y="396" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="middle">减均值，再除标准差</text><path d="M865 281 L1054 281" fill="none" stroke="#BCC9D8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" marker-end="url(#arrow)"/><circle cx="1128" cy="281" r="37" fill="#fff" stroke="none" stroke-width="1"/><circle cx="1128" cy="281" r="28" fill="#8053CA" stroke="none" stroke-width="1"/><text fill="#fff" x="1128" y="290" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" text-anchor="middle">4</text><text fill="#172D46" x="1128" y="355" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="middle">token 比率裁剪</text><text fill="#66768A" x="1128" y="396" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="middle">重算概率，加入 KL 项</text><path d="M1193 281 L1382 281" fill="none" stroke="#BCC9D8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" marker-end="url(#arrow)"/><circle cx="1456" cy="281" r="37" fill="#fff" stroke="none" stroke-width="1"/><circle cx="1456" cy="281" r="28" fill="#172D46" stroke="none" stroke-width="1"/><text fill="#fff" x="1456" y="290" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" text-anchor="middle">5</text><text fill="#172D46" x="1456" y="355" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" text-anchor="middle">更新并同步</text><text fill="#66768A" x="1456" y="396" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="400" text-anchor="middle">无需训练 critic</text><path d="M1456 424 L1456 441 Q1456 458 1438 458 L1005 458" fill="none" stroke="#B7C5D5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M595 458 L164 458 Q144 458 144 438 L144 424" fill="none" stroke="#B7C5D5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="469" y="438" width="650" height="41" rx="0" fill="#F7F8FA" stroke="none" /><text fill="#66768A" x="800" y="466" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="500" text-anchor="middle">下一批问题 · 用更新后的策略生成</text><rect x="64" y="509" width="1472" height="462" rx="26" fill="#fff" stroke="#E1E6EC" filter="url(#shadow)"/><text fill="#078B83" x="100" y="556" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="650" text-anchor="start">把关键一步展开</text><path d="M68 1010 L1532 1010" fill="none" stroke="#DCE3EB" stroke-width="2" stroke-dasharray=""/><text fill="#66768A" x="68" y="1057" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" text-anchor="start">原始 GRPO：组内优势 + token 级裁剪 + reference KL；不依赖价值模型。</text><text fill="#8491A1" x="68" y="1092" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" text-anchor="start">原创教学图  ·  数值为机制示例，非模型性能测试</text><text fill="#8491A1" x="1532" y="1092" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="500" text-anchor="end">2026 / 09</text><text fill="#172D46" x="880" y="597" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="650" text-anchor="start">最后得到的优势</text><path d="M880 776 L1370 776" fill="none" stroke="#D2DCE7" stroke-width="2" stroke-dasharray=""/><rect x="922" y="701" width="64" height="75" rx="8" fill="#078B83" stroke="none" /><text fill="#078B83" x="954" y="687" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="600" text-anchor="middle">+1.00</text><text fill="#66768A" x="954" y="932" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="500" text-anchor="middle">回答 1</text><rect x="1040" y="701" width="64" height="75" rx="8" fill="#078B83" stroke="none" /><text fill="#078B83" x="1072" y="687" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="600" text-anchor="middle">+1.00</text><text fill="#66768A" x="1072" y="932" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="500" text-anchor="middle">回答 2</text><rect x="1158" y="776" width="64" height="75" rx="8" fill="#B95B64" stroke="none" /><text fill="#B95B64" x="1190" y="879" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="600" text-anchor="middle">-1.00</text><text fill="#66768A" x="1190" y="932" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="500" text-anchor="middle">回答 3</text><rect x="1276" y="776" width="64" height="75" rx="8" fill="#B95B64" stroke="none" /><text fill="#B95B64" x="1308" y="879" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="600" text-anchor="middle">-1.00</text><text fill="#66768A" x="1308" y="932" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="500" text-anchor="middle">回答 4</text><text fill="#172D46" x="105" y="620" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="37" font-weight="650" text-anchor="start">奖励：[1, 1, 0, 0]</text><path d="M788 595 L788 925" fill="none" stroke="#E6EBF1" stroke-width="2" stroke-dasharray=""/><text fill="#66768A" x="105" y="692" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="400" text-anchor="start">均值 = 0.5</text><text fill="#66768A" x="105" y="756" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="400" text-anchor="start">总体标准差 = 0.5</text><text fill="#078B83" x="105" y="837" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="650" text-anchor="start">(1 − 0.5) / 0.5 = +1</text><text fill="#B95B64" x="105" y="897" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="650" text-anchor="start">(0 − 0.5) / 0.5 = −1</text></svg>