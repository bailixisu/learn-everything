<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="956" viewBox="0 0 1600 956" role="img" aria-labelledby="title desc"><title id="title">从路由不一致到重放专家选择</title><desc id="desc">微小分数差异可能切换专家。R3 记录生成专家选择并在训练时重放，但仍使用当前参数进行更新。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#8092a4" stroke-width="1.5"/></marker></defs><rect width="1600" height="956" fill="#f4f7fa"/><text x="64" y="65" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="650" fill="#087f86">ROUTER REPLAY</text><text x="64" y="135" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="46" font-weight="700" fill="#243449">训练一个样本时，保留它走过的专家路径</text><text x="64" y="188" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="400" fill="#5b6e82">先区分同参数的执行差异，再考虑参数更新带来的策略变化。</text><text x="64" y="254" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="650" fill="#a16b2b">可能出现的差异 / top-k 边界附近</text><rect x="64" y="288" width="456" height="188" rx="20" fill="#fffaf2" stroke="#e7d6ba" stroke-width="2"/><text x="88" y="334" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="650" fill="#936128">Rollout 生成</text><text x="88" y="393" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#243449">E1：0.501  /  E2：0.500</text><text x="88" y="441" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#526779">此名额选择 E1</text><path d="M530 382 L558 382" fill="none" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="572" y="288" width="456" height="188" rx="20" fill="#fffaf2" stroke="#e7d6ba" stroke-width="2"/><text x="596" y="334" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="650" fill="#936128">训练引擎重算</text><text x="596" y="393" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#243449">E1：0.500  /  E2：0.501</text><text x="596" y="441" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#526779">同样参数，此名额却选 E2</text><path d="M1038 382 L1066 382" fill="none" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="1080" y="288" width="456" height="188" rx="20" fill="#fffaf2" stroke="#e7d6ba" stroke-width="2"/><text x="1104" y="334" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="650" fill="#936128">对 RL 的影响</text><text x="1104" y="393" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#243449">专家输出可能明显不同</text><text x="1104" y="441" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#526779">概率比与梯度可能异常</text><text x="64" y="553" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="650" fill="#087f86">R3 / 重放 rollout 的专家选择 mask</text><rect x="64" y="590" width="456" height="190" rx="20" fill="#eef8f5" stroke="#b7dcd5" stroke-width="2"/><text x="88" y="638" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" fill="#087f86">生成时记录</text><text x="88" y="697" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#243449">token / 层 / 实际专家索引</text><text x="88" y="745" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#526779">例如：此名额选择 E1</text><path d="M530 685 L558 685" fill="none" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="572" y="590" width="456" height="190" rx="20" fill="#eef8f5" stroke="#b7dcd5" stroke-width="2"/><text x="596" y="638" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" fill="#087f86">训练时重放</text><text x="596" y="697" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#243449">使用记录中的 E1 选择</text><text x="596" y="745" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#526779">用训练侧 logits 重算门控</text><path d="M1038 685 L1066 685" fill="none" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="1080" y="590" width="456" height="190" rx="20" fill="#eef8f5" stroke="#b7dcd5" stroke-width="2"/><text x="1104" y="638" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="650" fill="#087f86">当前参数参与更新</text><text x="1104" y="697" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#243449">专家参数仍可学习</text><text x="1104" y="745" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#526779">固定选择 ≠ 冻结全部权重</text><text x="64" y="856" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="400" fill="#526779">重放解决路径一致性；样本复用、路径陈旧、负载与奖励问题仍需分别处理。</text><text x="64" y="908" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#687a8c">原创单路由位置示例  ·  方法来源：R3（2025）与官方 Router Replay 文档</text></svg>