<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1015" viewBox="0 0 1600 1015" role="img" aria-labelledby="title desc"><title id="title">Dense 与 MoE 的计算路径和参数口径</title><desc id="desc">Dense 共用 FFN，MoE 从八个专家中选择两个。假设模型总参数十 B，每 token 激活约四 B。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#8092a4" stroke-width="1.5"/></marker></defs><rect width="1600" height="1015" fill="#f4f7fa"/><text x="64" y="65" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="650" fill="#087f86">MODEL ARCHITECTURE</text><text x="64" y="135" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="48" font-weight="700" fill="#243449">同样处理一个 token，调用的参数不同</text><text x="64" y="188" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="400" fill="#5b6e82">Dense 使用固定 FFN；稀疏 MoE 在多个专家中选择少数。</text><rect x="64" y="230" width="700" height="460" rx="20" fill="#fff" stroke="#dbe4ec" stroke-width="2"/><rect x="800" y="230" width="736" height="460" rx="20" fill="#fff" stroke="#dbe4ec" stroke-width="2"/><text x="96" y="280" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#3f6ba8">Dense / 稠密</text><text x="832" y="280" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#087f86">MoE / 混合专家</text><rect x="270" y="319" width="282" height="84" rx="20" fill="#eef3fb" stroke="#dbe4ec" stroke-width="2"/><text x="346" y="371" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="400" fill="#3f6ba8">token x</text><path d="M411 409 L411 447" fill="none" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="184" y="460" width="454" height="113" rx="20" fill="#e4edf9" stroke="#afc8e9" stroke-width="2"/><text x="290" y="510" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="600" fill="#3f6ba8">同一套 FFN</text><text x="254" y="550" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#526779">所有 token 经过这里</text><text x="122" y="641" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="400" fill="#526779">无需在这一层选择不同专家</text><rect x="972" y="319" width="398" height="84" rx="20" fill="#e7f5f2" stroke="#b7dcd5" stroke-width="2"/><text x="1012" y="371" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="600" fill="#087f86">Router 选择 top-2</text><path d="M1171 410 L1171 441" fill="none" stroke="#8092a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="832" y="461" width="152" height="64" rx="20" fill="#087f86" stroke="#087f86" stroke-width="2"/><text x="864" y="504" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="600" fill="#fff">E1</text><rect x="1008" y="461" width="152" height="64" rx="20" fill="#f3f6f9" stroke="#dbe4ec" stroke-width="2"/><text x="1040" y="504" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="600" fill="#6f8193">E2</text><rect x="1184" y="461" width="152" height="64" rx="20" fill="#f3f6f9" stroke="#dbe4ec" stroke-width="2"/><text x="1216" y="504" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="600" fill="#6f8193">E3</text><rect x="1360" y="461" width="152" height="64" rx="20" fill="#f3f6f9" stroke="#dbe4ec" stroke-width="2"/><text x="1392" y="504" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="600" fill="#6f8193">E4</text><rect x="832" y="544" width="152" height="64" rx="20" fill="#f3f6f9" stroke="#dbe4ec" stroke-width="2"/><text x="864" y="587" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="600" fill="#6f8193">E5</text><rect x="1008" y="544" width="152" height="64" rx="20" fill="#087f86" stroke="#087f86" stroke-width="2"/><text x="1040" y="587" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="600" fill="#fff">E6</text><rect x="1184" y="544" width="152" height="64" rx="20" fill="#f3f6f9" stroke="#dbe4ec" stroke-width="2"/><text x="1216" y="587" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="600" fill="#6f8193">E7</text><rect x="1360" y="544" width="152" height="64" rx="20" fill="#f3f6f9" stroke="#dbe4ec" stroke-width="2"/><text x="1392" y="587" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="600" fill="#6f8193">E8</text><text x="856" y="659" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="400" fill="#526779">高亮：本 token 激活  ·  其余：未选中</text><rect x="64" y="728" width="1472" height="243" rx="20" fill="#fff" stroke="#dbe4ec" stroke-width="2"/><text x="96" y="777" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="600" fill="#243449">假设模型：共享 2B + 8 组 × 每组 1B，选择 2 组</text><text x="96" y="841" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="44" font-weight="700" fill="#3f6ba8">总参数 10B</text><text x="615" y="841" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="44" font-weight="700" fill="#087f86">每 token 激活约 4B</text><text x="96" y="899" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="400" fill="#526779">全部专家仍需可访问；不能按 4B 估算完整模型权重存储。</text><text x="96" y="943" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="400" fill="#687a8c">教学参数统计，不是实际 FLOPs、显存或速度测量。</text></svg>