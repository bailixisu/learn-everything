<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" role="img"><title>多模态实验室：按任务阅读的六条主线</title><rect width="100%" height="100%" fill="#F7F8F5"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="42" y="56" font-size="33" fill="#233444" font-weight="bold">多模态实验室：按任务阅读的六条主线</text><text x="42" y="105" font-size="23" fill="#233444" font-weight="normal">按任务选择主线；箭头是学习依赖，不是所有模型的历史继承关系。</text><rect x="42" y="145" width="385" height="198" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="60" y="179" font-size="25" fill="#233444" font-weight="bold">视觉分类 / 对齐</text><text x="60" y="215" font-size="21" fill="#233444" font-weight="normal">ViT：像素 → token → 类别</text><text x="60" y="246" font-size="21" fill="#233444" font-weight="normal">CLIP：图像与文本共享表示</text><text x="60" y="277" font-size="21" fill="#233444" font-weight="normal">case：位置、颜色捷径、错配</text><rect x="455" y="145" width="385" height="198" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="473" y="179" font-size="25" fill="#233444" font-weight="bold">图文理解 / 工具</text><text x="473" y="215" font-size="21" fill="#233444" font-weight="normal">LLaMA / LLaVA / Qwen3-VL</text><text x="473" y="246" font-size="21" fill="#233444" font-weight="normal">看图 → 抽表 → 计划 → 计算</text><text x="473" y="277" font-size="21" fill="#233444" font-weight="normal">case：漏值、漏引用、图例</text><rect x="868" y="145" width="385" height="198" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="886" y="179" font-size="25" fill="#233444" font-weight="bold">图像生成 / 适配</text><text x="886" y="215" font-size="21" fill="#233444" font-weight="normal">DDPM → U-Net → Flow</text><text x="886" y="246" font-size="21" fill="#233444" font-weight="normal">FLUX LoRA / 新 token</text><text x="886" y="277" font-size="21" fill="#233444" font-weight="normal">case：loss 降低但类别没学会</text><rect x="42" y="375" width="385" height="198" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="60" y="409" font-size="25" fill="#233444" font-weight="bold">语音识别 / 合成</text><text x="60" y="445" font-size="21" fill="#233444" font-weight="normal">声学表示 / EnCodec / Whisper</text><text x="60" y="476" font-size="21" fill="#233444" font-weight="normal">Qwen ASR / Qwen TTS 分段</text><text x="60" y="507" font-size="21" fill="#233444" font-weight="normal">case：停止、截断、重复转录</text><rect x="455" y="375" width="385" height="198" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="473" y="409" font-size="25" fill="#233444" font-weight="bold">视频生成</text><text x="473" y="445" font-size="21" fill="#233444" font-weight="normal">运动方块 → Wan VAE</text><text x="473" y="476" font-size="21" fill="#233444" font-weight="normal">Wan2.2 采样 / LoRA / strength</text><text x="473" y="507" font-size="21" fill="#233444" font-weight="normal">case：时间顺序、变化量与质量</text><rect x="868" y="375" width="385" height="198" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="886" y="409" font-size="25" fill="#233444" font-weight="bold">分割 / 视频记忆</text><text x="886" y="445" font-size="21" fill="#233444" font-weight="normal">SAM2：提示 → 像素区域</text><text x="886" y="476" font-size="21" fill="#233444" font-weight="normal">新序列点击 → 因果记忆传播</text><text x="886" y="507" font-size="21" fill="#233444" font-weight="normal">case：首帧范围错误一直延续</text></g></svg>