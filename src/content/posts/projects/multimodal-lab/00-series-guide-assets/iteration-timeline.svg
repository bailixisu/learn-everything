<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="810" viewBox="0 0 1280 810" role="img"><title>五轮迭代：每一轮改变了哪一种证据</title><rect width="100%" height="100%" fill="#F7F8F5"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="42" y="56" font-size="33" fill="#233444" font-weight="bold">五轮迭代：每一轮改变了哪一种证据</text><rect x="42" y="110" width="1190" height="112" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="60" y="144" font-size="25" fill="#233444" font-weight="bold">R1｜跑通机制</text><text x="60" y="180" font-size="21" fill="#233444" font-weight="normal">8 组随机初始化训练；小 ViT / 合成 CLIP / Tiny DDPM</text><text x="60" y="211" font-size="21" fill="#233444" font-weight="normal">先验证前向、梯度与产物</text><rect x="42" y="242" width="1190" height="112" rx="14" fill="#EDF0F5" stroke="#AEC5CA"/><text x="60" y="276" font-size="25" fill="#233444" font-weight="bold">R2｜修正协议</text><text x="60" y="312" font-size="21" fill="#233444" font-weight="normal">80 个训练配置 / 管线；多 seed / 独立验证 / 多方向教学</text><text x="60" y="343" font-size="21" fill="#233444" font-weight="normal">负结果：微调和生成都可能失败</text><rect x="42" y="374" width="1190" height="112" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="60" y="408" font-size="25" fill="#233444" font-weight="bold">R3｜进入公开基座</text><text x="60" y="444" font-size="21" fill="#233444" font-weight="normal">30 组训练 / 8,380 次更新；Qwen / FLUX / Wan / SAM2 / ASR</text><text x="60" y="475" font-size="21" fill="#233444" font-weight="normal">增加自然数据与模型适配</text><rect x="42" y="506" width="1190" height="112" rx="14" fill="#EDF0F5" stroke="#AEC5CA"/><text x="60" y="540" font-size="25" fill="#233444" font-weight="bold">R4｜诊断误差来源</text><text x="60" y="576" font-size="21" fill="#233444" font-weight="normal">6 组新训练 / 3,600 次更新；提示 / 条件错配 / EOS / 强度</text><text x="60" y="607" font-size="21" fill="#233444" font-weight="normal">先分清感知、计划、停止与评价</text><rect x="42" y="638" width="1190" height="112" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="60" y="672" font-size="25" fill="#233444" font-weight="bold">R5｜做可执行修复</text><text x="60" y="708" font-size="21" fill="#233444" font-weight="normal">3 组新训练 / 1,800 次更新；图表工具 / TTS 分段 / 视频记忆</text><text x="60" y="739" font-size="21" fill="#233444" font-weight="normal">新 token 迁移门槛仍为 0/3</text></g></svg>