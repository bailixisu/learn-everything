<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img"><title>怎样读结果：指标和可用能力之间还有几层验证</title><rect width="100%" height="100%" fill="#F7F8F5"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="42" y="56" font-size="33" fill="#233444" font-weight="bold">怎样读结果：指标和可用能力之间还有几层验证</text><rect x="45" y="115" width="1185" height="103" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="63" y="149" font-size="25" fill="#233444" font-weight="bold">任务目标</text><text x="370" y="149" font-size="25" fill="#233444" font-weight="normal">分类正确？表格值准确？</text><text x="370" y="187" font-size="23" fill="#233444" font-weight="normal">音频内容完整？对象范围正确？</text><rect x="45" y="235" width="1185" height="103" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="63" y="269" font-size="25" fill="#233444" font-weight="bold">协议边界</text><text x="370" y="269" font-size="25" fill="#233444" font-weight="normal">固定 split、seed、checkpoint</text><text x="370" y="307" font-size="23" fill="#233444" font-weight="normal">独立单位与额外 GT 要注明</text><rect x="45" y="355" width="1185" height="103" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="63" y="389" font-size="25" fill="#233444" font-weight="bold">真实产物</text><text x="370" y="389" font-size="25" fill="#233444" font-weight="normal">打开原图、音频波形和固定帧</text><text x="370" y="427" font-size="23" fill="#233444" font-weight="normal">成功、失败、反例一起保留</text><rect x="45" y="475" width="1185" height="103" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="63" y="509" font-size="25" fill="#233444" font-weight="bold">指标解释</text><text x="370" y="509" font-size="25" fill="#233444" font-weight="normal">loss / ASR / 分类器是不同代理</text><text x="370" y="547" font-size="23" fill="#233444" font-weight="normal">oracle 上限不能当部署成绩</text><text x="45" y="640" font-size="23" fill="#233444" font-weight="normal">读一篇博文的顺序：先看问题和对照，再看结果图，最后判断结论可外推到哪里。</text></g></svg>