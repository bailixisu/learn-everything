<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img"><title>SAM2 图像路径：指定目标与预测像素</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#087E8B"/></marker></defs><rect width="100%" height="100%" fill="#F7F8F5"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="45" y="55" font-size="33" fill="#233444" font-weight="bold">SAM2 图像路径：指定目标与预测像素</text><rect x="45" y="115" width="345" height="130" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="63" y="149" font-size="25" fill="#233444" font-weight="bold">图像编码器（冻结）</text><text x="63" y="182" font-size="21" fill="#233444" font-weight="normal">RGB → 多尺度图像特征</text><text x="63" y="212" font-size="21" fill="#233444" font-weight="normal">图像特征可缓存</text><rect x="480" y="115" width="340" height="130" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="498" y="149" font-size="25" fill="#233444" font-weight="bold">Prompt Encoder（冻结）</text><text x="498" y="182" font-size="21" fill="#233444" font-weight="normal">正点 / 负点 / 框</text><text x="498" y="212" font-size="21" fill="#233444" font-weight="normal">表示目标位置与范围</text><rect x="920" y="115" width="310" height="130" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="938" y="149" font-size="25" fill="#233444" font-weight="bold">Mask Decoder</text><text x="938" y="182" font-size="21" fill="#233444" font-weight="normal">特征 + 提示 token</text><text x="938" y="212" font-size="21" fill="#233444" font-weight="normal">输出 3 个候选 mask</text><path d="M390,175 L435,175 L435,85 L875,85 L875,175 L920,175" fill="none" stroke="#087E8B" stroke-width="3" marker-end="url(#arrow)"/><path d="M820,210 L920,210" fill="none" stroke="#087E8B" stroke-width="3" marker-end="url(#arrow)"/><rect x="700" y="330" width="530" height="130" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="718" y="364" font-size="25" fill="#233444" font-weight="bold">模型分数选候选：argmax(iou_scores)</text><text x="718" y="397" font-size="21" fill="#233444" font-weight="normal">推理不读取 GT；IoU 质量预测不是实际 IoU</text><text x="718" y="427" font-size="21" fill="#233444" font-weight="normal">选中后再由离线评价程序计算真实 IoU</text><path d="M1075,245 L1075,330" fill="none" stroke="#087E8B" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="330" width="560" height="130" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="63" y="364" font-size="25" fill="#233444" font-weight="bold">训练：BCE + Dice + 分数校准</text><text x="63" y="397" font-size="21" fill="#233444" font-weight="normal">只更新部分 mask decoder；其他参数冻结</text><text x="63" y="427" font-size="21" fill="#233444" font-weight="normal">训练监督可用 GT，测试候选选择不可用 GT</text><text x="45" y="555" font-size="24" fill="#233444" font-weight="normal">第三轮：2 × 160 更新，验证均选择 step 0；第四轮：冻结模型测试点击策略。</text></g></svg>