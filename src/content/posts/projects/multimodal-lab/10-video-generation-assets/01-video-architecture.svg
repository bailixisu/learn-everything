<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Wan：在时空潜变量里生成，再解码成视频</title><desc id="desc">原创概念图；具体数值来自本文声明的冻结实验记录。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#416878"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#213a49;font-size:24px}.small{font-size:20px;fill:#526777}.title{font-size:32px;font-weight:700}.box{stroke:#acc7d1;stroke-width:2;fill:#e9f4f4}.flow{stroke:#416878;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1000" height="640" fill="#f7f8f5"/><text class="title" x="42" y="58">Wan：在时空潜变量里生成，再解码成视频</text><text class="small" x="42" y="105">图示采用 Wan2.1 的潜变量形状示例；Wan2.2 5B 使用不同 VAE。</text><rect class="box" x="45" y="150" width="225" height="100" rx="14"/><text x="157.5" y="190" text-anchor="middle">文字 → UMT5</text><text class="small" x="157.5" y="223" text-anchor="middle">固定文本条件</text><path class="flow" d="M157 250 L157 285 L497 285 L497 315"/><rect class="box" x="45" y="340" width="225" height="110" rx="14"/><text x="157.5" y="380" text-anchor="middle">高斯噪声</text><text class="small" x="157.5" y="413" text-anchor="middle">16 × 9 × 60 × 104</text><path class="flow" d="M275 395 L345 395"/><rect class="box" x="350" y="320" width="295" height="150" rx="14"/><text x="497.5" y="360" text-anchor="middle">时空 Transformer</text><text class="small" x="497.5" y="393" text-anchor="middle">速度预测 + 调度器循环</text><path class="flow" d="M650 395 L705 395"/><rect class="box" x="710" y="340" width="245" height="110" rx="14"/><text x="832.5" y="380" text-anchor="middle">视频 VAE 解码</text><text class="small" x="832.5" y="413" text-anchor="middle">33 帧 / 480 × 832</text><text class="small" x="45" y="515">训练：xσ = (1−σ)z + σε，目标速度 ε−z；只更新 LoRA。</text><text class="small" x="45" y="550">推理：从噪声沿调度器路径走向干净 latent；最后封装 MP4。</text><text class="small" x="45" y="585">17 → 5、33 → 9 个潜帧；帧率决定时长，潜变量标量比不是码率。</text></svg>