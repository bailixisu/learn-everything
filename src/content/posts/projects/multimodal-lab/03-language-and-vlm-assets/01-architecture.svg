    </text>
    <rect
      x="30"
      y="105"
      width="210"
      height="110"
      rx="13"
      fill="#e2ecfb"
      stroke="#bfcee1"
    />
    <text x="45" y="138" font-size="22" font-weight="600" fill="#1e293b">
      图片 48×48
    </text>
    <text x="45" y="167" font-size="22" font-weight="400" fill="#1e293b">
