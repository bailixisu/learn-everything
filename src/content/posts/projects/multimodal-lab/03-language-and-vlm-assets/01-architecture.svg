    <path
      d="M240,345 L295,345"
      stroke="#52627a"
      stroke-width="2.5"
      fill="none"
      marker-end="url(#arrow)"
    />
    <path
      d="M515,345 L850,260"
      stroke="#52627a"
      stroke-width="2.5"
      fill="none"
