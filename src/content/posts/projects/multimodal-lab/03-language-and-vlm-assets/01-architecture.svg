  width="1100"
  height="540"
  viewBox="0 0 1100 540"
>
  <defs>
    <marker
      id="arrow"
      markerWidth="10"
      markerHeight="10"
      refX="9"
      refY="3"
      orient="auto"
    >
      <path d="M0,0 L0,6 L9,3 z" fill="#52627a" />
    </marker>
  </defs>
  <rect width="1100" height="540" rx="20" fill="#f7f9fc" />
  <g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" fill="#1e293b">
    <text x="36" y="47" font-size="29" font-weight="600" fill="#1e293b">
