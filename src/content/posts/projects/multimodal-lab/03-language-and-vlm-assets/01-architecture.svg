    </text>
    <rect
      x="30"
      y="290"
      width="210"
      height="110"
      rx="13"
      fill="#e2ecfb"
      stroke="#bfcee1"
    />
    <text x="45" y="323" font-size="22" font-weight="600" fill="#1e293b">
