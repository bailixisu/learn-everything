    </text>
    <rect
      x="35"
      y="280"
      width="210"
      height="110"
      rx="13"
      fill="#e2ecfb"
      stroke="#bfcee1"
    />
    <text x="50" y="313" font-size="22" font-weight="600" fill="#1e293b">
