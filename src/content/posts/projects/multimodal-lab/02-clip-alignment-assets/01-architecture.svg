      height="110"
      rx="13"
      fill="#e2ecfb"
      stroke="#bfcee1"
    />
    <text x="305" y="133" font-size="22" font-weight="600" fill="#1e293b">
      投影 + 归一化
    </text>
    <text x="305" y="162" font-size="22" font-weight="400" fill="#1e293b">
      vᵢ ∈ Rᴰ
    </text>
    <rect
      x="290"
      y="280"
      width="240"
      height="110"
      rx="13"
      fill="#e2ecfb"
      stroke="#bfcee1"
    />
    <text x="305" y="313" font-size="22" font-weight="600" fill="#1e293b">
      投影 + 归一化
    </text>
    <text x="305" y="342" font-size="22" font-weight="400" fill="#1e293b">
