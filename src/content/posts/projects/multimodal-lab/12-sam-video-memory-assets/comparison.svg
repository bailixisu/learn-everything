<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img"><title>第五轮六种视频条件的真实序列均值</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#087E8B"/></marker></defs><rect width="100%" height="100%" fill="#F7F8F5"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="45" y="55" font-size="33" fill="#233444" font-weight="bold">第五轮六种视频条件的真实序列均值</text><text x="45" y="110" font-size="23" fill="#233444" font-weight="normal">主要指标排除首帧，对每序列的 23 帧平均，再对 8 序列等权平均。</text><text x="45" y="173" font-size="22" fill="#233444" font-weight="normal">固定首点 / 每帧独立</text><rect x="445" y="145" width="372.641341538308" height="40" rx="5" fill="#ECAA66"/><text x="1100" y="173" font-size="24" fill="#233444" font-weight="normal">54.80%</text><text x="45" y="241" font-size="22" fill="#233444" font-weight="normal">首点 + 记忆</text><rect x="445" y="213" width="488.7547251007229" height="40" rx="5" fill="#087E8B"/><text x="1100" y="241" font-size="24" fill="#233444" font-weight="normal">71.88%</text><text x="45" y="309" font-size="22" fill="#233444" font-weight="normal">首点 + 记忆 + oracle8</text><rect x="445" y="281" width="488.9878996112711" height="40" rx="5" fill="#087E8B"/><text x="1100" y="309" font-size="24" fill="#233444" font-weight="normal">71.91%</text><text x="45" y="377" font-size="22" fill="#233444" font-weight="normal">固定首框 / 每帧独立</text><rect x="445" y="349" width="248.02426193150424" height="40" rx="5" fill="#ECAA66"/><text x="1100" y="377" font-size="24" fill="#233444" font-weight="normal">36.47%</text><text x="45" y="445" font-size="22" fill="#233444" font-weight="normal">首框 + 记忆</text><rect x="445" y="417" width="634.3878312396142" height="40" rx="5" fill="#087E8B"/><text x="1100" y="445" font-size="24" fill="#233444" font-weight="normal">93.29%</text><text x="45" y="513" font-size="22" fill="#233444" font-weight="normal">首框 + 记忆 + oracle8</text><rect x="445" y="485" width="633.9667059229071" height="40" rx="5" fill="#087E8B"/><text x="1100" y="513" font-size="24" fill="#233444" font-weight="normal">93.23%</text><text x="45" y="600" font-size="22" fill="#233444" font-weight="normal">GT 提示属于模拟注释；oracle8 另外获得 16 次当帧标注 / 提示类型。</text></g></svg>