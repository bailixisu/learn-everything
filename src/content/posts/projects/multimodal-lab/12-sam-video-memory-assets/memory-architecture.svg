<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img"><title>SAM2 视频路径：记忆如何帮助，也如何传播错误</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#087E8B"/></marker></defs><rect width="100%" height="100%" fill="#F7F8F5"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="45" y="55" font-size="33" fill="#233444" font-weight="bold">SAM2 视频路径：记忆如何帮助，也如何传播错误</text><rect x="45" y="110" width="335" height="120" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="63" y="144" font-size="25" fill="#233444" font-weight="bold">当前帧 t</text><text x="63" y="177" font-size="21" fill="#233444" font-weight="normal">Image Encoder</text><text x="63" y="207" font-size="21" fill="#233444" font-weight="normal">当前图像特征</text><rect x="45" y="330" width="335" height="140" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="63" y="364" font-size="25" fill="#233444" font-weight="bold">过去状态（只到 t−1）</text><text x="63" y="397" font-size="21" fill="#233444" font-weight="normal">已预测对象 / mask</text><text x="63" y="427" font-size="21" fill="#233444" font-weight="normal">Memory Encoder 缓存</text><text x="63" y="457" font-size="21" fill="#233444" font-weight="normal">memory 槽数 7</text><rect x="485" y="190" width="335" height="140" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="503" y="224" font-size="25" fill="#233444" font-weight="bold">Memory Attention</text><text x="503" y="257" font-size="21" fill="#233444" font-weight="normal">当前图像查询历史表示</text><text x="503" y="287" font-size="21" fill="#233444" font-weight="normal">没有未来帧提示</text><path d="M380,170 L485,220" fill="none" stroke="#087E8B" stroke-width="3" marker-end="url(#arrow)"/><path d="M380,385 L485,300" fill="none" stroke="#087E8B" stroke-width="3" marker-end="url(#arrow)"/><rect x="920" y="190" width="310" height="140" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="938" y="224" font-size="25" fill="#233444" font-weight="bold">Mask Decoder</text><text x="938" y="257" font-size="21" fill="#233444" font-weight="normal">首帧目标经记忆传递</text><text x="938" y="287" font-size="21" fill="#233444" font-weight="normal">输出当前帧区域</text><path d="M820,260 L920,260" fill="none" stroke="#087E8B" stroke-width="3" marker-end="url(#arrow)"/><path d="M1080,330 L1080,430 L400,430" fill="none" stroke="#087E8B" stroke-width="3" marker-end="url(#arrow)"/><text x="520" y="416" font-size="21" fill="#087E8B" font-weight="normal">当前结果编码后，供后续帧使用</text><text x="45" y="545" font-size="24" fill="#233444" font-weight="normal">oracle8：第 8/16 帧先保存预测，再用当帧 GT 提示纠正；不回写过去。</text><text x="45" y="585" font-size="23" fill="#233444" font-weight="normal">独立对照：每帧 reset state，仍复用首帧坐标，因此包含坐标陈旧的影响。</text></g></svg>