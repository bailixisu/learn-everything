<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">微调后的转录错误更多了</title><desc id="desc">原创概念图；具体数值来自本文声明的冻结实验记录。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#416878"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#213a49;font-size:24px}.small{font-size:20px;fill:#526777}.title{font-size:32px;font-weight:700}.box{stroke:#acc7d1;stroke-width:2;fill:#e9f4f4}.flow{stroke:#416878;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1000" height="550" fill="#f7f8f5"/><text class="title" x="42" y="58">微调后的转录错误更多了</text><text class="small" x="42" y="105">同一 33 句测试 / 478 个参考词；越低越好。验证 loss 改善不保证自由解码改善。</text><text x="45" y="215">Whisper tiny 基座</text><rect x="330" y="180" width="264.64435146443515" height="55" rx="6" fill="#087e8b"/><text x="614.6443514644352" y="216">11.51%</text><text x="45" y="325">15 句 LoRA 适配</text><rect x="330" y="290" width="505.2301255230126" height="55" rx="6" fill="#bc5c47"/><text x="855.2301255230126" y="326">21.97%</text><text class="small" x="45" y="450">训练 / 验证 / 测试：15 / 25 / 33 句；同一说话人，章节分离。</text><text class="small" x="45" y="490">验证 loss：1.7276 → 1.4441；最终测试 WER：11.51% → 21.97%。</text></svg>