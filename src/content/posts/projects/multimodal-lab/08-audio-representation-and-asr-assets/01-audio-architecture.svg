<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">声音进模型后，有三种不同的目标</title><desc id="desc">原创概念图；具体数值来自本文声明的冻结实验记录。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#416878"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#213a49;font-size:24px}.small{font-size:20px;fill:#526777}.title{font-size:32px;font-weight:700}.box{stroke:#acc7d1;stroke-width:2;fill:#e9f4f4}.flow{stroke:#416878;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1000" height="620" fill="#f7f8f5"/><text class="title" x="42" y="58">声音进模型后，有三种不同的目标</text><text class="small" x="42" y="100">同一波形，任务与监督决定了表示保留什么信息。</text><rect class="box" x="35" y="150" width="150" height="100" rx="14"/><text x="110.0" y="190" text-anchor="middle">波形</text><text class="small" x="110.0" y="223" text-anchor="middle">16 kHz 示例</text><path class="flow" d="M190 200 L230 200"/><rect class="box" x="235" y="150" width="160" height="100" rx="14"/><text x="315.0" y="190" text-anchor="middle">log-mel</text><text class="small" x="315.0" y="223" text-anchor="middle">声学特征</text><path class="flow" d="M400 200 L440 200"/><rect class="box" x="445" y="150" width="160" height="100" rx="14"/><text x="525.0" y="190" text-anchor="middle">Encoder</text><text class="small" x="525.0" y="223" text-anchor="middle">听到什么</text><path class="flow" d="M610 200 L650 200"/><rect class="box" x="655" y="150" width="150" height="100" rx="14"/><text x="730.0" y="190" text-anchor="middle">Decoder</text><text class="small" x="730.0" y="223" text-anchor="middle">前缀 + 音频</text><path class="flow" d="M810 200 L845 200"/><rect class="box" x="850" y="150" width="120" height="100" rx="14"/><text x="910.0" y="190" text-anchor="middle">文字</text><text class="small" x="910.0" y="223" text-anchor="middle">ASR</text><text class="small" x="50" y="300">Whisper：交叉注意力读取音频；训练预测转录 token。</text><rect class="box" x="40" y="365" width="160" height="100" rx="14"/><text x="120.0" y="405" text-anchor="middle">波形</text><path class="flow" d="M205 415 L245 415"/><rect class="box" x="250" y="365" width="170" height="100" rx="14"/><text x="335.0" y="405" text-anchor="middle">压缩 Encoder</text><path class="flow" d="M425 415 L465 415"/><rect class="box" x="470" y="365" width="170" height="100" rx="14"/><text x="555.0" y="405" text-anchor="middle">RVQ 码本</text><text class="small" x="555.0" y="438" text-anchor="middle">离散声学 token</text><path class="flow" d="M645 415 L685 415"/><rect class="box" x="690" y="365" width="150" height="100" rx="14"/><text x="765.0" y="405" text-anchor="middle">Decoder</text><text class="small" x="765.0" y="438" text-anchor="middle">重建波形</text><path class="flow" d="M845 415 L880 415"/><rect class="box" x="885" y="365" width="85" height="100" rx="14"/><text x="927.5" y="405" text-anchor="middle">声音</text><text class="small" x="50" y="520">Codec 保留可重建细节；CLAP 式双塔保留可检索语义。</text><text class="small" x="50" y="560">音频分类 ≠ 音频检索 ≠ ASR ≠ 自然 TTS。</text></svg>