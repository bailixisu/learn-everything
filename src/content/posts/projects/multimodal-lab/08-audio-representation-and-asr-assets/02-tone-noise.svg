<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="585" viewBox="0 0 1000 585" role="img" aria-labelledby="title desc"><title id="title">先在可控声音上检验增强，再谈真实语音</title><desc id="desc">原创概念图；具体数值来自本文声明的冻结实验记录。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#416878"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#213a49;font-size:24px}.small{font-size:20px;fill:#526777}.title{font-size:32px;font-weight:700}.box{stroke:#acc7d1;stroke-width:2;fill:#e9f4f4}.flow{stroke:#416878;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1000" height="585" fill="#f7f8f5"/><text class="title" x="42" y="58">先在可控声音上检验增强，再谈真实语音</text><text class="small" x="42" y="103">九类音调；强噪声测试准确率，越高越好。各组测试 270 条。</text><text x="45" y="189">seed 42 / 干净训练</text><rect x="355" y="155" width="202.22222059965134" height="47" rx="5" fill="#879eac"/><text x="572.2222205996513" y="189">19.26%</text><text x="45" y="257">seed 42 / 噪声增强</text><rect x="355" y="223" width="346.11111134290695" height="47" rx="5" fill="#087e8b"/><text x="716.111111342907" y="257">32.96%</text><text x="45" y="354">seed 43 / 干净训练</text><rect x="355" y="320" width="178.88888865709305" height="47" rx="5" fill="#879eac"/><text x="548.888888657093" y="354">17.04%</text><text x="45" y="422">seed 43 / 噪声增强</text><rect x="355" y="388" width="466.6666701436043" height="47" rx="5" fill="#087e8b"/><text x="836.6666701436043" y="422">44.44%</text><text class="small" x="45" y="535">增强改善强噪声，但干净、频率偏移更大的测试仍只有 50%—63%。</text></svg>