<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">一个音频，两套识别器与一个失败短段</title><desc id="desc">原创概念图；具体数值来自本文声明的冻结实验记录。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#416878"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#213a49;font-size:24px}.small{font-size:20px;fill:#526777}.title{font-size:32px;font-weight:700}.box{stroke:#acc7d1;stroke-width:2;fill:#e9f4f4}.flow{stroke:#416878;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1000" height="590" fill="#f7f8f5"/><text class="title" x="42" y="58">一个音频，两套识别器与一个失败短段</text><text class="small" x="42" y="103">en06_procedure / segment192；该案例为事后选出的过碎负例。</text><rect class="box" x="45" y="145" width="385" height="105" rx="14"/><text x="237.5" y="185" text-anchor="middle">极短 TTS 输入：Next,</text><text class="small" x="237.5" y="218" text-anchor="middle">192 步，无 EOS，15.28 秒</text><rect class="box" x="545" y="145" width="395" height="105" rx="14"/><text x="742.5" y="185" text-anchor="middle">最终拼接的同一份音频</text><text class="small" x="742.5" y="218" text-anchor="middle">不裁尾、不删段</text><path class="flow" d="M435 198 L540 198"/><path class="flow" d="M742 250 L742 320"/><path class="flow" d="M742 280 L242 280 L242 320"/><rect class="box" x="45" y="325" width="395" height="120" rx="14"/><text x="242.5" y="365" text-anchor="middle">Qwen ASR</text><text class="small" x="242.5" y="398" text-anchor="middle">1 个删除；无 S / I</text><rect class="box" x="545" y="325" width="395" height="120" rx="14"/><text x="742.5" y="365" text-anchor="middle">Whisper tiny</text><text class="small" x="742.5" y="398" text-anchor="middle">1 替换 + 26 删除</text><text class="small" x="45" y="505">Whisper 的两个不同底层 generate 调用各 hit 440 新 token。</text><text class="small" x="45" y="540">重复 “Naaaa…” 是 ASR 解码异常证据；27 个错误不能全归因于 TTS。</text></svg>