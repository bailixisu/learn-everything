<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title"><title id="title">High-noise redistribution did not pass the task gate</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1400" height="720" fill="#f7f8f5"/><g font-family="Arial, Helvetica, sans-serif"><text x="56" y="62" fill="#203644" font-size="34" text-anchor="start">High-noise redistribution did not pass the task gate</text><text x="56" y="110" fill="#657581" font-size="23" text-anchor="start">Correct alias counts out of 18 generated requests; paired training seeds</text><text x="56" y="216" fill="#203644" font-size="27" text-anchor="start">seed 61</text><text x="285" y="180" fill="#087e8b" font-size="23" text-anchor="start">CLIP</text><text x="285" y="216" fill="#203644" font-size="23" text-anchor="start">Uniform 2/18  -&gt;  high-noise mix 1/18</text><rect x="285" y="235" width="70" height="18" fill="#087e8b" opacity=".45"/><rect x="285" y="262" width="35" height="18" fill="#087e8b"/><text x="810" y="180" fill="#bc6929" font-size="23" text-anchor="start">SigLIP2</text><text x="810" y="216" fill="#203644" font-size="23" text-anchor="start">Uniform 3/18  -&gt;  high-noise mix 3/18</text><rect x="810" y="235" width="105" height="18" fill="#bc6929" opacity=".45"/><rect x="810" y="262" width="105" height="18" fill="#bc6929"/><text x="56" y="350" fill="#203644" font-size="27" text-anchor="start">seed 73</text><text x="285" y="314" fill="#087e8b" font-size="23" text-anchor="start">CLIP</text><text x="285" y="350" fill="#203644" font-size="23" text-anchor="start">Uniform 3/18  -&gt;  high-noise mix 4/18</text><rect x="285" y="369" width="105" height="18" fill="#087e8b" opacity=".45"/><rect x="285" y="396" width="140" height="18" fill="#087e8b"/><text x="810" y="314" fill="#bc6929" font-size="23" text-anchor="start">SigLIP2</text><text x="810" y="350" fill="#203644" font-size="23" text-anchor="start">Uniform 3/18  -&gt;  high-noise mix 3/18</text><rect x="810" y="369" width="105" height="18" fill="#bc6929" opacity=".45"/><rect x="810" y="396" width="105" height="18" fill="#bc6929"/><text x="56" y="484" fill="#203644" font-size="27" text-anchor="start">seed 89</text><text x="285" y="448" fill="#087e8b" font-size="23" text-anchor="start">CLIP</text><text x="285" y="484" fill="#203644" font-size="23" text-anchor="start">Uniform 3/18  -&gt;  high-noise mix 3/18</text><rect x="285" y="503" width="105" height="18" fill="#087e8b" opacity=".45"/><rect x="285" y="530" width="105" height="18" fill="#087e8b"/><text x="810" y="448" fill="#bc6929" font-size="23" text-anchor="start">SigLIP2</text><text x="810" y="484" fill="#203644" font-size="23" text-anchor="start">Uniform 3/18  -&gt;  high-noise mix 4/18</text><rect x="810" y="503" width="105" height="18" fill="#bc6929" opacity=".45"/><rect x="810" y="530" width="140" height="18" fill="#bc6929"/><text x="56" y="625" fill="#203644" font-size="22" text-anchor="start">Gate: +10pp alias and &lt;=5pp natural-name drop, BOTH evaluators, &gt;=2/3 seeds.</text><text x="56" y="669" fill="#bc6929" font-size="24" text-anchor="start">Observed: 0/3 training seeds pass. One extra correct image = 5.56pp.</text></g></svg>