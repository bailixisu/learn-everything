<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="710" viewBox="0 0 1400 710" role="img" aria-labelledby="title"><title id="title">Where conditioning and LoRA enter Klein 4B</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1400" height="710" fill="#f7f8f5"/><g font-family="Arial, Helvetica, sans-serif"><text x="56" y="62" fill="#203644" font-size="34" text-anchor="start">Where conditioning and LoRA enter Klein 4B</text><text x="56" y="108" fill="#657581" font-size="23" text-anchor="start">Frozen Qwen3 + frozen VAE; learn low-rank updates inside the image transformer</text><rect x="56" y="166" width="320" height="100" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="216.0" y="204" fill="#203644" font-size="24" text-anchor="middle">Text prompt</text><text x="216.0" y="236" fill="#657581" font-size="19" text-anchor="middle">natural name or opaque alias</text><rect x="472" y="166" width="420" height="100" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="682.0" y="204" fill="#203644" font-size="24" text-anchor="middle">Qwen3 text encoder</text><text x="682.0" y="236" fill="#657581" font-size="19" text-anchor="middle">hidden 9 / 18 / 27 -&gt; 7680</text><rect x="988" y="166" width="355" height="100" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="1165.5" y="204" fill="#203644" font-size="24" text-anchor="middle">Text condition</text><text x="1165.5" y="236" fill="#657581" font-size="19" text-anchor="middle">sequence of hidden vectors</text><path d="M376 216 L470 216" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><path d="M892 216 L986 216" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><rect x="56" y="366" width="320" height="100" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="216.0" y="404" fill="#203644" font-size="24" text-anchor="middle">Training photo</text><text x="216.0" y="436" fill="#657581" font-size="19" text-anchor="middle">VAE -&gt; patchify -&gt; normalize</text><rect x="472" y="366" width="420" height="100" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="682.0" y="404" fill="#203644" font-size="24" text-anchor="middle">Noisy latent</text><text x="682.0" y="436" fill="#657581" font-size="19" text-anchor="middle">(1-sigma) clean + sigma noise</text><rect x="988" y="346" width="355" height="140" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="1165.5" y="384" fill="#203644" font-size="24" text-anchor="middle">FLUX image transformer</text><text x="1165.5" y="416" fill="#657581" font-size="19" text-anchor="middle">5 double + 20 single blocks</text><path d="M376 416 L470 416" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><path d="M892 416 L986 416" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><path d="M1165 266 L1165 344" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><rect x="56" y="540" width="570" height="104" rx="16" fill="#fff1df" stroke="#bfcccf"/><text x="341.0" y="578" fill="#203644" font-size="24" text-anchor="middle">LoRA: W x + (alpha/r) B(A x)</text><text x="341.0" y="610" fill="#657581" font-size="19" text-anchor="middle">Only A/B trained; base, VAE and Qwen frozen</text><path d="M626 592 L790 592" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><path d="M790 592 L790 517" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><path d="M790 517 L1030 517" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><path d="M1030 517 L1030 488" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><rect x="956" y="558" width="386" height="100" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="1149.0" y="596" fill="#203644" font-size="24" text-anchor="middle">Velocity prediction</text><text x="1149.0" y="628" fill="#657581" font-size="19" text-anchor="middle">MSE vs noise - clean</text><path d="M1165 486 L1165 556" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/></g></svg>