<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="710" viewBox="0 0 1400 710" role="img" aria-labelledby="title"><title id="title">A trainable input connected to a frozen generator</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1400" height="710" fill="#f7f8f5"/><g font-family="Arial, Helvetica, sans-serif"><text x="56" y="62" fill="#203644" font-size="34" text-anchor="start">A trainable input connected to a frozen generator</text><text x="56" y="110" fill="#657581" font-size="24" text-anchor="start">Train 6 x 2560 = 15,360 input values; freeze all model weights</text><rect x="56" y="167" width="340" height="114" rx="16" fill="#fff1df" stroke="#bfcccf"/><text x="226.0" y="205" fill="#203644" font-size="24" text-anchor="middle">Six single tokens</text><text x="226.0" y="237" fill="#657581" font-size="19" text-anchor="middle">all initialized from flower</text><rect x="493" y="167" width="395" height="114" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="690.5" y="205" fill="#203644" font-size="24" text-anchor="middle">Input embedding override</text><text x="690.5" y="237" fill="#657581" font-size="19" text-anchor="middle">six external trainable vectors</text><rect x="985" y="167" width="359" height="114" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="1164.5" y="205" fill="#203644" font-size="24" text-anchor="middle">Frozen Qwen3</text><text x="1164.5" y="237" fill="#657581" font-size="19" text-anchor="middle">36 layers; gradients enabled</text><path d="M396 224 L491 224" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><path d="M888 224 L983 224" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><rect x="985" y="356" width="359" height="112" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="1164.5" y="394" fill="#203644" font-size="24" text-anchor="middle">Hidden layers 9 / 18 / 27</text><text x="1164.5" y="426" fill="#657581" font-size="19" text-anchor="middle">concatenate -&gt; 7680 dims</text><path d="M1165 281 L1165 354" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><rect x="493" y="356" width="395" height="112" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="690.5" y="394" fill="#203644" font-size="24" text-anchor="middle">Frozen FLUX transformer</text><text x="690.5" y="426" fill="#657581" font-size="19" text-anchor="middle">predict velocity from noisy latent</text><path d="M985 412 L891 412" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><rect x="56" y="356" width="340" height="112" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="226.0" y="394" fill="#203644" font-size="24" text-anchor="middle">Flow velocity MSE</text><text x="226.0" y="426" fill="#657581" font-size="19" text-anchor="middle">backpropagate through frozen ops</text><path d="M493 412 L398 412" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><path d="M225 468 L225 554 L930 554 L930 305 L690 305 L690 283" fill="none" stroke="#bc6929" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="56" y="617" fill="#bc6929" font-size="25" text-anchor="start">Frozen weights do not mean no_grad: a differentiable path to inputs is required.</text><text x="56" y="663" fill="#657581" font-size="23" text-anchor="start">Saved tokenizer + vectors + custom encoder must be loaded together at inference.</text></g></svg>