<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title"><title id="title">Do not confuse space, network and training target</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1400" height="650" fill="#f7f8f5"/><g font-family="Arial, Helvetica, sans-serif"><text x="56" y="62" fill="#203644" font-size="34" text-anchor="start">Do not confuse space, network and training target</text><text x="56" y="110" fill="#657581" font-size="24" text-anchor="start">These choices answer different questions. They can be combined.</text><rect x="56" y="152" width="412" height="96" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="262.0" y="190" fill="#203644" font-size="24" text-anchor="middle">Representation</text><text x="262.0" y="222" fill="#657581" font-size="19" text-anchor="middle">pixels or VAE latent</text><rect x="494" y="152" width="412" height="96" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="700.0" y="190" fill="#203644" font-size="24" text-anchor="middle">Backbone</text><text x="700.0" y="222" fill="#657581" font-size="19" text-anchor="middle">U-Net or Transformer</text><rect x="931" y="152" width="412" height="96" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="1137.0" y="190" fill="#203644" font-size="24" text-anchor="middle">Objective</text><text x="1137.0" y="222" fill="#657581" font-size="19" text-anchor="middle">epsilon / v / flow velocity</text><text x="56" y="320" fill="#203644" font-size="28" text-anchor="start">Our tiny flow: time 0 = noise; time 1 = data</text><rect x="56" y="364" width="330" height="102" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="221.0" y="402" fill="#203644" font-size="24" text-anchor="middle">Noise z at t = 0</text><text x="221.0" y="434" fill="#657581" font-size="19" text-anchor="middle">xt = (1 - t) z + t x</text><rect x="534" y="364" width="330" height="102" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="699.0" y="402" fill="#203644" font-size="24" text-anchor="middle">Velocity target</text><text x="699.0" y="434" fill="#657581" font-size="19" text-anchor="middle">u = x - z</text><rect x="1010" y="364" width="330" height="102" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="1175.0" y="402" fill="#203644" font-size="24" text-anchor="middle">Data x at t = 1</text><text x="1175.0" y="434" fill="#657581" font-size="19" text-anchor="middle">Euler: x += dt * v</text><path d="M386 413 L532 413" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><path d="M864 413 L1008 413" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><text x="56" y="548" fill="#203644" font-size="27" text-anchor="start">Klein uses the reverse convention: time 0 = data; time 1 = noise</text><text x="56" y="596" fill="#087e8b" font-size="24" text-anchor="start">xt = (1 - sigma) clean + sigma noise; target = noise - clean; sample 1 -&gt; 0</text></g></svg>