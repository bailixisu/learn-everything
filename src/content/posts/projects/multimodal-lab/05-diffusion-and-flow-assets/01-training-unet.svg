<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="735" viewBox="0 0 1400 735" role="img" aria-labelledby="title"><title id="title">DDPM training and the repaired U-Net</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><rect width="1400" height="735" fill="#f7f8f5"/><g font-family="Arial, Helvetica, sans-serif"><text x="56" y="62" fill="#203644" font-size="34" text-anchor="start">DDPM training and the repaired U-Net</text><text x="56" y="104" fill="#657581" font-size="22" text-anchor="start">Training: one random time per image; sampling: repeat a compatible update</text><rect x="56" y="150" width="230" height="96" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="171.0" y="188" fill="#203644" font-size="24" text-anchor="middle">Clean image x0</text><text x="171.0" y="220" fill="#657581" font-size="19" text-anchor="middle">MNIST: 1 x 28 x 28</text><rect x="382" y="150" width="390" height="96" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="577.0" y="188" fill="#203644" font-size="24" text-anchor="middle">Known corruption xt</text><text x="577.0" y="220" fill="#657581" font-size="19" text-anchor="middle">xt = a(t) x0 + s(t) noise</text><rect x="874" y="150" width="450" height="96" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="1099.0" y="188" fill="#203644" font-size="24" text-anchor="middle">Denoising network</text><text x="1099.0" y="220" fill="#657581" font-size="19" text-anchor="middle">prediction = f(xt, time, class)</text><path d="M286 198 L380 198" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><path d="M772 198 L872 198" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><rect x="380" y="286" width="395" height="96" rx="16" fill="#fff1df" stroke="#bfcccf"/><text x="577.5" y="324" fill="#203644" font-size="24" text-anchor="middle">Sample time + noise</text><text x="577.5" y="356" fill="#657581" font-size="19" text-anchor="middle">time is not an iteration counter</text><path d="M577 286 L577 247" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><rect x="876" y="286" width="448" height="96" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="1100.0" y="324" fill="#203644" font-size="24" text-anchor="middle">Match sampled noise</text><text x="1100.0" y="356" fill="#657581" font-size="19" text-anchor="middle">MSE(prediction, noise)</text><path d="M1098 246 L1098 286" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><text x="56" y="452" fill="#203644" font-size="26" text-anchor="start">A multi-scale U-Net preserves detail and sees global structure</text><rect x="56" y="488" width="205" height="94" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="158.5" y="526" fill="#203644" font-size="24" text-anchor="middle">28 x 28</text><text x="158.5" y="558" fill="#657581" font-size="19" text-anchor="middle">32 channels</text><rect x="306" y="510" width="205" height="94" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="408.5" y="548" fill="#203644" font-size="24" text-anchor="middle">14 x 14</text><text x="408.5" y="580" fill="#657581" font-size="19" text-anchor="middle">64 channels</text><rect x="555" y="533" width="240" height="94" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="675.0" y="571" fill="#203644" font-size="24" text-anchor="middle">7 x 7</text><text x="675.0" y="603" fill="#657581" font-size="19" text-anchor="middle">128 + attention</text><rect x="840" y="510" width="205" height="94" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="942.5" y="548" fill="#203644" font-size="24" text-anchor="middle">14 x 14</text><text x="942.5" y="580" fill="#657581" font-size="19" text-anchor="middle">upsample + skip</text><rect x="1090" y="488" width="235" height="94" rx="16" fill="#e6f3f2" stroke="#bfcccf"/><text x="1207.5" y="526" fill="#203644" font-size="24" text-anchor="middle">28 x 28</text><text x="1207.5" y="558" fill="#657581" font-size="19" text-anchor="middle">upsample + skip</text><path d="M261 535 L304 557" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><path d="M511 557 L553 580" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><path d="M795 580 L838 557" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><path d="M1045 557 L1088 535" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#a)"/><path d="M160 488 L160 468 L1210 468 L1210 488" fill="none" stroke="#bc6929" stroke-width="3" stroke-dasharray="8 6"/><text x="680" y="686" fill="#657581" font-size="21" text-anchor="middle">Orange: high-resolution skip. Time/class FiLM modulates residual blocks.</text></g></svg>