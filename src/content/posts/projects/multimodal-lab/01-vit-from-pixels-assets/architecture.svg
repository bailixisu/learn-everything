<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img"><title>真实教学 ViT：像素如何成为分类结果</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#087E8B"/></marker></defs><rect width="100%" height="100%" fill="#F7F8F5"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="45" y="55" font-size="33" fill="#233444" font-weight="bold">真实教学 ViT：像素如何成为分类结果</text><rect x="45" y="115" width="230" height="120" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="63" y="149" font-size="25" fill="#233444" font-weight="bold">MNIST 灰度图</text><text x="63" y="182" font-size="21" fill="#233444" font-weight="normal">B × 1 × 28 × 28</text><rect x="335" y="115" width="280" height="120" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="353" y="149" font-size="25" fill="#233444" font-weight="bold">共享 patch 投影</text><text x="353" y="182" font-size="21" fill="#233444" font-weight="normal">Conv2d：kernel=stride=4</text><text x="353" y="212" font-size="21" fill="#233444" font-weight="normal">B × 64 × 7 × 7</text><path d="M275,175 L335,175" fill="none" stroke="#087E8B" stroke-width="3" marker-end="url(#arrow)"/><rect x="675" y="115" width="260" height="120" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="693" y="149" font-size="25" fill="#233444" font-weight="bold">展平空间维度</text><text x="693" y="182" font-size="21" fill="#233444" font-weight="normal">49 个 patch token</text><text x="693" y="212" font-size="21" fill="#233444" font-weight="normal">B × 49 × 64</text><path d="M615,175 L675,175" fill="none" stroke="#087E8B" stroke-width="3" marker-end="url(#arrow)"/><rect x="995" y="115" width="240" height="120" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="1013" y="149" font-size="25" fill="#233444" font-weight="bold">加位置向量</text><text x="1013" y="182" font-size="21" fill="#233444" font-weight="normal">每个位置 64 维</text><text x="1013" y="212" font-size="21" fill="#233444" font-weight="normal">无 CLS token</text><path d="M935,175 L995,175" fill="none" stroke="#087E8B" stroke-width="3" marker-end="url(#arrow)"/><path d="M1115,235 L1115,310" fill="none" stroke="#087E8B" stroke-width="3" marker-end="url(#arrow)"/><rect x="760" y="310" width="475" height="130" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="778" y="344" font-size="25" fill="#233444" font-weight="bold">2 层 Transformer Encoder</text><text x="778" y="377" font-size="21" fill="#233444" font-weight="normal">每层：Pre-LN → Attention + 残差</text><text x="778" y="407" font-size="21" fill="#233444" font-weight="normal">Pre-LN → MLP(64→128→64) + 残差</text><rect x="370" y="310" width="305" height="130" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="388" y="344" font-size="25" fill="#233444" font-weight="bold">mean pooling</text><text x="388" y="377" font-size="21" fill="#233444" font-weight="normal">49 个输出向量取均值</text><text x="388" y="407" font-size="21" fill="#233444" font-weight="normal">B × 64</text><path d="M760,375 L675,375" fill="none" stroke="#087E8B" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="310" width="245" height="130" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="63" y="344" font-size="25" fill="#233444" font-weight="bold">LayerNorm + 线性头</text><text x="63" y="377" font-size="21" fill="#233444" font-weight="normal">64 → 10 类 logits</text><text x="63" y="407" font-size="21" fill="#233444" font-weight="normal">交叉熵更新全模型</text><path d="M370,375 L290,375" fill="none" stroke="#087E8B" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="515" font-size="25" fill="#233444" font-weight="normal">本实验：4 头，每头 16 维；71,946 参数；无 dropout。</text><text x="45" y="559" font-size="23" fill="#233444" font-weight="normal">论文 ViT-B/16：更大的宽度与深度，常用 CLS；不能把两者当同一规模。</text></g></svg>