<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img"><title>第二轮：注意力是否一定胜过卷积？</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#087E8B"/></marker></defs><rect width="100%" height="100%" fill="#F7F8F5"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="45" y="55" font-size="33" fill="#233444" font-weight="bold">第二轮：注意力是否一定胜过卷积？</text><text x="45" y="100" font-size="23" fill="#233444" font-weight="normal">同一划分：12,000 train / 2,000 validation / 4,000 test；3 seeds</text><text x="45" y="187" font-size="24" fill="#233444" font-weight="normal">CNN</text><rect x="260" y="155" width="701.22" height="46" fill="#087E8B" rx="6"/><text x="985" y="187" font-size="23" fill="#233444" font-weight="normal">97.39 ± 0.19%</text><text x="45" y="287" font-size="24" fill="#233444" font-weight="normal">ViT P=4</text><rect x="260" y="255" width="674.52" height="46" fill="#087E8B" rx="6"/><text x="985" y="287" font-size="23" fill="#233444" font-weight="normal">93.68 ± 0.09%</text><text x="45" y="387" font-size="24" fill="#233444" font-weight="normal">ViT 无位置</text><rect x="260" y="355" width="519.60" height="46" fill="#ECAA66" rx="6"/><text x="985" y="387" font-size="23" fill="#233444" font-weight="normal">72.17 ± 1.89%</text><text x="45" y="487" font-size="24" fill="#233444" font-weight="normal">ViT P=7</text><rect x="260" y="455" width="677.28" height="46" fill="#087E8B" rx="6"/><text x="985" y="487" font-size="23" fill="#233444" font-weight="normal">94.07 ± 0.74%</text><text x="45" y="595" font-size="23" fill="#233444" font-weight="normal">条长从 0% 开始；± 为训练种子的样本标准差，不是置信区间。</text></g></svg>