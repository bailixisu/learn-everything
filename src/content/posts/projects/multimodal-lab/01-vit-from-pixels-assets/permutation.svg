<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img"><title>为何不能只用掉分来解释位置编码？</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#087E8B"/></marker></defs><rect width="100%" height="100%" fill="#F7F8F5"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="45" y="55" font-size="33" fill="#233444" font-weight="bold">为何不能只用掉分来解释位置编码？</text><rect x="45" y="120" width="350" height="130" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="63" y="154" font-size="25" fill="#233444" font-weight="bold">原 token 顺序</text><text x="63" y="187" font-size="21" fill="#233444" font-weight="normal">A, B, C, D</text><text x="63" y="217" font-size="21" fill="#233444" font-weight="normal">无位置：内容集合相同</text><rect x="500" y="120" width="350" height="130" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="518" y="154" font-size="25" fill="#233444" font-weight="bold">仅置换内容</text><text x="518" y="187" font-size="21" fill="#233444" font-weight="normal">C, A, D, B</text><text x="518" y="217" font-size="21" fill="#233444" font-weight="normal">有位置：内容与位置错开</text><path d="M395,185 L500,185" fill="none" stroke="#087E8B" stroke-width="3" marker-end="url(#arrow)"/><rect x="905" y="120" width="330" height="130" rx="14" fill="#E5F3F1" stroke="#AEC5CA"/><text x="923" y="154" font-size="25" fill="#233444" font-weight="bold">同一权重 eval</text><text x="923" y="187" font-size="21" fill="#233444" font-weight="normal">dropout=0</text><text x="923" y="217" font-size="21" fill="#233444" font-weight="normal">比较全部 logits</text><path d="M850,185 L905,185" fill="none" stroke="#087E8B" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="340" font-size="30" fill="#087E8B" font-weight="normal">无位置：最大 logit 差 2.62e−6 ～ 3.04e−6</text><text x="60" y="400" font-size="30" fill="#B95D30" font-weight="normal">有位置：最大 logit 差约 11.10 ～ 13.15</text><text x="60" y="475" font-size="24" fill="#233444" font-weight="normal">置换实验测结构性质；分类准确率测特定数据与训练协议下的表现。</text></g></svg>